：高到低\u003c/option>\u003c/select>\u003c/label>\u003cp>显示 \u003cstrong id=\"count\">75\u003c/strong> / 75 篇\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"grid\" id=\"grid\">\u003c/div>\u003cdiv class=\"empty\" id=\"empty\" hidden>没有找到相关诗词，请换个关键词。\u003c/div>\u003c/section>\n  \u003cdiv class=\"mobileListBar\">\u003cbutton class=\"randomPoemButton\" id=\"randomPoem\" type=\"button\">随机背一首\u003c/button>\u003c/div>\n\u003c/main>\n\u003cmain id=\"detailView\" hidden>\u003carticle class=\"detail\" id=\"detail\">\u003c/article>\u003c/main>\n\u003cfooter id=\"footer\">全部数据和功能均已包含在此 HTML 文件中，无需联网即可阅读；来源链接需联网打开。\u003c/footer>\n\u003cscript type=\"application/json\" id=\"poemData\">[{\"order\":1,\"slug\":\"poem-01\",\"title\":\"江南\",\"titlePinyin\":[\"jiāng\",\"nán\"],\"dynasty\":\"两汉\",\"author\":\"汉乐府\",\"lines\":[\"江南可采莲，\",\"莲叶何田田，\",\"鱼戏莲叶间。\",\"鱼戏莲叶东，\",\"鱼戏莲叶西，\",\"鱼戏莲叶南，\",\"鱼戏莲叶北。\"],\"pinyin\":[[\"jiāng\",\"nán\",\"kě\",\"cǎi\",\"lián\"],[\"lián\",\"yè\",\"hé\",\"tián\",\"tián\"],[\"yú\",\"xì\",\"lián\",\"yè\",\"jiān\"],[\"yú\",\"xì\",\"lián\",\"yè\",\"dōng\"],[\"yú\",\"xì\",\"lián\",\"yè\",\"xī\"],[\"yú\",\"xì\",\"lián\",\"yè\",\"nán\"],[\"yú\",\"xì\",\"lián\",\"yè\",\"běi\"]],\"meaning\":\"江南正是采莲的好时节，莲叶层层相连，鱼儿在莲叶四周自由穿游。\",\"detailedMeaning\":\"江南水乡到了适合采莲的季节，莲叶茂盛，铺展得又密又圆。鱼儿一会儿游到莲叶东边，一会儿游到西、南、北边，反复的句式写出了水面热闹活泼的景象。\",\"sourceUrl\":\"https://www.shicile.com/detail/1880297199501\"},{\"order\":2,\"slug\":\"poem-02\",\"title\":\"长歌行\",\"titlePinyin\":[\"cháng\",\"gē\",\"xíng\"],\"dynasty\":\"两汉\",\"author\":\"汉乐府\",\"lines\":[\"青青园中葵，\",\"朝露待日晞。\",\"阳春布德泽，\",\"万物生光辉。\",\"常恐秋节至，\",\"焜黄华叶衰。\",\"百川东到海，\",\"何时复西归？\",\"少壮不努力，\",\"老大徒伤悲。\"],\"pinyin\":[[\"qīng\",\"qīng\",\"yuán\",\"zhōng\",\"kuí\"],[\"zhāo\",\"lù\",\"dài\",\"rì\",\"xī\"],[\"yáng\",\"chūn\",\"bù\",\"dé\",\"zé\"],[\"wàn\",\"wù\",\"shēng\",\"guāng\",\"huī\"],[\"cháng\",\"kǒng\",\"qiū\",\"jié\",\"zhì\"],[\"kūn\",\"huáng\",\"huā\",\"yè\",\"shuāi\"],[\"bǎi\",\"chuān\",\"dōng\",\"dào\",\"hǎi\"],[\"hé\",\"shí\",\"fù\",\"xī\",\"guī\"],[\"shào\",\"zhuàng\",\"bù\",\"nǔ\",\"lì\"],[\"lǎo\",\"dà\",\"tú\",\"shāng\",\"bēi\"]],\"meaning\":\"园中的葵菜迎着阳光生长；青春一去不返，应珍惜时间、努力进取。\",\"detailedMeaning\":\"园中葵菜上的露水等待阳光晒干，春天把光泽送给万物。江河奔向大海不会回头，人的少年时光也不能重来，因此应趁年轻勤奋努力，不要到老才徒然悲伤。\",\"sourceUrl\":\"https://www.shicile.com/detail/9660298954280\"},{\"order\":3,\"slug\":\"poem-03\",\"title\":\"敕勒歌\",\"titlePinyin\":[\"chì\",\"lè\",\"gē\"],\"dynasty\":\"南北朝\",\"author\":\"乐府诗集\",\"lines\":[\"敕勒川，阴山下。\",\"天似穹庐，笼盖四野。\",\"天苍苍，野茫茫。\",\"风吹草低见牛羊。\"],\"pinyin\":[[\"chì\",\"lè\",\"chuān\",\"yīn\",\"shān\",\"xià\"],[\"tiān\",\"sì\",\"qióng\",\"lú\",\"lǒng\",\"gài\",\"sì\",\"yě\"],[\"tiān\",\"cāng\",\"cāng\",\"yě\",\"máng\",\"máng\"],[\"fēng\",\"chuī\",\"cǎo\",\"dī\",\"xiàn\",\"niú\",\"yáng\"]],\"meaning\":\"敕勒川辽阔无边，天空像帐篷笼罩四野，风吹草低时显出成群牛羊。\",\"detailedMeaning\":\"辽阔的敕勒川坐落在阴山脚下，天空像巨大的毡帐笼罩四野。天色苍茫、草原无边，风吹低牧草时，原先藏在草中的牛羊便显现出来。\",\"sourceUrl\":\"https://www.shicile.com/detail/9630297918762\"},{\"order\":4,\"slug\":\"poem-04\",\"title\":\"咏鹅\",\"titlePinyin\":[\"yǒng\",\"é\"],\"dynasty\":\"唐\",\"author\":\"骆宾王\",\"lines\":[\"鹅，鹅，鹅，曲项向天歌。\",\"白毛浮绿水，红掌拨清波。\"],\"pinyin\":[[\"é\",\"é\",\"é\",\"qū\",\"xiàng\",\"xiàng\",\"tiān\",\"gē\"],[\"bái\",\"máo\",\"fú\",\"lǜ\",\"shuǐ\",\"hóng\",\"zhǎng\",\"bō\",\"qīng\",\"bō\"]],\"meaning\":\"白鹅弯着长颈向天歌唱，红掌拨动清水，绿波间荡开洁白的羽毛。\",\"detailedMeaning\":\"三声“鹅”像孩子惊喜的呼唤，也像白鹅响亮的叫声。白鹅弯着长颈朝天鸣叫，洁白羽毛浮在绿水上，红色脚掌拨动清波，色彩鲜明而有生气。\",\"sourceUrl\":\"https://www.shicile.com/detail/4590001052634\"},{\"order\":5,\"slug\":\"poem-05\",\"title\":\"风\",\"titlePinyin\":[\"fēng\"],\"dynasty\":\"唐\",\"author\":\"李峤\",\"lines\":[\"解落三秋叶，\",\"能开二月花。\",\"过江千尺浪，\",\"入竹万竿斜。\"],\"pinyin\":[[\"jiě\",\"luò\",\"sān\",\"qiū\",\"yè\"],[\"néng\",\"kāi\",\"èr\",\"yuè\",\"huā\"],[\"guò\",\"jiāng\",\"qiān\",\"chǐ\",\"làng\"],[\"rù\",\"zhú\",\"wàn\",\"gān\",\"xié\"]],\"meaning\":\"风虽然看不见，却能吹落秋叶、催开春花，也能掀起巨浪、吹斜竹林。\",\"detailedMeaning\":\"诗人没有直接描写风的样子，而是写风带来的变化：它能吹落深秋的叶子，也能催开早春的花朵；过江时能掀起巨浪，进入竹林又能使万竿翠竹倾斜。\",\"sourceUrl\":\"https://www.shicile.com/detail/10096073275\"},{\"order\":6,\"slug\":\"poem-06\",\"title\":\"咏柳\",\"titlePinyin\":[\"yǒng\",\"liǔ\"],\"dynasty\":\"唐\",\"author\":\"贺知章\",\"lines\":[\"碧玉妆成一树高，\",\"万条垂下绿丝绦。\",\"不知细叶谁裁出，\",\"二月春风似剪刀。\"],\"pinyin\":[[\"bì\",\"yù\",\"zhuāng\",\"chéng\",\"yī\",\"shù\",\"gāo\"],[\"wàn\",\"tiáo\",\"chuí\",\"xià\",\"lǜ\",\"sī\",\"tāo\"],[\"bù\",\"zhī\",\"xì\",\"yè\",\"shuí\",\"cái\",\"chū\"],[\"èr\",\"yuè\",\"chūn\",\"fēng\",\"sì\",\"jiǎn\",\"dāo\"]],\"meaning\":\"高高的柳树披着嫩绿枝条，细叶像剪出来一样，原来是二月春风的巧手。\",\"detailedMeaning\":\"高大的柳树像用碧玉装扮而成，低垂的万千枝条如绿色丝带。是谁剪出了细嫩整齐的柳叶？诗人把二月春风想象成灵巧的剪刀，赞美春天的创造力。\",\"sourceUrl\":\"https://www.shicile.com/detail/6940298887761\"},{\"order\":7,\"slug\":\"poem-07\",\"title\":\"回乡偶书·其一\",\"titlePinyin\":[\"huí\",\"xiāng\",\"ǒu\",\"shū\",\"qí\",\"yī\"],\"dynasty\":\"唐\",\"author\":\"贺知章\",\"lines\":[\"少小离家老大回，\",\"乡音无改鬓毛衰。\",\"儿童相见不相识，\",\"笑问客从何处来。\"],\"pinyin\":[[\"shào\",\"xiǎo\",\"lí\",\"jiā\",\"lǎo\",\"dà\",\"huí\"],[\"xiāng\",\"yīn\",\"wú\",\"gǎi\",\"bìn\",\"máo\",\"shuāi\"],[\"ér\",\"tóng\",\"xiāng\",\"jiàn\",\"bù\",\"xiāng\",\"shí\"],[\"xiào\",\"wèn\",\"kè\",\"cóng\",\"hé\",\"chù\",\"lái\"]],\"meaning\":\"诗人年老回乡，乡音未改却鬓发已白，孩子们笑问这位客人从哪里来。\",\"detailedMeaning\":\"诗人少年离家，年老才回到故乡，口音仍旧熟悉，鬓发却已经稀白。村里的孩子不认识他，把这位故乡人当作远方来客，笑着询问从哪里来，其中含着岁月变迁的感慨。\",\"sourceUrl\":\"https://www.shicile.com/detail/6640282196938\"},{\"order\":8,\"slug\":\"poem-08\",\"title\":\"凉州词二首·其一\",\"titlePinyin\":[\"liáng\",\"zhōu\",\"cí\",\"èr\",\"shǒu\",\"qí\",\"yī\"],\"dynasty\":\"唐\",\"author\":\"王之涣\",\"lines\":[\"黄河远上白云间，\",\"一片孤城万仞山。\",\"羌笛何须怨杨柳，\",\"春风不度玉门关。\"],\"pinyin\":[[\"huáng\",\"hé\",\"yuǎn\",\"shàng\",\"bái\",\"yún\",\"jiān\"],[\"yī\",\"piàn\",\"gū\",\"chéng\",\"wàn\",\"rèn\",\"shān\"],[\"qiāng\",\"dí\",\"hé\",\"xū\",\"yuàn\",\"yáng\",\"liǔ\"],[\"chūn\",\"fēng\",\"bù\",\"dù\",\"yù\",\"mén\",\"guān\"]],\"meaning\":\"黄河仿佛从白云间奔来，孤城坐落在高山之间，羌笛声更添边地苍凉。\",\"detailedMeaning\":\"黄河仿佛从白云间奔流而来，一座孤城立在万仞高山之间。羌笛吹奏《折杨柳》的离别曲，更显边地荒凉；春风吹不到玉门关，也暗示戍边将士生活艰苦。\",\"sourceUrl\":\"https://www.shicile.com/detail/3550298193396\"},{\"order\":9,\"slug\":\"poem-09\",\"title\":\"登鹳雀楼\",\"titlePinyin\":[\"dēng\",\"guàn\",\"què\",\"lóu\"],\"dynasty\":\"唐\",\"author\":\"王之涣\",\"lines\":[\"白日依山尽，\",\"黄河入海流。\",\"欲穷千里目，\",\"更上一层楼。\"],\"pinyin\":[[\"bái\",\"rì\",\"yī\",\"shān\",\"jìn\"],[\"huáng\",\"hé\",\"rù\",\"hǎi\",\"liú\"],[\"yù\",\"qióng\",\"qiān\",\"lǐ\",\"mù\"],[\"gèng\",\"shàng\",\"yī\",\"céng\",\"lóu\"]],\"meaning\":\"夕阳依着群山落下，黄河奔流入海；想看得更远，就要再登上一层楼。\",\"detailedMeaning\":\"傍晚太阳贴着群山落下，黄河向遥远的大海奔去。诗人想把更广阔的景色收入眼底，于是再登一层楼，也说明只有站得更高、不断进取，才能看得更远。\",\"sourceUrl\":\"https://www.shicile.com/detail/710075560527\"},{\"order\":10,\"slug\":\"poem-10\",\"title\":\"春晓\",\"titlePinyin\":[\"chūn\",\"xiǎo\"],\"dynasty\":\"唐\",\"author\":\"孟浩然\",\"lines\":[\"春眠不觉晓，\",\"处处闻啼鸟。\",\"夜来风雨声，\",\"花落知多少。\"],\"pinyin\":[[\"chūn\",\"mián\",\"bù\",\"jué\",\"xiǎo\"],[\"chù\",\"chù\",\"wén\",\"tí\",\"niǎo\"],[\"yè\",\"lái\",\"fēng\",\"yǔ\",\"shēng\"],[\"huā\",\"luò\",\"zhī\",\"duō\",\"shǎo\"]],\"meaning\":\"春夜睡得香甜，不知不觉天已亮；处处鸟鸣，又让人想起昨夜风雨和落花。\",\"detailedMeaning\":\"春夜气候舒适，诗人沉睡到天亮，不知东方已经破晓。醒来听见四处鸟鸣，他想起夜里的风雨，不禁猜想庭院中不知落了多少花。\",\"sourceUrl\":\"https://www.shicile.com/detail/4790000007002\"},{\"order\":11,\"slug\":\"poem-11\",\"title\":\"凉州词二首·其一\",\"titlePinyin\":[\"liáng\",\"zhōu\",\"cí\",\"èr\",\"shǒu\",\"qí\",\"yī\"],\"dynasty\":\"唐\",\"author\":\"王翰\",\"lines\":[\"葡萄美酒夜光杯，\",\"欲饮琵琶马上催。\",\"醉卧沙场君莫笑，\",\"古来征战几人回？\"],\"pinyin\":[[\"pú\",\"táo\",\"měi\",\"jiǔ\",\"yè\",\"guāng\",\"bēi\"],[\"yù\",\"yǐn\",\"pí\",\"pá\",\"mǎ\",\"shàng\",\"cuī\"],[\"zuì\",\"wò\",\"shā\",\"chǎng\",\"jūn\",\"mò\",\"xiào\"],[\"gǔ\",\"lái\",\"zhēng\",\"zhàn\",\"jǐ\",\"rén\",\"huí\"]],\"meaning\":\"将士们举杯欲饮，琵琶却催人出征；即使醉卧沙场，也显出豪迈与悲壮。\",\"detailedMeaning\":\"宴席上的葡萄美酒刚倒进夜光杯，琵琶声便催促将士出征。即使醉倒在战场也请不要取笑，因为古来出征的人本就很少平安归来，豪迈中含有战争的残酷。\",\"sourceUrl\":\"https://www.shicile.com/detail/5180298213624\"},{\"order\":12,\"slug\":\"poem-12\",\"title\":\"出塞二首·其一\",\"titlePinyin\":[\"chū\",\"sài\",\"èr\",\"shǒu\",\"qí\",\"yī\"],\"dynasty\":\"唐\",\"author\":\"王昌龄\",\"lines\":[\"秦时明月汉时关，\",\"万里长征人未还。\",\"但使龙城飞将在，\",\"不教胡马度阴山。\"],\"pinyin\":[[\"qín\",\"shí\",\"míng\",\"yuè\",\"hàn\",\"shí\",\"guān\"],[\"wàn\",\"lǐ\",\"cháng\",\"zhēng\",\"rén\",\"wèi\",\"huán\"],[\"dàn\",\"shǐ\",\"lóng\",\"chéng\",\"fēi\",\"jiàng\",\"zài\"],[\"bù\",\"jiào\",\"hú\",\"mǎ\",\"dù\",\"yīn\",\"shān\"]],\"meaning\":\"明月仍照着边关，出征的人迟迟未归；盼望良将镇守，使敌人不敢来犯。\",\"detailedMeaning\":\"明月仍照着秦汉时的边关，漫长岁月里无数出征者未能归家。诗人希望有李广那样的良将镇守边塞，使敌人的骑兵不敢越过阴山。\",\"sourceUrl\":\"https://www.shicile.com/detail/340298211290\"},{\"order\":13,\"slug\":\"poem-13\",\"title\":\"芙蓉楼送辛渐\",\"titlePinyin\":[\"fú\",\"róng\",\"lóu\",\"sòng\",\"xīn\",\"jiàn\"],\"dynasty\":\"唐\",\"author\":\"王昌龄\",\"lines\":[\"寒雨连江夜入吴，\",\"平明送客楚山孤。\",\"洛阳亲友如相问，\",\"一片冰心在玉壶。\"],\"pinyin\":[[\"hán\",\"yǔ\",\"lián\",\"jiāng\",\"yè\",\"rù\",\"wú\"],[\"píng\",\"míng\",\"sòng\",\"kè\",\"chǔ\",\"shān\",\"gū\"],[\"luò\",\"yáng\",\"qīn\",\"yǒu\",\"rú\",\"xiāng\",\"wèn\"],[\"yī\",\"piàn\",\"bīng\",\"xīn\",\"zài\",\"yù\",\"hú\"]],\"meaning\":\"寒雨夜入吴地，清晨送别友人；请告诉亲友，我的心仍像冰一样纯洁。\",\"detailedMeaning\":\"寒冷的夜雨笼罩吴地，清晨诗人在楚山孤影中送别友人。若洛阳亲友询问近况，请告诉他们，自己的品格仍像玉壶中的冰一样纯洁清白。\",\"sourceUrl\":\"https://www.shicile.com/detail/1690093987457\"},{\"order\":14,\"slug\":\"poem-14\",\"title\":\"鹿柴\",\"titlePinyin\":[\"lù\",\"zhài\"],\"dynasty\":\"唐\",\"author\":\"王维\",\"lines\":[\"空山不见人，\",\"但闻人语响。\",\"返景入深林，\",\"复照青苔上。\"],\"pinyin\":[[\"kōng\",\"shān\",\"bù\",\"jiàn\",\"rén\"],[\"dàn\",\"wén\",\"rén\",\"yǔ\",\"xiǎng\"],[\"fǎn\",\"yǐng\",\"rù\",\"shēn\",\"lín\"],[\"fù\",\"zhào\",\"qīng\",\"tái\",\"shàng\"]],\"meaning\":\"幽静山林里看不见人，只听到说话声；夕阳返照深林，又落在青苔上。\",\"detailedMeaning\":\"空山寂静，看不到人的身影，却从林中传来断续的说话声。落日余光穿过深林，返照在青苔上，使幽暗山林短暂明亮，也更显环境幽静。\",\"sourceUrl\":\"https://www.shicile.com/detail/4600142891759\"},{\"order\":15,\"slug\":\"poem-15\",\"title\":\"送元二使安西\",\"titlePinyin\":[\"sòng\",\"yuán\",\"èr\",\"shǐ\",\"ān\",\"xī\"],\"dynasty\":\"唐\",\"author\":\"王维\",\"lines\":[\"渭城朝雨浥轻尘，\",\"客舍青青柳色新。\",\"劝君更尽一杯酒，\",\"西出阳关无故人。\"],\"pinyin\":[[\"wèi\",\"chéng\",\"zhāo\",\"yǔ\",\"yì\",\"qīng\",\"chén\"],[\"kè\",\"shè\",\"qīng\",\"qīng\",\"liǔ\",\"sè\",\"xīn\"],[\"quàn\",\"jūn\",\"gèng\",\"jìn\",\"yī\",\"bēi\",\"jiǔ\"],[\"xī\",\"chū\",\"yáng\",\"guān\",\"wú\",\"gù\",\"rén\"]],\"meaning\":\"清晨细雨润湿尘土，柳色清新；诗人劝友人再饮一杯，珍重这次西行。\",\"detailedMeaning\":\"清晨的小雨洗净驿道尘土，客舍旁的柳树显得格外青翠。朋友就要向西远行，出了阳关便难遇故人，诗人再三劝酒，把深厚不舍藏在平常话语中。\",\"sourceUrl\":\"https://www.shicile.com/detail/6610299404353\"},{\"order\":16,\"slug\":\"poem-16\",\"title\":\"九月九日忆山东兄弟\",\"titlePinyin\":[\"jiǔ\",\"yuè\",\"jiǔ\",\"rì\",\"yì\",\"shān\",\"dōng\",\"xiōng\",\"dì\"],\"dynasty\":\"唐\",\"author\":\"王维\",\"lines\":[\"独在异乡为异客，\",\"每逢佳节倍思亲。\",\"遥知兄弟登高处，\",\"遍插茱萸少一人。\"],\"pinyin\":[[\"dú\",\"zài\",\"yì\",\"xiāng\",\"wéi\",\"yì\",\"kè\"],[\"měi\",\"féng\",\"jiā\",\"jié\",\"bèi\",\"sī\",\"qīn\"],[\"yáo\",\"zhī\",\"xiōng\",\"dì\",\"dēng\",\"gāo\",\"chù\"],[\"biàn\",\"chā\",\"zhū\",\"yú\",\"shǎo\",\"yī\",\"rén\"]],\"meaning\":\"异乡独自过重阳，更加思念亲人；遥想兄弟登高插茱萸，唯独少了自己。\",\"detailedMeaning\":\"重阳佳节独自在异乡，诗人比平日更加想念亲人。他遥想兄弟们已经登高、佩插茱萸，大家团聚时却发现唯独少了远方的自己。\",\"sourceUrl\":\"https://www.shicile.com/detail/5450284835136\"},{\"order\":17,\"slug\":\"poem-17\",\"title\":\"静夜思\",\"titlePinyin\":[\"jìng\",\"yè\",\"sī\"],\"dynasty\":\"唐\",\"author\":\"李白\",\"lines\":[\"床前明月光，\",\"疑是地上霜。\",\"举头望明月，\",\"低头思故乡。\"],\"pinyin\":[[\"chuáng\",\"qián\",\"míng\",\"yuè\",\"guāng\"],[\"yí\",\"shì\",\"dì\",\"shàng\",\"shuāng\"],[\"jǔ\",\"tóu\",\"wàng\",\"míng\",\"yuè\"],[\"dī\",\"tóu\",\"sī\",\"gù\",\"xiāng\"]],\"meaning\":\"床前月光像地上的霜，诗人抬头看明月，低头思念遥远的故乡。\",\"detailedMeaning\":\"朦胧月光洒在床前，诗人一时误以为地上铺着白霜。他抬头凝望故乡也能看见的明月，随后低下头，思乡之情变得更加深沉。\",\"sourceUrl\":\"https://www.shicile.com/detail/6710298640357\"},{\"order\":18,\"slug\":\"poem-18\",\"title\":\"古朗月行（节选）\",\"titlePinyin\":[\"gǔ\",\"lǎng\",\"yuè\",\"xíng\",\"jié\",\"xuǎn\"],\"dynasty\":\"唐\",\"author\":\"李白\",\"lines\":[\"小时不识月，\",\"呼作白玉盘。\",\"又疑瑶台镜，\",\"飞在青云端。\"],\"pinyin\":[[\"xiǎo\",\"shí\",\"bù\",\"shí\",\"yuè\"],[\"hū\",\"zuò\",\"bái\",\"yù\",\"pán\"],[\"yòu\",\"yí\",\"yáo\",\"tái\",\"jìng\"],[\"fēi\",\"zài\",\"qīng\",\"yún\",\"duān\"]],\"meaning\":\"小时候不认识月亮，把它叫作白玉盘，又以为是瑶台仙镜飞在云端。\",\"detailedMeaning\":\"小时候不懂月亮是什么，便把圆月叫作白玉盘；又怀疑它是瑶台仙境的明镜，飞到青云之上。童真的比喻写出月亮洁白、圆润而神奇的样子。\",\"sourceUrl\":\"https://www.shicile.com/detail/784395\"},{\"order\":19,\"slug\":\"poem-19\",\"title\":\"望庐山瀑布\",\"titlePinyin\":[\"wàng\",\"lú\",\"shān\",\"pù\",\"bù\"],\"dynasty\":\"唐\",\"author\":\"李白\",\"lines\":[\"日照香炉生紫烟，\",\"遥看瀑布挂前川。\",\"飞流直下三千尺，\",\"疑是银河落九天。\"],\"pinyin\":[[\"rì\",\"zhào\",\"xiāng\",\"lú\",\"shēng\",\"zǐ\",\"yān\"],[\"yáo\",\"kàn\",\"pù\",\"bù\",\"guà\",\"qián\",\"chuān\"],[\"fēi\",\"liú\",\"zhí\",\"xià\",\"sān\",\"qiān\",\"chǐ\"],[\"yí\",\"shì\",\"yín\",\"hé\",\"luò\",\"jiǔ\",\"tiān\"]],\"meaning\":\"阳光照着香炉峰升起紫烟，瀑布从高处直落，像银河从九天倾泻下来。\",\"detailedMeaning\":\"太阳照耀香炉峰，水汽升腾成紫色云烟；远处瀑布像一条白练高挂山前。飞流从三千尺高处直落，让人仿佛看见银河从九天倾泻下来。\",\"sourceUrl\":\"https://www.shicile.com/detail/2730298638801\"},{\"order\":20,\"slug\":\"poem-20\",\"title\":\"赠汪伦\",\"titlePinyin\":[\"zèng\",\"wāng\",\"lún\"],\"dynasty\":\"唐\",\"author\":\"李白\",\"lines\":[\"李白乘舟将欲行，\",\"忽闻岸上踏歌声。\",\"桃花潭水深千尺，\",\"不及汪伦送我情。\"],\"pinyin\":[[\"lǐ\",\"bái\",\"chéng\",\"zhōu\",\"jiāng\",\"yù\",\"xíng\"],[\"hū\",\"wén\",\"àn\",\"shàng\",\"tà\",\"gē\",\"shēng\"],[\"táo\",\"huā\",\"tán\",\"shuǐ\",\"shēn\",\"qiān\",\"chǐ\"],[\"bù\",\"jí\",\"wāng\",\"lún\",\"sòng\",\"wǒ\",\"qíng\"]],\"meaning\":\"李白乘船将要离开，忽听岸上踏歌声；桃花潭虽深，也比不上朋友的情意。\",\"detailedMeaning\":\"李白乘船即将离开桃花潭，忽然听见岸上传来朋友踏着节拍唱歌相送的声音。即使桃花潭水深达千尺，也比不上汪伦送别自己的深厚情意。\",\"sourceUrl\":\"https://www.shicile.com/detail/2960298193785\"},{\"order\":21,\"slug\":\"poem-21\",\"title\":\"黄鹤楼送孟浩然之广陵\",\"titlePinyin\":[\"huáng\",\"hè\",\"lóu\",\"sòng\",\"mèng\",\"hào\",\"rán\",\"zhī\",\"guǎng\",\"líng\"],\"dynasty\":\"唐\",\"author\":\"李白\",\"lines\":[\"故人西辞黄鹤楼，\",\"烟花三月下扬州。\",\"孤帆远影碧空尽，\",\"唯见长江天际流。\"],\"pinyin\":[[\"gù\",\"rén\",\"xī\",\"cí\",\"huáng\",\"hè\",\"lóu\"],[\"yān\",\"huā\",\"sān\",\"yuè\",\"xià\",\"yáng\",\"zhōu\"],[\"gū\",\"fān\",\"yuǎn\",\"yǐng\",\"bì\",\"kōng\",\"jìn\"],[\"wéi\",\"jiàn\",\"cháng\",\"jiāng\",\"tiān\",\"jì\",\"liú\"]],\"meaning\":\"友人的帆影渐渐消失在蓝天尽头，只见长江浩浩荡荡流向天边。\",\"detailedMeaning\":\"友人乘坐的帆船渐渐远去，最后消失在水天相接的碧空尽头。诗人久久站在黄鹤楼前，只看见长江水浩荡地流向天边，表现出依依不舍。\",\"sourceUrl\":\"https://www.shicile.com/detail/4480298901376\"},{\"order\":22,\"slug\":\"poem-22\",\"title\":\"早发白帝城\",\"titlePinyin\":[\"zǎo\",\"fā\",\"bái\",\"dì\",\"chéng\"],\"dynasty\":\"唐\",\"author\":\"李白\",\"lines\":[\"朝辞白帝彩云间，\",\"千里江陵一日还。\",\"两岸猿声啼不住，\",\"轻舟已过万重山。\"],\"pinyin\":[[\"zhāo\",\"cí\",\"bái\",\"dì\",\"cǎi\",\"yún\",\"jiān\"],[\"qiān\",\"lǐ\",\"jiāng\",\"líng\",\"yī\",\"rì\",\"huán\"],[\"liǎng\",\"àn\",\"yuán\",\"shēng\",\"tí\",\"bù\",\"zhù\"],[\"qīng\",\"zhōu\",\"yǐ\",\"guò\",\"wàn\",\"chóng\",\"shān\"]],\"meaning\":\"清晨辞别彩云间的白帝城，顺流千里一日即还，小舟已越过重重青山。\",\"detailedMeaning\":\"清晨诗人告别彩云缭绕的白帝城，千里之外的江陵一天便能到达。两岸猿声还在耳边接连回响，轻快的小船已经穿过重重青山，写出顺流而下的畅快。\",\"sourceUrl\":\"https://www.shicile.com/detail/6810263089647\"},{\"order\":23,\"slug\":\"poem-23\",\"title\":\"望天门山\",\"titlePinyin\":[\"wàng\",\"tiān\",\"mén\",\"shān\"],\"dynasty\":\"唐\",\"author\":\"李白\",\"lines\":[\"天门中断楚江开，\",\"碧水东流至此回。\",\"两岸青山相对出，\",\"孤帆一片日边来。\"],\"pinyin\":[[\"tiān\",\"mén\",\"zhōng\",\"duàn\",\"chǔ\",\"jiāng\",\"kāi\"],[\"bì\",\"shuǐ\",\"dōng\",\"liú\",\"zhì\",\"cǐ\",\"huí\"],[\"liǎng\",\"àn\",\"qīng\",\"shān\",\"xiāng\",\"duì\",\"chū\"],[\"gū\",\"fān\",\"yī\",\"piàn\",\"rì\",\"biān\",\"lái\"]],\"meaning\":\"天门山被江水冲开，碧水到此回旋；两岸青山相对而出，孤帆从日边驶来。\",\"detailedMeaning\":\"奔腾江水冲开天门山，两座青山隔江相对，碧水到这里回旋向北。行船前进时，两岸青山仿佛迎面而来，一叶孤帆从太阳照耀的远方驶近。\",\"sourceUrl\":\"https://www.shicile.com/detail/6730102602251\"},{\"order\":24,\"slug\":\"poem-24\",\"title\":\"别董大·其一\",\"titlePinyin\":[\"bié\",\"dǒng\",\"dà\",\"qí\",\"yī\"],\"dynasty\":\"唐\",\"author\":\"高适\",\"lines\":[\"千里黄云白日曛，\",\"北风吹雁雪纷纷。\",\"莫愁前路无知己，\",\"天下谁人不识君。\"],\"pinyin\":[[\"qiān\",\"lǐ\",\"huáng\",\"yún\",\"bái\",\"rì\",\"xūn\"],[\"běi\",\"fēng\",\"chuī\",\"yàn\",\"xuě\",\"fēn\",\"fēn\"],[\"mò\",\"chóu\",\"qián\",\"lù\",\"wú\",\"zhī\",\"jǐ\"],[\"tiān\",\"xià\",\"shuí\",\"rén\",\"bù\",\"shí\",\"jūn\"]],\"meaning\":\"千里黄云遮住白日，北风吹着大雪；不要担心前路无知己，天下谁不认识你。\",\"detailedMeaning\":\"漫天黄云遮住阳光，北风吹送大雪，雁群纷纷南飞。诗人安慰即将远行的朋友，不要担心前路没有知己，凭他的才华和声名，天下人都会赏识他。\",\"sourceUrl\":\"https://www.shicile.com/detail/5260050287197\"},{\"order\":25,\"slug\":\"poem-25\",\"title\":\"绝句\",\"titlePinyin\":[\"jué\",\"jù\"],\"dynasty\":\"唐\",\"author\":\"杜甫\",\"lines\":[\"两个黄鹂鸣翠柳，\",\"一行白鹭上青天。\",\"窗含西岭千秋雪，\",\"门泊东吴万里船。\"],\"pinyin\":[[\"liǎng\",\"gè\",\"huáng\",\"lí\",\"míng\",\"cuì\",\"liǔ\"],[\"yī\",\"háng\",\"bái\",\"lù\",\"shàng\",\"qīng\",\"tiān\"],[\"chuāng\",\"hán\",\"xī\",\"lǐng\",\"qiān\",\"qiū\",\"xuě\"],[\"mén\",\"bó\",\"dōng\",\"wú\",\"wàn\",\"lǐ\",\"chuán\"]],\"meaning\":\"新绿柳枝上两只黄鹂鸣叫，一行白鹭飞上青天；窗外雪山与门前船只相映成趣。\",\"detailedMeaning\":\"翠柳间两只黄鹂清脆鸣叫，一行白鹭飞向青天。窗框像画框一样嵌着远处千年积雪的西岭，门前还停泊着将驶往万里之外东吴的船只。\",\"sourceUrl\":\"https://www.shicile.com/detail/4740216724737\"},{\"order\":26,\"slug\":\"poem-26\",\"title\":\"春夜喜雨\",\"titlePinyin\":[\"chūn\",\"yè\",\"xǐ\",\"yǔ\"],\"dynasty\":\"唐\",\"author\":\"杜甫\",\"lines\":[\"好雨知时节，\",\"当春乃发生。\",\"随风潜入夜，\",\"润物细无声。\",\"野径云俱黑，\",\"江船火独明。\",\"晓看红湿处，\",\"花重锦官城。\"],\"pinyin\":[[\"hǎo\",\"yǔ\",\"zhī\",\"shí\",\"jié\"],[\"dāng\",\"chūn\",\"nǎi\",\"fā\",\"shēng\"],[\"suí\",\"fēng\",\"qián\",\"rù\",\"yè\"],[\"rùn\",\"wù\",\"xì\",\"wú\",\"shēng\"],[\"yě\",\"jìng\",\"yún\",\"jù\",\"hēi\"],[\"jiāng\",\"chuán\",\"huǒ\",\"dú\",\"míng\"],[\"xiǎo\",\"kàn\",\"hóng\",\"shī\",\"chù\"],[\"huā\",\"zhòng\",\"jǐn\",\"guān\",\"chéng\"]],\"meaning\":\"好雨仿佛懂得时节，春夜悄悄滋润万物；清晨湿润的花朵会让锦官城更加鲜艳。\",\"detailedMeaning\":\"这场春雨仿佛懂得万物的需要，在适宜的时节悄然来到。它随风潜入夜色，细细滋润万物；天亮后，沾雨的花朵会让锦官城变成一片繁花似锦。\",\"sourceUrl\":\"https://www.shicile.com/detail/5470298597956\"},{\"order\":27,\"slug\":\"poem-27\",\"title\":\"绝句\",\"titlePinyin\":[\"jué\",\"jù\"],\"dynasty\":\"唐\",\"author\":\"杜甫\",\"lines\":[\"迟日江山丽，\",\"春风花草香。\",\"泥融飞燕子，\",\"沙暖睡鸳鸯。\"],\"pinyin\":[[\"chí\",\"rì\",\"jiāng\",\"shān\",\"lì\"],[\"chūn\",\"fēng\",\"huā\",\"cǎo\",\"xiāng\"],[\"ní\",\"róng\",\"fēi\",\"yàn\",\"zǐ\"],[\"shā\",\"nuǎn\",\"shuì\",\"yuān\",\"yāng\"]],\"meaning\":\"春日阳光照着山河，花草散发香气；泥土融暖，燕子筑巢，沙洲上鸳鸯安睡。\",\"detailedMeaning\":\"温暖阳光照耀江山，春风送来花草清香。湿软泥土吸引燕子衔泥筑巢，暖和沙滩上成双的鸳鸯安静睡卧，组成明丽又安详的春日画面。\",\"sourceUrl\":\"https://www.shicile.com/detail/320151726727\"},{\"order\":28,\"slug\":\"poem-28\",\"title\":\"江畔独步寻花·其五\",\"titlePinyin\":[\"jiāng\",\"pàn\",\"dú\",\"bù\",\"xún\",\"huā\",\"qí\",\"wǔ\"],\"dynasty\":\"唐\",\"author\":\"杜甫\",\"lines\":[\"黄师塔前江水东，\",\"春光懒困倚微风。\",\"桃花一簇开无主，\",\"可爱深红爱浅红？\"],\"pinyin\":[[\"huáng\",\"shī\",\"tǎ\",\"qián\",\"jiāng\",\"shuǐ\",\"dōng\"],[\"chūn\",\"guāng\",\"lǎn\",\"kùn\",\"yǐ\",\"wēi\",\"fēng\"],[\"táo\",\"huā\",\"yī\",\"cù\",\"kāi\",\"wú\",\"zhǔ\"],[\"kě\",\"ài\",\"shēn\",\"hóng\",\"ài\",\"qiǎn\",\"hóng\"]],\"meaning\":\"黄师塔前江水向东流，春光让人困倦；桃花盛开可爱，深红浅红都惹人喜欢。\",\"detailedMeaning\":\"黄师塔前江水向东流，温暖春光使人困倦，诗人倚着微风慢慢行走。江边一簇无人照看的桃花正盛开，无论深红还是浅红都让人喜爱。\",\"sourceUrl\":\"https://www.shicile.com/detail/4880001718991\"},{\"order\":29,\"slug\":\"poem-29\",\"title\":\"枫桥夜泊\",\"titlePinyin\":[\"fēng\",\"qiáo\",\"yè\",\"bó\"],\"dynasty\":\"唐\",\"author\":\"张继\",\"lines\":[\"月落乌啼霜满天，\",\"江枫渔火对愁眠。\",\"姑苏城外寒山寺，\",\"夜半钟声到客船。\"],\"pinyin\":[[\"yuè\",\"luò\",\"wū\",\"tí\",\"shuāng\",\"mǎn\",\"tiān\"],[\"jiāng\",\"fēng\",\"yú\",\"huǒ\",\"duì\",\"chóu\",\"mián\"],[\"gū\",\"sū\",\"chéng\",\"wài\",\"hán\",\"shān\",\"sì\"],[\"yè\",\"bàn\",\"zhōng\",\"shēng\",\"dào\",\"kè\",\"chuán\"]],\"meaning\":\"月落、乌啼、满天寒霜，旅人对着江枫渔火难眠；夜半钟声传到客船。\",\"detailedMeaning\":\"月亮西沉，乌鸦啼叫，寒霜仿佛铺满天空。旅人面对江边枫树和渔火久久难眠；夜半时，寒山寺悠远的钟声传到停泊在枫桥边的客船。\",\"sourceUrl\":\"https://www.shicile.com/detail/7520289900694\"},{\"order\":30,\"slug\":\"poem-30\",\"title\":\"滁州西涧\",\"titlePinyin\":[\"chú\",\"zhōu\",\"xī\",\"jiàn\"],\"dynasty\":\"唐\",\"author\":\"韦应物\",\"lines\":[\"独怜幽草涧边生，\",\"上有黄鹂深树鸣。\",\"春潮带雨晚来急，\",\"野渡无人舟自横。\"],\"pinyin\":[[\"dú\",\"lián\",\"yōu\",\"cǎo\",\"jiàn\",\"biān\",\"shēng\"],[\"shàng\",\"yǒu\",\"huáng\",\"lí\",\"shēn\",\"shù\",\"míng\"],[\"chūn\",\"cháo\",\"dài\",\"yǔ\",\"wǎn\",\"lái\",\"jí\"],[\"yě\",\"dù\",\"wú\",\"rén\",\"zhōu\",\"zì\",\"héng\"]],\"meaning\":\"溪边生着幽草，黄鹂在深树间鸣叫；春潮带雨急涨，空船横在无人渡口。\",\"detailedMeaning\":\"诗人喜爱溪边独自生长的幽草，也喜爱深树间鸣叫的黄鹂。傍晚春潮夹着急雨上涨，郊野渡口无人过河，只有一只空船自在横在水面。\",\"sourceUrl\":\"https://www.shicile.com/detail/3990096125790\"},{\"order\":31,\"slug\":\"poem-33\",\"title\":\"游子吟\",\"titlePinyin\":[\"yóu\",\"zǐ\",\"yín\"],\"dynasty\":\"唐\",\"author\":\"孟郊\",\"lines\":[\"慈母手中线，\",\"游子身上衣。\",\"临行密密缝，\",\"意恐迟迟归。\",\"谁言寸草心，\",\"报得三春晖。\"],\"pinyin\":[[\"cí\",\"mǔ\",\"shǒu\",\"zhōng\",\"xiàn\"],[\"yóu\",\"zǐ\",\"shēn\",\"shàng\",\"yī\"],[\"lín\",\"xíng\",\"mì\",\"mì\",\"féng\"],[\"yì\",\"kǒng\",\"chí\",\"chí\",\"guī\"],[\"shuí\",\"yán\",\"cùn\",\"cǎo\",\"xīn\"],[\"bào\",\"dé\",\"sān\",\"chūn\",\"huī\"]],\"meaning\":\"慈母临行前密密缝好游子的衣服，担心他迟迟不归；儿女难以报答母爱的春晖。\",\"detailedMeaning\":\"慈母手拿针线，为即将远行的儿子缝制衣服；临行前缝得又密又牢，担心孩子很久不能回来。儿女微小的心意，怎能报答母亲像春日阳光一样深厚的恩情。\",\"sourceUrl\":\"https://www.shicile.com/detail/9050294782255\"},{\"order\":32,\"slug\":\"poem-34\",\"title\":\"早春呈水部张十八员外\",\"titlePinyin\":[\"zǎo\",\"chūn\",\"chéng\",\"shuǐ\",\"bù\",\"zhāng\",\"shí\",\"bā\",\"yuán\",\"wài\"],\"dynasty\":\"唐\",\"author\":\"韩愈\",\"lines\":[\"天街小雨润如酥，\",\"草色遥看近却无。\",\"最是一年春好处，\",\"绝胜烟柳满皇都。\"],\"pinyin\":[[\"tiān\",\"jiē\",\"xiǎo\",\"yǔ\",\"rùn\",\"rú\",\"sū\"],[\"cǎo\",\"sè\",\"yáo\",\"kàn\",\"jìn\",\"què\",\"wú\"],[\"zuì\",\"shì\",\"yī\",\"nián\",\"chūn\",\"hǎo\",\"chù\"],[\"jué\",\"shèng\",\"yān\",\"liǔ\",\"mǎn\",\"huáng\",\"dū\"]],\"meaning\":\"初春小雨细密润泽，草色远看青青、近看却稀疏，正是一年最好的春景。\",\"detailedMeaning\":\"京城上空落着细密如酥油的春雨，远看草地已有淡淡青色，走近却还很稀疏。初春含蓄清新的景色，是一年春光中最珍贵的时刻，胜过烟柳满城的暮春。\",\"sourceUrl\":\"https://www.shicile.com/detail/8170298182504\"},{\"order\":33,\"slug\":\"poem-31\",\"title\":\"渔歌子·西塞山前白鹭飞\",\"titlePinyin\":[\"yú\",\"gē\",\"zǐ\",\"xī\",\"sài\",\"shān\",\"qián\",\"bái\",\"lù\",\"fēi\"],\"dynasty\":\"唐\",\"author\":\"张志和\",\"lines\":[\"西塞山前白鹭飞，\",\"桃花流水鳜鱼肥。\",\"青箬笠，绿蓑衣，\",\"斜风细雨不须归。\"],\"pinyin\":[[\"xī\",\"sài\",\"shān\",\"qián\",\"bái\",\"lù\",\"fēi\"],[\"táo\",\"huā\",\"liú\",\"shuǐ\",\"guì\",\"yú\",\"féi\"],[\"qīng\",\"ruò\",\"lì\",\"lǜ\",\"suō\",\"yī\"],[\"xié\",\"fēng\",\"xì\",\"yǔ\",\"bù\",\"xū\",\"guī\"]],\"meaning\":\"西塞山前白鹭飞，桃花流水中鳜鱼肥；渔人戴斗笠披蓑衣，在细雨中不愿归去。\",\"detailedMeaning\":\"西塞山前白鹭飞翔，桃花盛开、溪水上涨，鳜鱼正肥。渔人头戴青箬笠、身披绿蓑衣，在斜风细雨中从容垂钓，沉醉春景而不愿回家。\",\"sourceUrl\":\"https://www.shicile.com/detail/3490280990260\"},{\"order\":34,\"slug\":\"poem-32\",\"title\":\"和张仆射塞下曲·其三\",\"titlePinyin\":[\"hè\",\"zhāng\",\"pú\",\"yè\",\"sài\",\"xià\",\"qǔ\",\"qí\",\"sān\"],\"dynasty\":\"唐\",\"author\":\"卢纶\",\"lines\":[\"月黑雁飞高，\",\"单于夜遁逃。\",\"欲将轻骑逐，\",\"大雪满弓刀。\"],\"pinyin\":[[\"yuè\",\"hēi\",\"yàn\",\"fēi\",\"gāo\"],[\"chán\",\"yú\",\"yè\",\"dùn\",\"táo\"],[\"yù\",\"jiāng\",\"qīng\",\"qí\",\"zhú\"],[\"dà\",\"xuě\",\"mǎn\",\"gōng\",\"dāo\"]],\"meaning\":\"月黑雁高飞，敌军趁夜逃走；将军正要追击，大雪已经落满弓刀。\",\"detailedMeaning\":\"没有月光的夜里，大雁受惊高飞，敌军正趁黑逃走。将军准备率领骑兵追击，纷纷大雪已经落满弓箭和佩刀，表现战斗即将开始的紧张气氛。\",\"sourceUrl\":\"https://www.shicile.com/detail/950297169937\"},{\"order\":35,\"slug\":\"poem-35\",\"title\":\"望洞庭\",\"titlePinyin\":[\"wàng\",\"dòng\",\"tíng\"],\"dynasty\":\"唐\",\"author\":\"刘禹锡\",\"lines\":[\"湖光秋月两相和，\",\"潭面无风镜未磨。\",\"遥望洞庭山水翠，\",\"白银盘里一青螺。\"],\"pinyin\":[[\"hú\",\"guāng\",\"qiū\",\"yuè\",\"liǎng\",\"xiāng\",\"hé\"],[\"tán\",\"miàn\",\"wú\",\"fēng\",\"jìng\",\"wèi\",\"mó\"],[\"yáo\",\"wàng\",\"dòng\",\"tíng\",\"shān\",\"shuǐ\",\"cuì\"],[\"bái\",\"yín\",\"pán\",\"lǐ\",\"yī\",\"qīng\",\"luó\"]],\"meaning\":\"秋月映在洞庭湖上，水面平静如镜；远望君山与湖水，像白银盘里的青螺。\",\"detailedMeaning\":\"秋夜月光与洞庭湖水交相辉映，湖面没有风，平滑得像尚未打磨的铜镜。远望青翠君山和清澈湖水，仿佛白银盘中放着一枚小巧青螺。\",\"sourceUrl\":\"https://www.shicile.com/detail/7540004041710\"},{\"order\":36,\"slug\":\"poem-36\",\"title\":\"浪淘沙·九曲黄河万里沙\",\"titlePinyin\":[\"làng\",\"táo\",\"shā\",\"jiǔ\",\"qū\",\"huáng\",\"hé\",\"wàn\",\"lǐ\",\"shā\"],\"dynasty\":\"唐\",\"author\":\"刘禹锡\",\"lines\":[\"九曲黄河万里沙，\",\"浪淘风簸自天涯。\",\"如今直上银河去，\",\"同到牵牛织女家。\"],\"pinyin\":[[\"jiǔ\",\"qū\",\"huáng\",\"hé\",\"wàn\",\"lǐ\",\"shā\"],[\"làng\",\"táo\",\"fēng\",\"bǒ\",\"zì\",\"tiān\",\"yá\"],[\"rú\",\"jīn\",\"zhí\",\"shàng\",\"yín\",\"hé\",\"qù\"],[\"tóng\",\"dào\",\"qiān\",\"niú\",\"zhī\",\"nǚ\",\"jiā\"]],\"meaning\":\"黄河万里裹着泥沙奔涌，仿佛可以沿着银河直上，去拜访牛郎织女。\",\"detailedMeaning\":\"九曲黄河夹带万里泥沙，从天边翻滚奔流而来。诗人展开浪漫想象，仿佛可以迎着巨浪一直上银河，去牛郎织女家中做客。\",\"sourceUrl\":\"https://www.shicile.com/detail/4650094776349\"},{\"order\":37,\"slug\":\"poem-37\",\"title\":\"赋得古原草送别\",\"titlePinyin\":[\"fù\",\"dé\",\"gǔ\",\"yuán\",\"cǎo\",\"sòng\",\"bié\"],\"dynasty\":\"唐\",\"author\":\"白居易\",\"lines\":[\"离离原上草，\",\"一岁一枯荣。\",\"野火烧不尽，\",\"春风吹又生。\",\"远芳侵古道，\",\"晴翠接荒城。\",\"又送王孙去，\",\"萋萋满别情。\"],\"pinyin\":[[\"lí\",\"lí\",\"yuán\",\"shàng\",\"cǎo\"],[\"yī\",\"suì\",\"yī\",\"kū\",\"róng\"],[\"yě\",\"huǒ\",\"shāo\",\"bù\",\"jìn\"],[\"chūn\",\"fēng\",\"chuī\",\"yòu\",\"shēng\"],[\"yuǎn\",\"fāng\",\"qīn\",\"gǔ\",\"dào\"],[\"qíng\",\"cuì\",\"jiē\",\"huāng\",\"chéng\"],[\"yòu\",\"sòng\",\"wáng\",\"sūn\",\"qù\"],[\"qī\",\"qī\",\"mǎn\",\"bié\",\"qíng\"]],\"meaning\":\"野草一年一枯一荣，烈火烧不尽，春风吹来又生长，也寄托着依依惜别之情。\",\"detailedMeaning\":\"原野上的草每年秋冬枯萎、春夏重新繁茂。野火无法烧尽深藏地下的根，春风吹来又会生长；远处芳草侵占古道，也像绵延不尽的离别情意。\",\"sourceUrl\":\"https://www.shicile.com/detail/330003226366\"},{\"order\":38,\"slug\":\"poem-38\",\"title\":\"池上\",\"titlePinyin\":[\"chí\",\"shàng\"],\"dynasty\":\"唐\",\"author\":\"白居易\",\"lines\":[\"小娃撑小艇，\",\"偷采白莲回。\",\"不解藏踪迹，\",\"浮萍一道开。\"],\"pinyin\":[[\"xiǎo\",\"wá\",\"chēng\",\"xiǎo\",\"tǐng\"],[\"tōu\",\"cǎi\",\"bái\",\"lián\",\"huí\"],[\"bù\",\"jiě\",\"cáng\",\"zōng\",\"jì\"],[\"fú\",\"píng\",\"yī\",\"dào\",\"kāi\"]],\"meaning\":\"小娃偷偷撑船采白莲，不懂掩藏踪迹，水面的浮萍留下了一道船路。\",\"detailedMeaning\":\"小孩子撑着小船，偷偷采回一朵白莲。他还不懂怎样隐藏行踪，船划开浮萍留下清晰水路，把孩子的天真、顽皮写得十分生动。\",\"sourceUrl\":\"https://www.shicile.com/detail/2790217422214\"},{\"order\":39,\"slug\":\"poem-39\",\"title\":\"忆江南·江南好\",\"titlePinyin\":[\"yì\",\"jiāng\",\"nán\",\"jiāng\",\"nán\",\"hǎo\"],\"dynasty\":\"唐\",\"author\":\"白居易\",\"lines\":[\"江南好，\",\"风景旧曾谙。\",\"日出江花红胜火，\",\"春来江水绿如蓝。\",\"能不忆江南？\"],\"pinyin\":[[\"jiāng\",\"nán\",\"hǎo\"],[\"fēng\",\"jǐng\",\"jiù\",\"céng\",\"ān\"],[\"rì\",\"chū\",\"jiāng\",\"huā\",\"hóng\",\"shèng\",\"huǒ\"],[\"chūn\",\"lái\",\"jiāng\",\"shuǐ\",\"lǜ\",\"rú\",\"lán\"],[\"néng\",\"bù\",\"yì\",\"jiāng\",\"nán\"]],\"meaning\":\"江南风景秀美，太阳照得江花胜火，春水绿如蓝，让人怎能不怀念江南。\",\"detailedMeaning\":\"江南景色曾经那样熟悉美好：太阳升起时，江边红花比火还鲜艳；春天江水碧绿得胜过蓝草。如此动人的景色，怎能不让人反复怀念。\",\"sourceUrl\":\"https://www.shicile.com/detail/320106051514\"},{\"order\":40,\"slug\":\"poem-40\",\"title\":\"小儿垂钓\",\"titlePinyin\":[\"xiǎo\",\"ér\",\"chuí\",\"diào\"],\"dynasty\":\"唐\",\"author\":\"胡令能\",\"lines\":[\"蓬头稚子学垂纶，\",\"侧坐莓苔草映身。\",\"路人借问遥招手，\",\"怕得鱼惊不应人。\"],\"pinyin\":[[\"péng\",\"tóu\",\"zhì\",\"zǐ\",\"xué\",\"chuí\",\"lún\"],[\"cè\",\"zuò\",\"méi\",\"tái\",\"cǎo\",\"yìng\",\"shēn\"],[\"lù\",\"rén\",\"jiè\",\"wèn\",\"yáo\",\"zhāo\",\"shǒu\"],[\"pà\",\"dé\",\"yú\",\"jīng\",\"bù\",\"yìng\",\"rén\"]],\"meaning\":\"蓬头小孩在水边学钓鱼，侧身坐在草丛里；路人问路，他连忙摆手怕惊走鱼儿。\",\"detailedMeaning\":\"头发蓬乱的小孩坐在长满莓苔的河岸，侧着身体认真学钓鱼。听见路人问路，他远远招手却不敢出声，生怕声音惊走即将上钩的鱼儿。\",\"sourceUrl\":\"https://www.shicile.com/detail/6420122978849\"},{\"order\":41,\"slug\":\"poem-41\",\"title\":\"悯农二首·其二\",\"titlePinyin\":[\"mǐn\",\"nóng\",\"èr\",\"shǒu\",\"qí\",\"èr\"],\"dynasty\":\"唐\",\"author\":\"李绅\",\"lines\":[\"锄禾日当午，\",\"汗滴禾下土。\",\"谁知盘中餐，\",\"粒粒皆辛苦。\"],\"pinyin\":[[\"chú\",\"hé\",\"rì\",\"dāng\",\"wǔ\"],[\"hàn\",\"dī\",\"hé\",\"xià\",\"tǔ\"],[\"shuí\",\"zhī\",\"pán\",\"zhōng\",\"cān\"],[\"lì\",\"lì\",\"jiē\",\"xīn\",\"kǔ\"]],\"meaning\":\"农民在烈日下锄禾，汗水滴进泥土；应当知道每一粒粮食都来之不易。\",\"detailedMeaning\":\"盛夏中午，农民顶着烈日在田里锄草，汗水一滴滴落进禾苗下的泥土。吃饭的人应当知道，碗里的每一粒粮食都凝聚着辛苦劳动。\",\"sourceUrl\":\"https://www.shicile.com/detail/4230113739710\"},{\"order\":42,\"slug\":\"poem-42\",\"title\":\"悯农二首·其一\",\"titlePinyin\":[\"mǐn\",\"nóng\",\"èr\",\"shǒu\",\"qí\",\"yī\"],\"dynasty\":\"唐\",\"author\":\"李绅\",\"lines\":[\"春种一粒粟，\",\"秋收万颗子。\",\"四海无闲田，\",\"农夫犹饿死。\"],\"pinyin\":[[\"chūn\",\"zhòng\",\"yī\",\"lì\",\"sù\"],[\"qiū\",\"shōu\",\"wàn\",\"kē\",\"zǐ\"],[\"sì\",\"hǎi\",\"wú\",\"xián\",\"tián\"],[\"nóng\",\"fū\",\"yóu\",\"è\",\"sǐ\"]],\"meaning\":\"春天种下一粒粟，秋天收获万颗粮；天下仍有荒田，辛苦的农民却可能挨饿。\",\"detailedMeaning\":\"春天播下一粒谷种，秋天便能收获许多粮食，看似天下没有闲置田地。然而辛苦耕作的农民仍可能饿死，诗句揭示了不合理的社会现实。\",\"sourceUrl\":\"https://www.shicile.com/detail/4170297980224\"},{\"order\":43,\"slug\":\"poem-43\",\"title\":\"江雪\",\"titlePinyin\":[\"jiāng\",\"xuě\"],\"dynasty\":\"唐\",\"author\":\"柳宗元\",\"lines\":[\"千山鸟飞绝，\",\"万径人踪灭。\",\"孤舟蓑笠翁，\",\"独钓寒江雪。\"],\"pinyin\":[[\"qiān\",\"shān\",\"niǎo\",\"fēi\",\"jué\"],[\"wàn\",\"jìng\",\"rén\",\"zōng\",\"miè\"],[\"gū\",\"zhōu\",\"suō\",\"lì\",\"wēng\"],[\"dú\",\"diào\",\"hán\",\"jiāng\",\"xuě\"]],\"meaning\":\"群山无鸟飞，路上无行人；只有孤舟上的老翁，独自在风雪江面钓鱼。\",\"detailedMeaning\":\"所有山岭都看不见飞鸟，条条道路也没有行人踪迹。在如此寂静寒冷的天地间，只有孤舟上一位披蓑戴笠的老人，独自冒雪垂钓。\",\"sourceUrl\":\"https://www.shicile.com/detail/2800094824974\"},{\"order\":44,\"slug\":\"poem-44\",\"title\":\"寻隐者不遇\",\"titlePinyin\":[\"xún\",\"yǐn\",\"zhě\",\"bù\",\"yù\"],\"dynasty\":\"唐\",\"author\":\"贾岛\",\"lines\":[\"松下问童子，\",\"言师采药去。\",\"只在此山中，\",\"云深不知处。\"],\"pinyin\":[[\"sōng\",\"xià\",\"wèn\",\"tóng\",\"zǐ\"],[\"yán\",\"shī\",\"cǎi\",\"yào\",\"qù\"],[\"zhǐ\",\"zài\",\"cǐ\",\"shān\",\"zhōng\"],[\"yún\",\"shēn\",\"bù\",\"zhī\",\"chù\"]],\"meaning\":\"童子说师父采药去了，只知道他在这座山中，云雾太深却不知具体在哪里。\",\"detailedMeaning\":\"诗人询问隐者去向，童子回答师父上山采药了。他只知道师父就在这座山中，可云雾太浓、山林太深，无法说清具体位置。\",\"sourceUrl\":\"https://www.shicile.com/detail/4140003211584\"},{\"order\":45,\"slug\":\"poem-45\",\"title\":\"山行\",\"titlePinyin\":[\"shān\",\"xíng\"],\"dynasty\":\"唐\",\"author\":\"杜牧\",\"lines\":[\"远上寒山石径斜，\",\"白云生处有人家。\",\"停车坐爱枫林晚，\",\"霜叶红于二月花。\"],\"pinyin\":[[\"yuǎn\",\"shàng\",\"hán\",\"shān\",\"shí\",\"jìng\",\"xié\"],[\"bái\",\"yún\",\"shēng\",\"chù\",\"yǒu\",\"rén\",\"jiā\"],[\"tíng\",\"chē\",\"zuò\",\"ài\",\"fēng\",\"lín\",\"wǎn\"],[\"shuāng\",\"yè\",\"hóng\",\"yú\",\"èr\",\"yuè\",\"huā\"]],\"meaning\":\"石径弯弯伸向寒山深处，白云升起处有人家；诗人停车欣赏比春花更红的枫叶。\",\"detailedMeaning\":\"弯曲石路沿着深秋寒山向上延伸，白云升起的地方隐约有人家。诗人因为喜爱傍晚枫林而停车观赏，经霜的红叶比二月春花还鲜艳。\",\"sourceUrl\":\"https://www.shicile.com/detail/4010217404320\"},{\"order\":46,\"slug\":\"poem-46\",\"title\":\"清明\",\"titlePinyin\":[\"qīng\",\"míng\"],\"dynasty\":\"唐\",\"author\":\"杜牧\",\"lines\":[\"清明时节雨纷纷，\",\"路上行人欲断魂。\",\"借问酒家何处有，\",\"牧童遥指杏花村。\"],\"pinyin\":[[\"qīng\",\"míng\",\"shí\",\"jié\",\"yǔ\",\"fēn\",\"fēn\"],[\"lù\",\"shàng\",\"xíng\",\"rén\",\"yù\",\"duàn\",\"hún\"],[\"jiè\",\"wèn\",\"jiǔ\",\"jiā\",\"hé\",\"chù\",\"yǒu\"],[\"mù\",\"tóng\",\"yáo\",\"zhǐ\",\"xìng\",\"huā\",\"cūn\"]],\"meaning\":\"清明时节细雨纷纷，行人心情愁苦；询问酒家所在，牧童指向杏花村。\",\"detailedMeaning\":\"清明时节细雨不断，赶路的人触景伤情，心情更加低落。他询问哪里可以买酒休息，牧童抬手指向远处开满杏花的村庄。\",\"sourceUrl\":\"https://www.shicile.com/detail/1830298250190\"},{\"order\":47,\"slug\":\"poem-47\",\"title\":\"江南春\",\"titlePinyin\":[\"jiāng\",\"nán\",\"chūn\"],\"dynasty\":\"唐\",\"author\":\"杜牧\",\"lines\":[\"千里莺啼绿映红，\",\"水村山郭酒旗风。\",\"南朝四百八十寺，\",\"多少楼台烟雨中。\"],\"pinyin\":[[\"qiān\",\"lǐ\",\"yīng\",\"tí\",\"lǜ\",\"yìng\",\"hóng\"],[\"shuǐ\",\"cūn\",\"shān\",\"guō\",\"jiǔ\",\"qí\",\"fēng\"],[\"nán\",\"cháo\",\"sì\",\"bǎi\",\"bā\",\"shí\",\"sì\"],[\"duō\",\"shǎo\",\"lóu\",\"tái\",\"yān\",\"yǔ\",\"zhōng\"]],\"meaning\":\"江南到处莺歌燕舞、绿树红花，水乡山城酒旗招展，春雨笼罩着古寺楼台。\",\"detailedMeaning\":\"江南大地到处是黄莺歌唱、燕子飞舞，绿树红花彼此映衬，临水村庄和依山城郭的酒旗迎风招展。烟雨中，无数古寺楼台若隐若现。\",\"sourceUrl\":\"https://www.shicile.com/detail/9750003211195\"},{\"order\":48,\"slug\":\"poem-48\",\"title\":\"蜂\",\"titlePinyin\":[\"fēng\"],\"dynasty\":\"唐\",\"author\":\"罗隐\",\"lines\":[\"不论平地与山尖，\",\"无限风光尽被占。\",\"采得百花成蜜后，\",\"为谁辛苦为谁甜？\"],\"pinyin\":[[\"bù\",\"lùn\",\"píng\",\"dì\",\"yǔ\",\"shān\",\"jiān\"],[\"wú\",\"xiàn\",\"fēng\",\"guāng\",\"jìn\",\"bèi\",\"zhàn\"],[\"cǎi\",\"dé\",\"bǎi\",\"huā\",\"chéng\",\"mì\",\"hòu\"],[\"wèi\",\"shuí\",\"xīn\",\"kǔ\",\"wèi\",\"shuí\",\"tián\"]],\"meaning\":\"无论平地还是高山，鲜花盛开的地方都有蜜蜂；它们采尽百花，却不知甜蜜为谁。\",\"detailedMeaning\":\"无论平原还是高山，只要鲜花开放，都能看见蜜蜂忙碌。蜜蜂采尽百花酿成甜蜜，最终成果却被别人享用，诗人借此发出意味深长的疑问。\",\"sourceUrl\":\"https://www.shicile.com/detail/4500297174216\"},{\"order\":49,\"slug\":\"poem-49\",\"title\":\"江上渔者\",\"titlePinyin\":[\"jiāng\",\"shàng\",\"yú\",\"zhě\"],\"dynasty\":\"宋\",\"author\":\"范仲淹\",\"lines\":[\"江上往来人，\",\"但爱鲈鱼美。\",\"君看一叶舟，\",\"出没风波里。\"],\"pinyin\":[[\"jiāng\",\"shàng\",\"wǎng\",\"lái\",\"rén\"],[\"dàn\",\"ài\",\"lú\",\"yú\",\"měi\"],[\"jūn\",\"kàn\",\"yī\",\"yè\",\"zhōu\"],[\"chū\",\"mò\",\"fēng\",\"bō\",\"lǐ\"]],\"meaning\":\"江上来往的人喜爱鲈鱼鲜美，却没有看到渔人在风浪中驾着小船出没。\",\"detailedMeaning\":\"江岸上来来往往的人只爱鲈鱼味道鲜美，却没有留意捕鱼人的艰辛。看那一叶小舟在风浪中时隐时现，渔人正冒着危险谋生。\",\"sourceUrl\":\"https://www.shicile.com/detail/1510001563780\"},{\"order\":50,\"slug\":\"poem-51\",\"title\":\"元日\",\"titlePinyin\":[\"yuán\",\"rì\"],\"dynasty\":\"宋\",\"author\":\"王安石\",\"lines\":[\"爆竹声中一岁除，\",\"春风送暖入屠苏。\",\"千门万户曈曈日，\",\"总把新桃换旧符。\"],\"pinyin\":[[\"bào\",\"zhú\",\"shēng\",\"zhōng\",\"yī\",\"suì\",\"chú\"],[\"chūn\",\"fēng\",\"sòng\",\"nuǎn\",\"rù\",\"tú\",\"sū\"],[\"qiān\",\"mén\",\"wàn\",\"hù\",\"tóng\",\"tóng\",\"rì\"],[\"zǒng\",\"bǎ\",\"xīn\",\"táo\",\"huàn\",\"jiù\",\"fú\"]],\"meaning\":\"爆竹声中旧年过去，春风把温暖送入屠苏酒；家家换上新桃符迎接新年。\",\"detailedMeaning\":\"爆竹声中旧的一年结束，温暖春风送入新年，人们饮着屠苏酒庆贺。初升太阳照进千家万户，大家取下旧桃符、换上新的，迎接新春。\",\"sourceUrl\":\"https://www.shicile.com/detail/1440299316439\"},{\"order\":51,\"slug\":\"poem-50\",\"title\":\"泊船瓜洲\",\"titlePinyin\":[\"bó\",\"chuán\",\"guā\",\"zhōu\"],\"dynasty\":\"宋\",\"author\":\"王安石\",\"lines\":[\"京口瓜洲一水间，\",\"钟山只隔数重山。\",\"春风又绿江南岸，\",\"明月何时照我还。\"],\"pinyin\":[[\"jīng\",\"kǒu\",\"guā\",\"zhōu\",\"yī\",\"shuǐ\",\"jiān\"],[\"zhōng\",\"shān\",\"zhǐ\",\"gé\",\"shù\",\"chóng\",\"shān\"],[\"chūn\",\"fēng\",\"yòu\",\"lǜ\",\"jiāng\",\"nán\",\"àn\"],[\"míng\",\"yuè\",\"hé\",\"shí\",\"zhào\",\"wǒ\",\"huán\"]],\"meaning\":\"春风又吹绿江南岸，明月何时照我还乡，写出诗人面对故乡的深切思念。\",\"detailedMeaning\":\"京口和瓜洲只隔着一道长江，钟山也不过隔着几重山。春风再次吹绿江南岸，诗人望着明月，急切盼望何时能够回到故乡。\",\"sourceUrl\":\"https://www.shicile.com/detail/4690046016755\"},{\"order\":52,\"slug\":\"poem-52\",\"title\":\"书湖阴先生壁·其一\",\"titlePinyin\":[\"shū\",\"hú\",\"yīn\",\"xiān\",\"shēng\",\"bì\",\"qí\",\"yī\"],\"dynasty\":\"宋\",\"author\":\"王安石\",\"lines\":[\"茅檐长扫净无苔，\",\"花木成畦手自栽。\",\"一水护田将绿绕，\",\"两山排闼送青来。\"],\"pinyin\":[[\"máo\",\"yán\",\"cháng\",\"sǎo\",\"jìng\",\"wú\",\"tái\"],[\"huā\",\"mù\",\"chéng\",\"qí\",\"shǒu\",\"zì\",\"zāi\"],[\"yī\",\"shuǐ\",\"hù\",\"tián\",\"jiāng\",\"lǜ\",\"rào\"],[\"liǎng\",\"shān\",\"pái\",\"tà\",\"sòng\",\"qīng\",\"lái\"]],\"meaning\":\"茅屋常被青山绿水环绕，主人扫净庭院，门前两山仿佛推门送来青翠。\",\"detailedMeaning\":\"湖阴先生的茅屋常被主人打扫得干净整洁，庭院里一排花木也是亲手栽种。门前溪水环绕田地，两座青山仿佛推门而入，主动送来满眼青翠。\",\"sourceUrl\":\"https://www.shicile.com/detail/4020297955328\"},{\"order\":53,\"slug\":\"poem-53\",\"title\":\"六月二十七日望湖楼醉书\",\"titlePinyin\":[\"liù\",\"yuè\",\"èr\",\"shí\",\"qī\",\"rì\",\"wàng\",\"hú\",\"lóu\",\"zuì\",\"shū\"],\"dynasty\":\"宋\",\"author\":\"苏轼\",\"lines\":[\"黑云翻墨未遮山，\",\"白雨跳珠乱入船。\",\"卷地风来忽吹散，\",\"望湖楼下水如天。\"],\"pinyin\":[[\"hēi\",\"yún\",\"fān\",\"mò\",\"wèi\",\"zhē\",\"shān\"],[\"bái\",\"yǔ\",\"tiào\",\"zhū\",\"luàn\",\"rù\",\"chuán\"],[\"juǎn\",\"dì\",\"fēng\",\"lái\",\"hū\",\"chuī\",\"sàn\"],[\"wàng\",\"hú\",\"lóu\",\"xià\",\"shuǐ\",\"rú\",\"tiān\"]],\"meaning\":\"乌云像墨一样翻涌却未遮住群山，白雨跳入船中；风吹散云后，湖水开阔如天。\",\"detailedMeaning\":\"乌云像打翻的墨水迅速翻滚，却还没有完全遮住远山；白亮雨点像珍珠一样跳进船里。忽然狂风卷走云雨，望湖楼下水天相接，一片开阔。\",\"sourceUrl\":\"https://www.shicile.com/detail/5420298899820\"},{\"order\":54,\"slug\":\"poem-54\",\"title\":\"饮湖上初晴后雨二首·其二\",\"titlePinyin\":[\"yǐn\",\"hú\",\"shàng\",\"chū\",\"qíng\",\"hòu\",\"yǔ\",\"èr\",\"shǒu\",\"qí\",\"èr\"],\"dynasty\":\"宋\",\"author\":\"苏轼\",\"lines\":[\"水光潋滟晴方好，\",\"山色空蒙雨亦奇。\",\"欲把西湖比西子，\",\"淡妆浓抹总相宜。\"],\"pinyin\":[[\"shuǐ\",\"guāng\",\"liàn\",\"yàn\",\"qíng\",\"fāng\",\"hǎo\"],[\"shān\",\"sè\",\"kōng\",\"méng\",\"yǔ\",\"yì\",\"qí\"],[\"yù\",\"bǎ\",\"xī\",\"hú\",\"bǐ\",\"xī\",\"zǐ\"],[\"dàn\",\"zhuāng\",\"nóng\",\"mǒ\",\"zǒng\",\"xiāng\",\"yí\"]],\"meaning\":\"晴天西湖水光明艳，雨中山色朦胧；西湖像西施一样，无论淡妆浓抹都很合适。\",\"detailedMeaning\":\"晴天的西湖水面波光荡漾，非常秀美；下雨时山色笼罩在烟雨中，也别有情趣。若把西湖比作美人西施，无论淡雅还是浓艳的装扮都恰到好处。\",\"sourceUrl\":\"https://www.shicile.com/detail/140298220237\"},{\"order\":55,\"slug\":\"poem-55\",\"title\":\"惠崇春江晚景·其一\",\"titlePinyin\":[\"huì\",\"chóng\",\"chūn\",\"jiāng\",\"wǎn\",\"jǐng\",\"qí\",\"yī\"],\"dynasty\":\"宋\",\"author\":\"苏轼\",\"lines\":[\"竹外桃花三两枝，\",\"春江水暖鸭先知。\",\"蒌蒿满地芦芽短，\",\"正是河豚欲上时。\"],\"pinyin\":[[\"zhú\",\"wài\",\"táo\",\"huā\",\"sān\",\"liǎng\",\"zhī\"],[\"chūn\",\"jiāng\",\"shuǐ\",\"nuǎn\",\"yā\",\"xiān\",\"zhī\"],[\"lóu\",\"hāo\",\"mǎn\",\"dì\",\"lú\",\"yá\",\"duǎn\"],[\"zhèng\",\"shì\",\"hé\",\"tún\",\"yù\",\"shàng\",\"shí\"]],\"meaning\":\"竹林外桃花初开，鸭子最先感到春江水暖；蒌蒿满地，河豚也将逆流而上。\",\"detailedMeaning\":\"竹林外几枝桃花刚刚开放，水中游鸭最先感到春江转暖。河滩蒌蒿遍地、芦芽短嫩，诗人由眼前早春景物想到河豚将要逆流而上的时节。\",\"sourceUrl\":\"https://www.shicile.com/detail/6520000004279\"},{\"order\":56,\"slug\":\"poem-56\",\"title\":\"题西林壁\",\"titlePinyin\":[\"tí\",\"xī\",\"lín\",\"bì\"],\"dynasty\":\"宋\",\"author\":\"苏轼\",\"lines\":[\"横看成岭侧成峰，\",\"远近高低各不同。\",\"不识庐山真面目，\",\"只缘身在此山中。\"],\"pinyin\":[[\"héng\",\"kàn\",\"chéng\",\"lǐng\",\"cè\",\"chéng\",\"fēng\"],[\"yuǎn\",\"jìn\",\"gāo\",\"dī\",\"gè\",\"bù\",\"tóng\"],[\"bù\",\"shí\",\"lú\",\"shān\",\"zhēn\",\"miàn\",\"mù\"],[\"zhǐ\",\"yuán\",\"shēn\",\"zài\",\"cǐ\",\"shān\",\"zhōng\"]],\"meaning\":\"从正面侧面看庐山各不相同，身在山中就难认清全貌，说明看问题要有不同角度。\",\"detailedMeaning\":\"从正面、侧面、远处、近处和高低不同位置看，庐山会呈现各异的样子。之所以不能认清庐山真实全貌，是因为自己正在山中，说明观察事物需要跳出局限。\",\"sourceUrl\":\"https://www.shicile.com/detail/4770298890095\"},{\"order\":57,\"slug\":\"poem-57\",\"title\":\"夏日绝句\",\"titlePinyin\":[\"xià\",\"rì\",\"jué\",\"jù\"],\"dynasty\":\"宋\",\"author\":\"李清照\",\"lines\":[\"生当作人杰，\",\"死亦为鬼雄。\",\"至今思项羽，\",\"不肯过江东。\"],\"pinyin\":[[\"shēng\",\"dàng\",\"zuò\",\"rén\",\"jié\"],[\"sǐ\",\"yì\",\"wéi\",\"guǐ\",\"xióng\"],[\"zhì\",\"jīn\",\"sī\",\"xiàng\",\"yǔ\"],[\"bù\",\"kěn\",\"guò\",\"jiāng\",\"dōng\"]],\"meaning\":\"活着应当做人中豪杰，死后也要成为鬼中英雄，借项羽表达崇尚气节的态度。\",\"detailedMeaning\":\"人活着就应成为人中的豪杰，死后也要做鬼中的英雄。人们至今思念不肯过江逃生的项羽，诗人借古人气节表达自己崇尚英雄、反对苟且的态度。\",\"sourceUrl\":\"https://www.shicile.com/detail/2780298531437\"},{\"order\":58,\"slug\":\"poem-58\",\"title\":\"三衢道中\",\"titlePinyin\":[\"sān\",\"qú\",\"dào\",\"zhōng\"],\"dynasty\":\"宋\",\"author\":\"曾几\",\"lines\":[\"梅子黄时日日晴，\",\"小溪泛尽却山行。\",\"绿阴不减来时路，\",\"添得黄鹂四五声。\"],\"pinyin\":[[\"méi\",\"zǐ\",\"huáng\",\"shí\",\"rì\",\"rì\",\"qíng\"],[\"xiǎo\",\"xī\",\"fàn\",\"jìn\",\"què\",\"shān\",\"xíng\"],[\"lǜ\",\"yīn\",\"bù\",\"jiǎn\",\"lái\",\"shí\",\"lù\"],[\"tiān\",\"dé\",\"huáng\",\"lí\",\"sì\",\"wǔ\",\"shēng\"]],\"meaning\":\"梅子黄时天天晴朗，沿溪乘船后改走山路；绿荫不减，黄鹂声又添旅途兴味。\",\"detailedMeaning\":\"梅子成熟的时节却日日晴朗，诗人乘小船沿溪而行，到溪水尽头再改走山路。山中绿荫与来时一样浓密，黄鹂叫声又为安静旅程增添生机。\",\"sourceUrl\":\"https://www.shicile.com/detail/9010297465577\"},{\"order\":59,\"slug\":\"poem-59\",\"title\":\"示儿\",\"titlePinyin\":[\"shì\",\"ér\"],\"dynasty\":\"宋\",\"author\":\"陆游\",\"lines\":[\"死去元知万事空，\",\"但悲不见九州同。\",\"王师北定中原日，\",\"家祭无忘告乃翁。\"],\"pinyin\":[[\"sǐ\",\"qù\",\"yuán\",\"zhī\",\"wàn\",\"shì\",\"kōng\"],[\"dàn\",\"bēi\",\"bù\",\"jiàn\",\"jiǔ\",\"zhōu\",\"tóng\"],[\"wáng\",\"shī\",\"běi\",\"dìng\",\"zhōng\",\"yuán\",\"rì\"],[\"jiā\",\"jì\",\"wú\",\"wàng\",\"gào\",\"nǎi\",\"wēng\"]],\"meaning\":\"国家统一的那一天，祭祖时不要忘了告诉父亲，表现诗人至死不渝的爱国心愿。\",\"detailedMeaning\":\"诗人知道人死后万事皆空，唯一遗憾是没能亲眼看见国家统一。将来王师收复中原、家祭祖先时，孩子们一定不要忘记把这个好消息告诉他。\",\"sourceUrl\":\"https://www.shicile.com/detail/8100002542115\"},{\"order\":60,\"slug\":\"poem-60\",\"title\":\"秋夜将晓出篱门迎凉有感·其二\",\"titlePinyin\":[\"qiū\",\"yè\",\"jiāng\",\"xiǎo\",\"chū\",\"lí\",\"mén\",\"yíng\",\"liáng\",\"yǒu\",\"gǎn\",\"qí\",\"èr\"],\"dynasty\":\"宋\",\"author\":\"陆游\",\"lines\":[\"三万里河东入海，\",\"五千仞岳上摩天。\",\"遗民泪尽胡尘里，\",\"南望王师又一年。\"],\"pinyin\":[[\"sān\",\"wàn\",\"lǐ\",\"hé\",\"dōng\",\"rù\",\"hǎi\"],[\"wǔ\",\"qiān\",\"rèn\",\"yuè\",\"shàng\",\"mó\",\"tiān\"],[\"yí\",\"mín\",\"lèi\",\"jìn\",\"hú\",\"chén\",\"lǐ\"],[\"nán\",\"wàng\",\"wáng\",\"shī\",\"yòu\",\"yī\",\"nián\"]],\"meaning\":\"秋夜银烛映着冷屏，宫女轻扑流萤；她坐看牵牛织女星，流露出寂寞心情。\",\"detailedMeaning\":\"秋夜里银色烛光映着冰冷画屏，宫女拿小扇追扑流萤。夜色像凉水一样冷，她独自坐在台阶上仰望牵牛织女星，含蓄表现深宫生活的寂寞。\",\"sourceUrl\":\"https://www.shicile.com/detail/410297627401\"},{\"order\":61,\"slug\":\"poem-61\",\"title\":\"四时田园杂兴·其三十一\",\"titlePinyin\":[\"sì\",\"shí\",\"tián\",\"yuán\",\"zá\",\"xìng\",\"qí\",\"sān\",\"shí\",\"yī\"],\"dynasty\":\"宋\",\"author\":\"范成大\",\"lines\":[\"昼出耘田夜绩麻，\",\"村庄儿女各当家。\",\"童孙未解供耕织，\",\"也傍桑阴学种瓜。\"],\"pinyin\":[[\"zhòu\",\"chū\",\"yún\",\"tián\",\"yè\",\"jì\",\"má\"],[\"cūn\",\"zhuāng\",\"ér\",\"nǚ\",\"gè\",\"dāng\",\"jiā\"],[\"tóng\",\"sūn\",\"wèi\",\"jiě\",\"gòng\",\"gēng\",\"zhī\"],[\"yě\",\"bàng\",\"sāng\",\"yīn\",\"xué\",\"zhòng\",\"guā\"]],\"meaning\":\"白天在田里除草，夜里搓麻线，乡村儿女各自劳作；孩子也学着在瓜旁种田。\",\"detailedMeaning\":\"白天到田里除草，夜晚在家搓麻线，村中男女老少各自承担农活。孩子虽然不会正式耕织，也在桑树阴下学着大人的样子种瓜。\",\"sourceUrl\":\"https://www.shicile.com/detail/6770286590693\"},{\"order\":62,\"slug\":\"poem-62\",\"title\":\"四时田园杂兴·其二十五\",\"titlePinyin\":[\"sì\",\"shí\",\"tián\",\"yuán\",\"zá\",\"xìng\",\"qí\",\"èr\",\"shí\",\"wǔ\"],\"dynasty\":\"宋\",\"author\":\"范成大\",\"lines\":[\"梅子金黄杏子肥，\",\"麦花雪白菜花稀。\",\"日长篱落无人过，\",\"惟有蜻蜓蛱蝶飞。\"],\"pinyin\":[[\"méi\",\"zǐ\",\"jīn\",\"huáng\",\"xìng\",\"zǐ\",\"féi\"],[\"mài\",\"huā\",\"xuě\",\"bái\",\"cài\",\"huā\",\"xī\"],[\"rì\",\"cháng\",\"lí\",\"luò\",\"wú\",\"rén\",\"guò\"],[\"wéi\",\"yǒu\",\"qīng\",\"tíng\",\"jiá\",\"dié\",\"fēi\"]],\"meaning\":\"梅子金黄、杏子肥大，麦花雪白、菜花稀落；篱边无人，只有蜻蜓蝴蝶飞过。\",\"detailedMeaning\":\"初夏时梅子金黄、杏子肥大，荞麦花雪白，油菜花已经稀落。白昼渐长，篱笆旁没有行人经过，只有蜻蜓和蝴蝶自在飞舞。\",\"sourceUrl\":\"https://www.shicile.com/detail/7210298955836\"},{\"order\":63,\"slug\":\"poem-63\",\"title\":\"小池\",\"titlePinyin\":[\"xiǎo\",\"chí\"],\"dynasty\":\"宋\",\"author\":\"杨万里\",\"lines\":[\"泉眼无声惜细流，\",\"树阴照水爱晴柔。\",\"小荷才露尖尖角，\",\"早有蜻蜓立上头。\"],\"pinyin\":[[\"quán\",\"yǎn\",\"wú\",\"shēng\",\"xī\",\"xì\",\"liú\"],[\"shù\",\"yīn\",\"zhào\",\"shuǐ\",\"ài\",\"qíng\",\"róu\"],[\"xiǎo\",\"hé\",\"cái\",\"lù\",\"jiān\",\"jiān\",\"jiǎo\"],[\"zǎo\",\"yǒu\",\"qīng\",\"tíng\",\"lì\",\"shàng\",\"tóu\"]],\"meaning\":\"泉眼无声地流出细水，树荫映在水面；小荷刚露尖角，蜻蜓早已停在上面。\",\"detailedMeaning\":\"泉眼悄无声息，是舍不得细细的水流；树荫映在水面，仿佛喜爱晴日的柔光。嫩荷刚露出尖尖小角，一只蜻蜓早已停在上面。\",\"sourceUrl\":\"https://www.shicile.com/detail/2170299131275\"},{\"order\":64,\"slug\":\"poem-64\",\"title\":\"晓出净慈寺送林子方\",\"titlePinyin\":[\"xiǎo\",\"chū\",\"jìng\",\"cí\",\"sì\",\"sòng\",\"lín\",\"zǐ\",\"fāng\"],\"dynasty\":\"宋\",\"author\":\"杨万里\",\"lines\":[\"毕竟西湖六月中，\",\"风光不与四时同。\",\"接天莲叶无穷碧，\",\"映日荷花别样红。\"],\"pinyin\":[[\"bì\",\"jìng\",\"xī\",\"hú\",\"liù\",\"yuè\",\"zhōng\"],[\"fēng\",\"guāng\",\"bù\",\"yǔ\",\"sì\",\"shí\",\"tóng\"],[\"jiē\",\"tiān\",\"lián\",\"yè\",\"wú\",\"qióng\",\"bì\"],[\"yìng\",\"rì\",\"hé\",\"huā\",\"bié\",\"yàng\",\"hóng\"]],\"meaning\":\"六月西湖景色不同，莲叶无边碧绿，荷花映着太阳格外鲜红。\",\"detailedMeaning\":\"六月的西湖与四季其他时候不同，景色格外鲜明。层层莲叶一直铺到天边，呈现无尽碧绿；荷花映着阳光，红得格外耀眼。\",\"sourceUrl\":\"https://www.shicile.com/detail/5620297190943\"},{\"order\":65,\"slug\":\"poem-65\",\"title\":\"春日\",\"titlePinyin\":[\"chūn\",\"rì\"],\"dynasty\":\"宋\",\"author\":\"朱熹\",\"lines\":[\"胜日寻芳泗水滨，\",\"无边光景一时新。\",\"等闲识得东风面，\",\"万紫千红总是春。\"],\"pinyin\":[[\"shèng\",\"rì\",\"xún\",\"fāng\",\"sì\",\"shuǐ\",\"bīn\"],[\"wú\",\"biān\",\"guāng\",\"jǐng\",\"yī\",\"shí\",\"xīn\"],[\"děng\",\"xián\",\"shí\",\"dé\",\"dōng\",\"fēng\",\"miàn\"],[\"wàn\",\"zǐ\",\"qiān\",\"hóng\",\"zǒng\",\"shì\",\"chūn\"]],\"meaning\":\"春游中随意来到泗水边，处处焕然一新；百花齐放的春天总是容易辨认。\",\"detailedMeaning\":\"风和日丽的一天，诗人来到泗水边游赏，眼前景物焕然一新。人们很容易认出春风的面貌，因为春风所到之处，总有万紫千红的花朵开放。\",\"sourceUrl\":\"https://www.shicile.com/detail/1040298598345\"},{\"order\":66,\"slug\":\"poem-66\",\"title\":\"观书有感·其一\",\"titlePinyin\":[\"guān\",\"shū\",\"yǒu\",\"gǎn\",\"qí\",\"yī\"],\"dynasty\":\"宋\",\"author\":\"朱熹\",\"lines\":[\"半亩方塘一鉴开，\",\"天光云影共徘徊。\",\"问渠那得清如许？\",\"为有源头活水来。\"],\"pinyin\":[[\"bàn\",\"mǔ\",\"fāng\",\"táng\",\"yī\",\"jiàn\",\"kāi\"],[\"tiān\",\"guāng\",\"yún\",\"yǐng\",\"gòng\",\"pái\",\"huái\"],[\"wèn\",\"qú\",\"nǎ\",\"dé\",\"qīng\",\"rú\",\"xǔ\"],[\"wèi\",\"yǒu\",\"yuán\",\"tóu\",\"huó\",\"shuǐ\",\"lái\"]],\"meaning\":\"半亩池塘像镜子映着天光云影；水清是因为源头不断有活水流来。\",\"detailedMeaning\":\"半亩方塘像打开的一面镜子，天空云影都在清澈水中移动。诗人追问池水为何这样清澈，答案是源头不断有活水流来，也比喻学习要持续吸收新知识。\",\"sourceUrl\":\"https://www.shicile.com/detail/6280006062565\"},{\"order\":67,\"slug\":\"poem-67\",\"title\":\"题临安邸\",\"titlePinyin\":[\"tí\",\"lín\",\"ān\",\"dǐ\"],\"dynasty\":\"宋\",\"author\":\"林升\",\"lines\":[\"山外青山楼外楼，\",\"西湖歌舞几时休？\",\"暖风熏得游人醉，\",\"直把杭州作汴州。\"],\"pinyin\":[[\"shān\",\"wài\",\"qīng\",\"shān\",\"lóu\",\"wài\",\"lóu\"],[\"xī\",\"hú\",\"gē\",\"wǔ\",\"jǐ\",\"shí\",\"xiū\"],[\"nuǎn\",\"fēng\",\"xūn\",\"de\",\"yóu\",\"rén\",\"zuì\"],[\"zhí\",\"bǎ\",\"háng\",\"zhōu\",\"zuò\",\"biàn\",\"zhōu\"]],\"meaning\":\"西湖歌舞何时停止，暖风让游人沉醉，竟把临安当成了汴州，表达忧国之情。\",\"detailedMeaning\":\"青山之外楼台一座接一座，西湖边的歌舞不知何时才能停止。温暖香风把权贵游人吹得沉醉，他们竟把偏安的临安当成故都汴州，诗人对此深感忧愤。\",\"sourceUrl\":\"https://www.shicile.com/detail/3830297467133\"},{\"order\":68,\"slug\":\"poem-68\",\"title\":\"游园不值\",\"titlePinyin\":[\"yóu\",\"yuán\",\"bù\",\"zhí\"],\"dynasty\":\"宋\",\"author\":\"叶绍翁\",\"lines\":[\"应怜屐齿印苍苔，\",\"小扣柴扉久不开。\",\"春色满园关不住，\",\"一枝红杏出墙来。\"],\"pinyin\":[[\"yīng\",\"lián\",\"jī\",\"chǐ\",\"yìn\",\"cāng\",\"tái\"],[\"xiǎo\",\"kòu\",\"chái\",\"fēi\",\"jiǔ\",\"bù\",\"kāi\"],[\"chūn\",\"sè\",\"mǎn\",\"yuán\",\"guān\",\"bù\",\"zhù\"],[\"yī\",\"zhī\",\"hóng\",\"xìng\",\"chū\",\"qiáng\",\"lái\"]],\"meaning\":\"满园春色关不住，一枝红杏伸出墙来；诗人虽未入园，却看见了蓬勃春意。\",\"detailedMeaning\":\"诗人轻敲柴门，很久没有人来开，也许主人担心木屐踩坏园中青苔。虽然未能入园，满园春色却无法被柴门关住，一枝红杏已经伸到墙外。\",\"sourceUrl\":\"https://www.shicile.com/detail/6860297215061\"},{\"order\":69,\"slug\":\"poem-69\",\"title\":\"乡村四月\",\"titlePinyin\":[\"xiāng\",\"cūn\",\"sì\",\"yuè\"],\"dynasty\":\"宋\",\"author\":\"翁卷\",\"lines\":[\"绿遍山原白满川，\",\"子规声里雨如烟。\",\"乡村四月闲人少，\",\"才了蚕桑又插田。\"],\"pinyin\":[[\"lǜ\",\"biàn\",\"shān\",\"yuán\",\"bái\",\"mǎn\",\"chuān\"],[\"zǐ\",\"guī\",\"shēng\",\"lǐ\",\"yǔ\",\"rú\",\"yān\"],[\"xiāng\",\"cūn\",\"sì\",\"yuè\",\"xián\",\"rén\",\"shǎo\"],[\"cái\",\"liǎo\",\"cán\",\"sāng\",\"yòu\",\"chā\",\"tián\"]],\"meaning\":\"山坡原野一片翠绿，杜鹃声中细雨如烟；乡村四月农事忙，刚养蚕又要插田。\",\"detailedMeaning\":\"山坡田野一片翠绿，水田映着天空，杜鹃叫声中细雨如烟。四月乡村里没有闲人，养蚕工作刚刚结束，人们又立刻投入插秧。\",\"sourceUrl\":\"https://www.shicile.com/detail/8150298943777\"},{\"order\":70,\"slug\":\"poem-70\",\"title\":\"墨梅\",\"titlePinyin\":[\"mò\",\"méi\"],\"dynasty\":\"元\",\"author\":\"王冕\",\"lines\":[\"我家洗砚池头树，\",\"朵朵花开淡墨痕。\",\"不要人夸好颜色，\",\"只留清气满乾坤。\"],\"pinyin\":[[\"wǒ\",\"jiā\",\"xǐ\",\"yàn\",\"chí\",\"tóu\",\"shù\"],[\"duǒ\",\"duǒ\",\"huā\",\"kāi\",\"dàn\",\"mò\",\"hén\"],[\"bù\",\"yào\",\"rén\",\"kuā\",\"hǎo\",\"yán\",\"sè\"],[\"zhǐ\",\"liú\",\"qīng\",\"qì\",\"mǎn\",\"qián\",\"kūn\"]],\"meaning\":\"墨梅只把清香留在人间，不求人夸赞颜色，表现清白高洁、不求虚名的品格。\",\"detailedMeaning\":\"画中的梅树生长在洗砚池边，每朵花都是淡淡墨色，没有鲜艳色彩。它不需要别人夸赞颜色漂亮，只愿把清香和高洁品格留在人间。\",\"sourceUrl\":\"https://www.shicile.com/detail/9360297322814\"},{\"order\":71,\"slug\":\"poem-71\",\"title\":\"石灰吟\",\"titlePinyin\":[\"shí\",\"huī\",\"yín\"],\"dynasty\":\"明\",\"author\":\"于谦\",\"lines\":[\"千锤万凿出深山，\",\"烈火焚烧若等闲。\",\"粉骨碎身浑不怕，\",\"要留清白在人间。\"],\"pinyin\":[[\"qiān\",\"chuí\",\"wàn\",\"záo\",\"chū\",\"shēn\",\"shān\"],[\"liè\",\"huǒ\",\"fén\",\"shāo\",\"ruò\",\"děng\",\"xián\"],[\"fěn\",\"gǔ\",\"suì\",\"shēn\",\"hún\",\"bù\",\"pà\"],[\"yào\",\"liú\",\"qīng\",\"bái\",\"zài\",\"rén\",\"jiān\"]],\"meaning\":\"石灰经受烈火和锤炼仍从容，即使粉身碎骨也要保持清白，象征坚定气节。\",\"detailedMeaning\":\"石灰石要经过千锤万凿才从深山开采出来，把烈火焚烧看作平常。即使粉身碎骨也毫不畏惧，只愿把清白留在人间，象征坚贞不屈的气节。\",\"sourceUrl\":\"https://www.shicile.com/detail/9250298170834\"},{\"order\":72,\"slug\":\"poem-72\",\"title\":\"竹石\",\"titlePinyin\":[\"zhú\",\"shí\"],\"dynasty\":\"清\",\"author\":\"郑燮\",\"lines\":[\"咬定青山不放松，\",\"立根原在破岩中。\",\"千磨万击还坚劲，\",\"任尔东西南北风。\"],\"pinyin\":[[\"yǎo\",\"dìng\",\"qīng\",\"shān\",\"bù\",\"fàng\",\"sōng\"],[\"lì\",\"gēn\",\"yuán\",\"zài\",\"pò\",\"yán\",\"zhōng\"],[\"qiān\",\"mó\",\"wàn\",\"jī\",\"hái\",\"jiān\",\"jìng\"],[\"rèn\",\"ěr\",\"dōng\",\"xī\",\"nán\",\"běi\",\"fēng\"]],\"meaning\":\"竹子咬定青山扎根岩缝，无论风从何处来都坚韧不屈，赞美顽强品格。\",\"detailedMeaning\":\"竹子紧紧咬住青山，根须牢牢扎在破裂岩石中。无论经历多少磨难，无论风从哪个方向猛烈吹来，它仍坚定强劲、不肯低头。\",\"sourceUrl\":\"https://www.shicile.com/detail/1450007387888\"},{\"order\":73,\"slug\":\"poem-73\",\"title\":\"所见\",\"titlePinyin\":[\"suǒ\",\"jiàn\"],\"dynasty\":\"清\",\"author\":\"袁枚\",\"lines\":[\"牧童骑黄牛，\",\"歌声振林樾。\",\"意欲捕鸣蝉，\",\"忽然闭口立。\"],\"pinyin\":[[\"mù\",\"tóng\",\"qí\",\"huáng\",\"niú\"],[\"gē\",\"shēng\",\"zhèn\",\"lín\",\"yuè\"],[\"yì\",\"yù\",\"bǔ\",\"míng\",\"chán\"],[\"hū\",\"rán\",\"bì\",\"kǒu\",\"lì\"]],\"meaning\":\"牧童骑在牛背上歌声响亮，忽然想捉鸣蝉，立刻闭口静静站住。\",\"detailedMeaning\":\"牧童骑在黄牛背上，嘹亮歌声在树林里回荡。忽然他想捕捉树上鸣叫的蝉，便马上停止歌唱，悄悄站立凝神寻找。\",\"sourceUrl\":\"https://www.shicile.com/detail/2730297325148\"},{\"order\":74,\"slug\":\"poem-75\",\"title\":\"村居\",\"titlePinyin\":[\"cūn\",\"jū\"],\"dynasty\":\"清\",\"author\":\"高鼎\",\"lines\":[\"草长莺飞二月天，\",\"拂堤杨柳醉春烟。\",\"儿童散学归来早，\",\"忙趁东风放纸鸢。\"],\"pinyin\":[[\"cǎo\",\"zhǎng\",\"yīng\",\"fēi\",\"èr\",\"yuè\",\"tiān\"],[\"fú\",\"dī\",\"yáng\",\"liǔ\",\"zuì\",\"chūn\",\"yān\"],[\"ér\",\"tóng\",\"sàn\",\"xué\",\"guī\",\"lái\",\"zǎo\"],[\"máng\",\"chèn\",\"dōng\",\"fēng\",\"fàng\",\"zhǐ\",\"yuān\"]],\"meaning\":\"农历二月草长莺飞，杨柳轻拂堤岸；孩子们放学早归，趁东风放起风筝。\",\"detailedMeaning\":\"农历二月，青草生长、黄莺飞舞，长堤杨柳仿佛沉醉在春烟里。孩子们放学后早早回家，赶忙借着东风放起风筝，充满明快的生活气息。\",\"sourceUrl\":\"https://www.shicile.com/detail/6910298172390\"},{\"order\":75,\"slug\":\"poem-74\",\"title\":\"己亥杂诗\",\"titlePinyin\":[\"jǐ\",\"hài\",\"zá\",\"shī\"],\"dynasty\":\"清\",\"author\":\"龚自珍\",\"lines\":[\"九州生气恃风雷，\",\"万马齐喑究可哀。\",\"我劝天公重抖擞，\",\"不拘一格降人才。\"],\"pinyin\":[[\"jiǔ\",\"zhōu\",\"shēng\",\"qì\",\"shì\",\"fēng\",\"léi\"],[\"wàn\",\"mǎ\",\"qí\",\"yīn\",\"jiū\",\"kě\",\"āi\"],[\"wǒ\",\"quàn\",\"tiān\",\"gōng\",\"chóng\",\"dǒu\",\"sǒu\"],[\"bù\",\"jū\",\"yī\",\"gé\",\"jiàng\",\"rén\",\"cái\"]],\"meaning\":\"离别京都的愁绪像落日一样浩荡；落花化作春泥护育新花，表达奉献之心。\",\"detailedMeaning\":\"离开京城时，诗人满怀离愁，夕阳一直伸向远方。他挥鞭指向东边，从此与朝廷天涯相隔；但自己并非无情落花，仍愿化作春泥培育后来者。\",\"sourceUrl\":\"https://www.shicile.com/detail/1250046010531\"}]\u003c/script>\n\u003cscript>\nconst poems=JSON.parse(document.getElementById('poemData').textContent),periods=['全部','汉魏南北朝','唐','宋','元明清'],punctuation=new Set('，。？！、；：（）'.split('')),storageKey='shijianji-unfamiliarity-v1',learnedKey='shijianji-learned-v1',fontKey='shijianji-poem-font-level-v1',fontLevels=[['clamp(18px,3vw,22px)','8px','最小'],['clamp(21px,3.5vw,26px)','9px','较小'],['clamp(23px,4vw,29px)','10px','标准'],['clamp(26px,4.5vw,33px)','11px','较大'],['clamp(29px,5vw,37px)','12px','大'],['clamp(32px,5.5vw,41px)','13px','最大']];let period='全部',query='',sortMode='default',unfamiliarity={},learnedState={},fontLevel=2,currentVisiblePoems=[],persistRequested=false,randomPreviewSlug='',randomPreviewStage=0;\nconst $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction readFontLevel(){try{const value=Number(localStorage.getItem(fontKey));return Number.isInteger(value)&&value>=0&&value\u003cfontLevels.length?value:2}catch{return 2}}\nfunction applyFontLevel(level,save=false){fontLevel=Math.max(0,Math.min(fontLevels.length-1,level));const [size,pinyin,label]=fontLevels[fontLevel];document.documentElement.style.setProperty('--poem-font',size);document.documentElement.style.setProperty('--poem-pinyin',pinyin);$('fontLabel').textContent=label;$('fontDecrease').disabled=fontLevel===0;$('fontIncrease').disabled=fontLevel===fontLevels.length-1;if(save)try{localStorage.setItem(fontKey,String(fontLevel))}catch{}}\nfunction adjustFont(delta){applyFontLevel(fontLevel+delta,true)}\nfunction cleanCounts(value){const result={};if(value&&typeof value==='object')for(const poem of poems){const count=Number(value[poem.slug]);if(Number.isSafeInteger(count)&&count>0)result[poem.slug]=count}return result}\nfunction readLocal(){try{return cleanCounts(JSON.parse(localStorage.getItem(storageKey)||'{}'))}catch{return {}}}\nfunction writeLocal(){try{localStorage.setItem(storageKey,JSON.stringify(unfamiliarity))}catch{}}\nfunction cleanLearned(value){const result={};if(value&&typeof value==='object')for(const poem of poems){const record=value[poem.slug];if(record&&typeof record.value==='boolean'&&Number.isFinite(Number(record.updatedAt)))result[poem.slug]={value:record.value,updatedAt:Number(record.updatedAt)}}return result}\nfunction mergeLearned(first,second){const result={...cleanLearned(first)};for(const [slug,record] of Object.entries(cleanLearned(second)))if(!result[slug]||record.updatedAt>=result[slug].updatedAt)result[slug]=record;return result}\nfunction isLearned(slug){return learnedState[slug]?.value===true}\nfunction readLearnedLocal(){try{return cleanLearned(JSON.parse(localStorage.getItem(learnedKey)||'{}'))}catch{return {}}}\nfunction writeLearnedLocal(){try{localStorage.setItem(learnedKey,JSON.stringify(learnedState))}catch{}}\nfunction openProgressDb(){return new Promise((resolve,reject)=>{try{const request=indexedDB.open('shijianji-local-progress',1);request.onupgradeneeded=()=>request.result.createObjectStore('progress');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)}catch(error){reject(error)}})}\nasync function readIndexed(){try{const db=await openProgressDb();return await new Promise((resolve,reject)=>{const request=db.transaction('progress').objectStore('progress').get(storageKey);request.onsuccess=()=>resolve(cleanCounts(request.result));request.onerror=()=>reject(request.error)})}catch{return {}}}\nasync function writeIndexed(){try{const db=await openProgressDb();await new Promise((resolve,reject)=>{const transaction=db.transaction('progress','readwrite');transaction.objectStore('progress').put(unfamiliarity,storageKey);transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error)})}catch{}}\nasync function readLearnedIndexed(){try{const db=await openProgressDb();return await new Promise((resolve,reject)=>{const request=db.transaction('progress').objectStore('progress').get(learnedKey);request.onsuccess=()=>resolve(cleanLearned(request.result));request.onerror=()=>reject(request.error)})}catch{return {}}}\nasync function writeLearnedIndexed(){try{const db=await openProgressDb();await new Promise((resolve,reject)=>{const transaction=db.transaction('progress','readwrite');transaction.objectStore('progress').put(learnedState,learnedKey);transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error)})}catch{}}\nasync function initProgress(){const local=readLocal(),indexed=await readIndexed(),learnedLocal=readLearnedLocal(),learnedIndexed=await readLearnedIndexed();for(const poem of poems)unfamiliarity[poem.slug]=Math.max(local[poem.slug]||0,indexed[poem.slug]||0);unfamiliarity=cleanCounts(unfamiliarity);learnedState=mergeLearned(learnedLocal,learnedIndexed);writeLocal();writeIndexed();writeLearnedLocal();writeLearnedIndexed();renderList();renderRoute()}\nfunction saveProgress(){writeLocal();writeIndexed()}\nfunction saveLearned(){writeLearnedLocal();writeLearnedIndexed()}\nfunction requestPersistentStorage(){if(persistRequested)return;persistRequested=true;try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch{}}\nfunction addUnfamiliarity(slug){unfamiliarity[slug]=(unfamiliarity[slug]||0)+1;saveProgress();requestPersistentStorage();const count=$('unfamiliarCount');if(count){count.textContent=unfamiliarity[slug];count.classList.remove('saveFlash');void count.offsetWidth;count.classList.add('saveFlash')}}\nfunction toggleLearned(slug){learnedState[slug]={value:!isLearned(slug),updatedAt:Date.now()};saveLearned();requestPersistentStorage();renderList();renderRoute()}\nfunction group(d){return ['汉','北朝民歌'].includes(d)?'汉魏南北朝':d==='唐'?'唐':d==='宋'?'宋':'元明清'}\nfunction normalizeSearch(value){return String(value??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/s+/g,'')}\nfunction searchableText(poem){return normalizeSearch([poem.title,poem.author,poem.dynasty,poem.titlePinyin.join(''),poem.lines.join(''),poem.pinyin.flat().join(''),poem.meaning,poem.detailedMeaning].join(''))}\nfunction matchesSearch(poem,value){const terms=String(value).trim().split(/s+/).filter(Boolean).map(normalizeSearch);if(!terms.length)return true;const text=searchableText(poem);return terms.every(term=>text.includes(term))}\nfunction renderFilters(){$('filters').innerHTML=periods.map(x=>'\u003cbutton type=\"button\" class=\"'+(x===period?'active':'')+'\" data-period=\"'+x+'\">'+x+'\u003c/button>').join('')}\nfunction renderList(){const visible=poems.filter(p=>(period==='全部'||group(p.dynasty)===period)&&matchesSearch(p,query));visible.sort((a,b)=>sortMode==='unfamiliar-asc'?((unfamiliarity[a.slug]||0)-(unfamiliarity[b.slug]||0)||a.order-b.order):sortMode==='unfamiliar-desc'?((unfamiliarity[b.slug]||0)-(unfamiliarity[a.slug]||0)||a.order-b.order):a.order-b.order);currentVisiblePoems=visible;$('count').textContent=visible.length;$('empty').hidden=visible.length>0;$('randomPoem').disabled=visible.length===0;$('randomPoem').setAttribute('aria-label',visible.length?'从当前 '+visible.length+' 篇诗词中随机选择一篇':'当前没有可随机选择的诗词');$('grid').innerHTML=visible.map(p=>'\u003ca class=\"card '+(isLearned(p.slug)?'learnedCard':'')+'\" href=\"#'+p.slug+'\" aria-label=\"查看《'+esc(p.title)+'》详情\">\u003cspan class=\"order\">'+String(p.order).padStart(2,'0')+'\u003c/span>\u003cdiv class=\"copy\">\u003ch2>'+esc(p.title)+'\u003c/h2>\u003cp class=\"author\">〔'+esc(p.dynasty)+'〕'+esc(p.author)+'\u003c/p>\u003cp class=\"excerpt\">'+esc(p.lines[0])+'\u003c/p>\u003cspan class=\"cardBadges\">'+(isLearned(p.slug)?'\u003cspan class=\"learnedBadge\">✓ 已背\u003c/span>':'')+(unfamiliarity[p.slug]?'\u003cspan class=\"unfamiliarBadge\">不熟悉度 '+unfamiliarity[p.slug]+'\u003c/span>':'')+'\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">›\u003c/span>\u003c/a>').join('')}\nfunction openRandomPoem(){if(!currentVisiblePoems.length)return;const poem=currentVisiblePoems[Math.floor(Math.random()*currentVisiblePoems.length)];randomPreviewSlug=poem.slug;randomPreviewStage=1;if(location.hash==='#'+poem.slug)renderRoute();else location.hash=poem.slug}\nfunction lineHtml(line,pinyin){let i=0;return '\u003cdiv class=\"line\">'+[...line].map((char,n)=>punctuation.has(char)?'\u003cspan class=\"punct\">'+char+'\u003c/span>':'\u003cruby>\u003cspan>'+esc(char)+'\u003c/span>\u003crt>'+esc(pinyin[i++])+'\u003c/rt>\u003c/ruby>').join('')+'\u003c/div>'}\nfunction titleHtml(poem){let i=0;return [...poem.title].map(char=>/[㐀-鿿]/u.test(char)?'\u003cruby>\u003cspan>'+esc(char)+'\u003c/span>\u003crt>'+esc(poem.titlePinyin[i++])+'\u003c/rt>\u003c/ruby>':'\u003cspan class=\"titleSymbol\">'+esc(char)+'\u003c/span>').join('')}\nfunction renderRoute(){const slug=location.hash.slice(1),poem=poems.find(p=>p.slug===slug);if(!poem){randomPreviewSlug='';randomPreviewStage=0;$('listView').hidden=false;$('detailView').hidden=true;$('back').hidden=true;$('footer').hidden=false;document.title='诗间集｜小学必背古诗词75篇';renderList();return}$('listView').hidden=true;$('detailView').hidden=false;$('back').hidden=false;$('footer').hidden=true;if(randomPreviewSlug===slug&&randomPreviewStage>0){const author=randomPreviewStage>=2?'\u003cp class=\"previewAuthor\">〔'+esc(poem.dynasty)+'〕'+esc(poem.author)+'\u003c/p>':'',firstLine=randomPreviewStage>=3?'\u003cp class=\"previewFirstLine\">'+esc(poem.lines[0])+'\u003c/p>':'',hint=randomPreviewStage===1?'点击屏幕显示作者':randomPreviewStage===2?'点击屏幕显示第一句':'点击屏幕查看全文';$('detail').classList.add('randomPreview');$('detail').innerHTML='\u003cdiv>\u003cdiv class=\"title\">\u003ch1>'+esc(poem.title)+'\u003c/h1>'+author+firstLine+'\u003c/div>\u003cp class=\"revealHint\">'+hint+'\u003c/p>\u003cbutton class=\"revealAll\" type=\"button\" data-reveal-all>直接显示全文\u003c/button>\u003c/div>';document.title=poem.title+'｜随机背诵｜诗间集';scrollTo(0,0);return}randomPreviewSlug='';randomPreviewStage=0;$('detail').classList.remove('randomPreview');const index=poems.indexOf(poem),previous=poems[(index-1+poems.length)%poems.length],next=poems[(index+1)%poems.length],learned=isLearned(poem.slug);$('detail').innerHTML='\u003cdiv class=\"title\">\u003cp class=\"eyebrow\">第 '+String(poem.order).padStart(2,'0')+' 篇 · 小学必背\u003c/p>\u003ch1 class=\"titlePinyin\">'+titleHtml(poem)+'\u003c/h1>\u003cp>〔'+esc(poem.dynasty)+'〕'+esc(poem.author)+'\u003c/p>\u003c/div>\u003csection class=\"practice\">\u003cdiv class=\"practiceInfo\">\u003cp class=\"eyebrow\">背诵记录\u003c/p>\u003cstrong class=\"practiceCount\">不熟悉度 \u003cb id=\"unfamiliarCount\">'+(unfamiliarity[poem.slug]||0)+'\u003c/b>\u003c/strong>\u003csmall class=\"storageNote\">自动保存在当前浏览器，仅本机可见\u003c/small>\u003c/div>\u003cdiv class=\"practiceActions\">\u003cbutton class=\"learnedToggle '+(learned?'active':'')+'\" type=\"button\" data-learned=\"'+poem.slug+'\" aria-pressed=\"'+learned+'\">'+(learned?'✓ 已背 · 点击取消':'标记为已背')+'\u003c/button>\u003cbutton class=\"increment\" type=\"button\" data-increment=\"'+poem.slug+'\">没背出来 +1\u003c/button>\u003c/div>\u003c/section>\u003csection class=\"reading\">\u003cdiv class=\"label\">原文 · 逐字拼音\u003c/div>\u003cdiv class=\"lines\">'+poem.lines.map((line,i)=>lineHtml(line,poem.pinyin[i])).join('')+'\u003c/div>\u003cp class=\"source\">注音来源：\u003ca href=\"'+esc(poem.sourceUrl)+'\" target=\"_blank\" rel=\"noreferrer\">诗词乐原页面 ↗\u003c/a> · 已按诗句逐字对齐校验\u003c/p>\u003c/section>\u003csection class=\"meaning\">\u003cp class=\"eyebrow\">简明诗意\u003c/p>\u003ch2>这首诗在说什么？\u003c/h2>\u003cp class=\"text\">'+esc(poem.meaning)+'\u003c/p>\u003c/section>\u003csection class=\"detailed\">\u003cp class=\"eyebrow\">详细诗意\u003c/p>\u003ch2>逐层读懂这首诗\u003c/h2>\u003cp class=\"text\">'+esc(poem.detailedMeaning)+'\u003c/p>\u003c/section>\u003cnav class=\"nav\">\u003ca href=\"#'+previous.slug+'\">\u003csmall>上一篇\u003c/small>\u003cspan>← '+esc(previous.title)+'\u003c/span>\u003c/a>\u003ca href=\"#'+next.slug+'\">\u003csmall>下一篇\u003c/small>\u003cspan>'+esc(next.title)+' →\u003c/span>\u003c/a>\u003c/nav>';document.title=poem.title+'｜诗间集';scrollTo(0,0)}\n$('fontDecrease').addEventListener('click',()=>adjustFont(-1));$('fontIncrease').addEventListener('click',()=>adjustFont(1));$('randomPoem').addEventListener('click',openRandomPoem);$('filters').addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;period=button.dataset.period;renderFilters();renderList()});$('sea 03c/option>\u003c/select>\u003c/label>\u003cp>显示 \u003cstrong id=\"count\">318\u003c/strong> / 318 篇\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"grid\" id=\"grid\">\u003c/div>\u003cdiv class=\"empty\" id=\"empty\" hidden>没有找到相关诗词，请换个关键词。\u003c/div>\u003c/section>\n  \u003cdiv class=\"mobileListBar\">\u003cbutton class=\"randomPoemButton\" id=\"randomPoem\" type=\"button\">随机背一首\u003c/button>\u003c/div>\n\u003c/main>\n\u003cmain id=\"detailView\" hidden>\u003carticle class=\"detail\" id=\"detail\">\u003c/article>\u003c/main>\n\u003cfooter id=\"footer\">诗词乐《唐诗三百首》合集共 318 篇，全部数据和功能均已包含在此 HTML 文件中，无需联网即可阅读；来源链接需联网打开。\u003c/footer>\n\u003cscript type=\"application/json\" id=\"poemData\">[{\"order\":1,\"slug\":\"tang-001\",\"title\":\"将进酒\",\"titlePinyin\":[\"qiāng\",\"jìn\",\"jiǔ\"],\"dynasty\":\"唐\",\"author\":\"李白\",\"lines\":[\"君不见，黄河之水天上来，奔流到海不复回。\",\"君不见，高堂明镜悲白发，朝如青丝暮成雪。\",\"人生得意须尽欢，莫使金樽空对月。\",\"天生我材必有用，千金散尽还复来。\",\"烹羊宰牛且为乐，会须一饮三百杯。\",\"岑夫子，丹丘生，将进酒，杯莫停。\",\"与君歌一曲，请君为我倾耳听。\",\"钟鼓馔玉不足贵，但愿长醉不复醒。\",\"古来圣贤皆寂寞，惟有饮者留其名。\",\"陈王昔时宴平乐，斗酒十千恣欢谑。\",\"主人何为言少钱，径须沽取对君酌。\",\"五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。\"],\"pinyin\":[[\"jūn\",\"bù\",\"jiàn\",\"huáng\",\"hé\",\"zhī\",\"shuǐ\",\"tiān\",\"shàng\",\"lái\",\"bēn\",\"liú\",\"dào\",\"hǎi\",\"bù\",\"fù\",\"huí\"],[\"jūn\",\"bù\",\"jiàn\",\"gāo\",\"táng\",\"míng\",\"jìng\",\"bēi\",\"bái\",\"fà\",\"zhāo\",\"rú\",\"qīng\",\"sī\",\"mù\",\"chéng\",\"xuě\"],[\"rén\",\"shēng\",\"dé\",\"yì\",\"xū\",\"jìn\",\"huān\",\"mò\",\"shǐ\",\"jīn\",\"zūn\",\"kōng\",\"duì\",\"yuè\"],[\"tiān\",\"shēng\",\"wǒ\",\"cái\",\"bì\",\"yǒu\",\"yòng\",\"qiān\",\"jīn\",\"sàn\",\"jìn\",\"huán\",\"fù\",\"lái\"],[\"pēng\",\"yáng\",\"zǎi\",\"niú\",\"qiě\",\"wéi\",\"lè\",\"huì\",\"xū\",\"yī\",\"yǐn\",\"sān\",\"bǎi\",\"bēi\"],[\"cén\",\"fū\",\"zǐ\",\"dān\",\"qiū\",\"shēng\",\"qiāng\",\"jìn\",\"jiǔ\",\"bēi\",\"mò\",\"tíng\"],[\"yǔ\",\"jūn\",\"gē\",\"yī\",\"qǔ\",\"qǐng\",\"jūn\",\"wèi\",\"wǒ\",\"qīng\",\"ěr\",\"tīng\"],[\"zhōng\",\"gǔ\",\"zhuàn\",\"yù\",\"bù\",\"zú\",\"guì\",\"dàn\",\"yuàn\",\"cháng\",\"zuì\",\"bù\",\"fù\",\"xǐng\"],[\"gǔ\",\"lái\",\"shèng\",\"xián\",\"jiē\",\"jì\",\"mò\",\"wéi\",\"yǒu\",\"yǐn\",\"zhě\",\"liú\",\"qí\",\"míng\"],[\"chén\",\"wáng\",\"xī\",\"shí\",\"yàn\",\"píng\",\"lè\",\"dǒu\",\"jiǔ\",\"shí\",\"qiān\",\"zì\",\"huān\",\"xuè\"],[\"zhǔ\",\"rén\",\"hé\",\"wèi\",\"yán\",\"shǎo\",\"qián\",\"jìng\",\"xū\",\"gū\",\"qǔ\",\"duì\",\"jūn\",\"zhuó\"],[\"wǔ\",\"huā\",\"mǎ\",\"qiān\",\"jīn\",\"qiú\",\"hū\",\"ér\",\"qiāng\",\"chū\",\"huàn\",\"měi\",\"jiǔ\",\"yǔ\",\"ěr\",\"tóng\",\"xiāo\",\"wàn\",\"gǔ\",\"chóu\"]],\"meaning\":\"《将进酒》由李白创作。可先通读原文，结合题目、意象与诗中情境理解诗意。\",\"detailedMeaning\":\"阅读时留意诗中的景物、人物、时间与空间变化，再体会李白如何借语言、节奏和意象表达情感。\",\"sourceUrl\":\"https://www.shicile.com/detail/9110299361174\"},{\"order\":2,\"slug\":\"tang-002\",\"title\":\"春望\",\"titlePinyin\":[\"chūn\",\"wàng\"],\"dynasty\":\"唐\",\"author\":\"杜甫\",\"lines\":[\"国破山河在，\",\"城春草木深。\",\"感时花溅泪，\",\"恨别鸟惊心。\",\"烽火连三月，\",\"家书抵万金。\",\"白头搔更短，\",\"浑欲不胜簪。\"],\"pinyin\":[[\"guó\",\"pò\",\"shān\",\"hé\",\"zài\"],[\"chéng\",\"chūn\",\"cǎo\",\"mù\",\"shēn\"],[\"gǎn\",\"shí\",\"huā\",\"jiàn\",\"lèi\"],[\"hèn\",\"bié\",\"niǎo\",\"jīng\",\"xīn\"],[\"fēng\",\"huǒ\",\"lián\",\"sān\",\"yuè\"],[\"jiā\",\"shū\",\"dǐ\",\"wàn\",\"jīn\"],[\"bái\",\"tóu\",\"sāo\",\"gèng\",\"duǎn\"],[\"hún\",\"yù\",\"bù\",\"shèng\",\"zān\"]],\"meaning\":\"《春望》由杜甫创作。可先通读原文，结合题目、意象与诗中情境理解诗意。\",\"detailedMeaning\":\"阅读时留意诗中的景物、人物、时间与空间变化，再体会杜甫如何借语言、节奏和意象表达情感。\",\"sourceUrl\":\"https://www.shicile.com/detail/9270299314494\"},{\"order\":3,\"slug\":\"tang-003\",\"title\":\"长恨歌\",\"titlePinyin\":[\"cháng\",\"hèn\",\"gē\"],\"dynasty\":\"唐\",\"author\":\"白居易\",\"lines\":[\"汉皇重色思倾国，御宇多年求不得。杨家有女初长成，养在深闺人未识。天生丽质难自弃，一朝选在君王侧。回眸一笑百媚生，六宫粉黛无颜色。春寒赐浴华清池，温泉水滑洗凝脂。侍儿扶起娇无力，始是新承恩泽时。云鬓花颜金步摇，芙蓉帐暖度春宵。春宵苦短日高起，从此君王不早朝。\",\"承欢侍宴无闲暇，春从春游夜专夜。后宫佳丽三千人，三千宠爱在一身。金屋妆成娇侍夜，玉楼宴罢醉和春。姊妹弟兄皆列土，可怜光彩生门户。遂令天下父母心，不重生男重生女。骊宫高处入青云，仙乐风飘处处闻。缓歌慢舞凝丝竹，尽日君王看不足。渔阳鼙鼓动地来，惊破霓裳羽衣曲。\",\"九重城阙烟尘生，千乘万骑西南行。翠华摇摇行复止，西出都门百余里。六军不发无奈何，宛转蛾眉马前死。花钿委地无人收，翠翘金雀玉搔头。君王掩面救不得，回看血泪相和流。黄埃散漫风萧索，云栈萦纡登剑阁。峨嵋山下少人行，旌旗无光日色薄。蜀江水碧蜀山青，圣主朝朝暮暮情。\",\"行宫见月伤心色，夜雨闻铃肠断声。天旋地转回龙驭，到此踌躇不能去。马嵬坡下泥土中，不见玉颜空死处。君臣相顾尽沾衣，东望都门信马归。归来池苑皆依旧，太液芙蓉未央柳。芙蓉如面柳如眉，对此如何不泪垂。春风桃李花开日，秋雨梧桐叶落时。西宫南苑多秋草，落叶满阶红不扫。\",\"梨园弟子白发新，椒房阿监青娥老。夕殿萤飞思悄然，孤灯挑尽未成眠。迟迟钟鼓初长夜，耿耿星河欲曙天。鸳鸯瓦冷霜华重，翡翠衾寒谁与共。悠悠生死别经年，魂魄不曾来入梦。临邛道士鸿都客，能以精诚致魂魄。为感君王辗转思，遂教方士殷勤觅。排空驭气奔如电，升天入地求之遍。\",\"上穷碧落下黄泉，两处茫茫皆不见。忽闻海上有仙山，山在虚无缥渺间。楼阁玲珑五云起，其中绰约多仙子。中有一人字太真，雪肤花貌参差是。金阙西厢叩玉扃，转教小玉报双成。闻道汉家天子使，九华帐里梦魂惊。揽衣推枕起徘徊，珠箔银屏迤逦开。云鬓半偏新睡觉，花冠不整下堂来。\",\"风吹仙袂飘飖举，犹似霓裳羽衣舞。玉容寂寞泪阑干，梨花一枝春带雨。含情凝睇谢君王，一别音容两渺茫。昭阳殿里恩爱绝，蓬莱宫中日月长。回头下望人寰处，不见长安见尘雾。惟将旧物表深情，钿合金钗寄将去。钗留一股合一扇，钗擘黄金合分钿。但教心似金钿坚，天上人间会相见。\",\"临别殷勤重寄词，词中有誓两心知。七月七日长生殿，夜半无人私语时。在天愿作比翼鸟，在地愿为连理枝。天长地久有时尽，此恨绵绵无绝期。\"],\"pinyin\":[[\"hàn\",\"huáng\",\"zhòng\",\"sè\",\"sī\",\"qīng\",\"guó\",\"yù\",\"yǔ\",\"duō\",\"nián\",\"qiú\",\"bù\",\"dé\",\"yáng\",\"jiā\",\"yǒu\",\"nǚ\",\"chū\",\"zhǎng\",\"chéng\",\"yǎng\",\"zài\",\"shēn\",\"guī\",\"rén\",\"wèi\",\"shí\",\"tiān\",\"shēng\",\"lì\",\"zhì\",\"nán\",\"zì\",\"qì\",\"yī\",\"zhāo\",\"xuǎn\",\"zài\",\"jūn\",\"wáng\",\"cè\",\"huí\",\"móu\",\"yī\",\"xiào\",\"bǎi\",\"mèi\",\"shēng\",\"liù\",\"gōng\",\"fěn\",\"dài\",\"wú\",\"yán\",\"sè\",\"chūn\",\"hán\",\"cì\",\"yù\",\"huá\",\"qīng\",\"chí\",\"wēn\",\"quán\",\"shuǐ\",\"huá\",\"xǐ\",\"níng\",\"zhī\",\"shì\",\"ér\",\"fú\",\"qǐ\",\"jiāo\",\"wú\",\"lì\",\"shǐ\",\"shì\",\"xīn\",\"chéng\",\"ēn\",\"zé\",\"shí\",\"yún\",\"bìn\",\"huā\",\"yán\",\"jīn\",\"bù\",\"yáo\",\"fú\",\"róng\",\"zhàng\",\"nuǎn\",\"dù\",\"chūn\",\"xiāo\",\"chūn\",\"xiāo\",\"kǔ\",\"duǎn\",\"rì\",\"gāo\",\"qǐ\",\"cóng\",\"cǐ\",\"jūn\",\"wáng\",\"bù\",\"zǎo\",\"cháo\"],[\"chéng\",\"huān\",\"shì\",\"yàn\",\"wú\",\"xián\",\"xiá\",\"chūn\",\"cóng\",\"chūn\",\"yóu\",\"yè\",\"zhuān\",\"yè\",\"hòu\",\"gōng\",\"jiā\",\"lì\",\"sān\",\"qiān\",\"rén\",\"sān\",\"qiān\",\"chǒng\",\"ài\",\"zài\",\"yī\",\"shēn\",\"jīn\",\"wū\",\"zhuāng\",\"chéng\",\"jiāo\",\"shì\",\"yè\",\"yù\",\"lóu\",\"yàn\",\"bà\",\"zuì\",\"hé\",\"chūn\",\"zǐ\",\"mèi\",\"dì\",\"xiōng\",\"jiē\",\"liè\",\"tǔ\",\"kě\",\"lián\",\"guā \",\"detailedMeaning\":\"阅读时留意诗中的景物、人物、时间与空间变化，再体会李商隐如何借语言、节奏和意象表达情感。\",\"sourceUrl\":\"https://www.shicile.com/detail/8650299180678\"},{\"order\":35,\"slug\":\"tang-035\",\"title\":\"月下独酌·其一\",\"titlePinyin\":[\"yuè\",\"xià\",\"dú\",\"zhuó\",\"qí\",\"yī\"],\"dynasty\":\"唐\",\"author\":\"李白\",\"lines\":[\"花间一壶酒，\",\"独酌无相亲。\",\"举杯邀明月，\",\"对影成三人。\",\"月既不解饮，\",\"影徒随我身。\",\"暂伴月将影，\",\"行乐须及春。\",\"我歌月徘徊，\",\"我舞影零乱。\",\"醒时同交欢，\",\"醉后各分散。\",\"永结无情游，\",\"相期邈云汉。\"],\"pinyin\":[[\"huā\",\"jiān\",\"yī\",\"hú\",\"jiǔ\"],[\"dú\",\"zhuó\",\"wú\",\"xiāng\",\"qīn\"],[\"jǔ\",\"bēi\",\"yāo\",\"míng\",\"yuè\"],[\"duì\",\"yǐng\",\"chéng\",\"sān\",\"rén\"],[\"yuè\",\"jì\",\"bù\",\"jiě\",\"yǐn\"],[\"yǐng\",\"tú\",\"suí\",\"wǒ\",\"shēn\"],[\"zàn\",\"bàn\",\"yuè\",\"jiāng\",\"yǐng\"],[\"xíng\",\"lè\",\"xū\",\"jí\",\"chūn\"],[\"wǒ\",\"gē\",\"yuè\",\"pái\",\"huái\"],[\"wǒ\",\"wǔ\",\"yǐng\",\"líng\",\"luàn\"],[\"xǐng\",\"shí\",\"tóng\",\"jiāo\",\"huān\"],[\"zuì\",\"hòu\",\"gè\",\"fēn\",\"sàn\"],[\"yǒng\",\"jié\",\"wú\",\"qíng\",\"yóu\"],[\"xiāng\",\"qī\",\"miǎo\",\"yún\",\"hàn\"]],\"meaning\":\"《月下独酌·其一》由李白创作。可先通读原文，结合题目、意象与诗中情境理解诗意。\",\"detailedMeaning\":\"阅读时留意诗中的景物、人物、时间与空间变化，再体会李白如何借语言、节奏和意象表达情感。\",\"sourceUrl\":\"https://www.shicile.com/detail/8230295298069\"},{\"order\":36,\"slug\":\"tang-036\",\"title\":\"琵琶行\",\"titlePinyin\":[\"pí\",\"pá\",\"xíng\"],\"dynasty\":\"唐\",\"author\":\"白居易\",\"lines\":[\"浔阳江头夜送客，枫叶荻花秋瑟瑟。主人下马客在船，举酒欲饮无管弦。醉不成欢惨将别，别时茫茫江浸月。\",\"忽闻水上琵琶声，主人忘归客不发。寻声暗问弹者谁？琵琶声停欲语迟。移船相近邀相见，添酒回灯重开宴。千呼万唤始出来，犹抱琵琶半遮面。转轴拨弦三两声，未成曲调先有情。弦弦掩抑声声思，似诉平生不得志。低眉信手续续弹，说尽心中无限事。轻拢慢捻抹复挑，初为《霓裳》后《六幺》。大弦嘈嘈如急雨，小弦切切如私语。嘈嘈切切错杂弹，大珠小珠落玉盘。间关莺语花底滑，幽咽泉流冰下难。冰泉冷涩弦凝绝，凝绝不通声暂歇。别有幽愁暗恨生，此时无声胜有声。银瓶乍破水浆迸，铁骑突出刀枪鸣。曲终收拨当心画，四弦一声如裂帛。东船西舫悄无言，唯见江心秋月白。\",\"沉吟放拨插弦中，整顿衣裳起敛容。自言本是京城女，家在虾蟆陵下住。十三学得琵琶成，名属教坊第一部。曲罢曾教善才服，妆成每被秋娘妒。五陵年少争缠头，一曲红绡不知数。钿头银篦击节碎，血色罗裙翻酒污。今年欢笑复明年，秋月春风等闲度。弟走从军阿姨死，暮去朝来颜色故。门前冷落鞍马稀，老大嫁作商人妇。商人重利轻别离，前月浮梁买茶去。去来江口守空船，绕船月明江水寒。夜深忽梦少年事，梦啼妆泪红阑干。\",\"我闻琵琶已叹息，又闻此语重唧唧。同是天涯沦落人，相逢何必曾相识！我从去年辞帝京，谪居卧病浔阳城。浔阳地僻无音乐，终岁不闻丝竹声。住近湓江地低湿，黄芦苦竹绕宅生。其间旦暮闻何物？杜鹃啼血猿哀鸣。春江花朝秋月夜，往往取酒还独倾。岂无山歌与村笛？呕哑嘲哳难为听。今夜闻君琵琶语，如听仙乐耳暂明。莫辞更坐弹一曲，为君翻作《琵琶行》。\",\"感我此言良久立，却坐促弦弦转急。凄凄不似向前声，满座重闻皆掩泣。座中泣下谁最多？江州司马青衫湿。\"],\"pinyin\":[[\"xún\",\"yáng\",\"jiāng\",\"tóu\",\"yè\",\"sòng\",\"kè\",\"fēng\",\"yè\",\"dí\",\"huā\",\"qiū\",\"sè\",\"sè\",\"zhǔ\",\"rén\",\"xià\",\"mǎ\",\"kè\",\"zài\",\"chuán\",\"jǔ\",\"jiǔ\",\"yù\",\"yǐn\",\"wú\",\"guǎn\",\"xián\",\"zuì\",\"bù\",\"chéng\",\"huān\",\"cǎn\",\"jiāng\",\"bié\",\"bié\",\"shí\",\"máng\",\"máng\",\"jiāng\",\"jìn\",\"yuè\"],[\"hū\",\"wén\",\"shuǐ\",\"shàng\",\"pí\",\"pá\",\"shēng\",\"zhǔ\",\"rén\",\"wàng\",\"guī\",\"kè\",\"bù\",\"fā\",\"xún\",\"shēng\",\"àn\",\"wèn\",\"tán\",\"zhě\",\"shuí\",\"pí\",\"pá\",\"shēng\",\"tíng\",\"yù\",\"yǔ\",\"chí\",\"yí\",\"chuán\",\"xiāng\",\"jìn\",\"yāo\",\"xiāng\",\"jiàn\",\"tiān\",\"jiǔ\",\"huí\",\"dēng\",\"chóng\",\"kāi\",\"yàn\",\"qiān\",\"hū\",\"wàn\",\"huàn\",\"shǐ\",\"chū\",\"lái\",\"yóu\",\"bào\",\"pí\",\"pá\",\"bàn\",\"zhē\",\"miàn\",\"zhuǎn\",\"zhóu\",\"bō\",\"xián\",\"sān\",\"liǎng\",\"shēng\",\"wèi\",\"chéng\",\"qǔ\",\"diào\",\"xiān\",\"yǒu\",\"qíng\",\"xián\",\"xián\",\"yǎn\",\"yì\",\"shēng\",\"shēng\",\"sī\",\"sì\",\"sù\",\"píng\",\"shēng\",\"bù\",\"dé\",\"zhì\",\"dī\",\"méi\",\"xìn\",\"shǒu\",\"xù\",\"xù\",\"tán\",\"shuō\",\"jìn\",\"xīn\",\"zhōng\",\"wú\",\"xiàn\",\"shì\",\"qīng\",\"lǒng\",\"màn\",\"niǎn\",\"mò\",\"fù\",\"tiǎo\",\"chū\",\"wéi\",\"ní\",\"cháng\",\"hòu\",\"liù\",\"yāo\",\"dà\",\"xián\",\"cáo\",\"cáo\",\"rú\",\"jí\",\"yǔ\",\"xiǎo\",\"xián\",\"qiè\",\"qiè\",\"rú\",\"sī\",\"yǔ\",\"cáo\",\"cáo\",\"qiē\",\"qiē\",\"cuò\",\"zá\",\"tán\",\"dà\",\"zhū\",\"xiǎo\",\"zhū\",\"luò\",\"yù\",\"pán\",\"jiàn\",\"guān\",\"yīng\",\"yǔ\",\"huā\",\"dǐ\",\"huá\",\"yōu\",\"yè\",\"quán\",\"liú\",\"bīng\",\"xià\",\"nán\",\"bīng\",\"quán\",\"lěng\",\"sè\",\"xián\",\"níng\",\"jué\",\"níng\",\"jué\",\"bù\",\"tōng\",\"shēng\",\"zàn\",\"xiē\",\"bié\",\"yǒu\",\"yōu\",\"chóu\",\"àn\",\"hèn\",\"shēng\",\"cǐ\",\"shí\",\"wú\",\"shēng\",\"shèng\",\"yǒu\",\"shēng\",\"yín\",\"pí 娟隔秋水，濯足洞庭望八荒。\",\"鸿飞冥冥日月白，青枫叶赤天雨霜。\",\"玉京群帝集北斗，或骑麒麟翳凤凰。\",\"芙蓉旌旗烟雾落，影动倒景摇潇湘。\",\"星宫之君醉琼浆，羽人稀少不在旁。\",\"似闻昨者赤松子，恐是汉代韩张良。\",\"昔随刘氏定长安，帷幄未改神惨伤。\",\"国家成败吾岂敢，色难腥腐餐枫香。\",\"周南留滞古所惜，南极老人应寿昌。\",\"美人胡为隔秋水，焉得置之贡玉堂。\"],\"pinyin\":[[\"jīn\",\"wǒ\",\"bù\",\"lè\",\"sī\",\"yuè\",\"yáng\",\"shēn\",\"yù\",\"fèn\",\"fēi\",\"bìng\",\"zài\",\"chuáng\"],[\"měi\",\"rén\",\"juān\",\"juān\",\"gé\",\"qiū\",\"shuǐ\",\"zhuó\",\"zú\",\"dòng\",\"tíng\",\"wàng\",\"bā\",\"huāng\"],[\"hóng\",\"fēi\",\"míng\",\"míng\",\"rì\",\"yuè\",\"bái\",\"qīng\",\"fēng\",\"yè\",\"chì\",\"tiān\",\"yǔ\",\"shuāng\"],[\"yù\",\"jīng\",\"qún\",\"dì\",\"jí\",\"běi\",\"dǒu\",\"huò\",\"qí\",\"qí\",\"lín\",\"yì\",\"fèng\",\"huáng\"],[\"fú\",\"róng\",\"jīng\",\"qí\",\"yān\",\"wù\",\"luò\",\"yǐng\",\"dòng\",\"dǎo\",\"jǐng\",\"yáo\",\"xiāo\",\"xiāng\"],[\"xīng\",\"gōng\",\"zhī\",\"jūn\",\"zuì\",\"qióng\",\"jiāng\",\"yǔ\",\"rén\",\"xī\",\"shǎo\",\"bù\",\"zài\",\"páng\"],[\"sì\",\"wén\",\"zuó\",\"zhě\",\"chì\",\"sōng\",\"zǐ\",\"kǒng\",\"shì\",\"hàn\",\"dài\",\"hán\",\"zhāng\",\"liáng\"],[\"xī\",\"suí\",\"liú\",\"shì\",\"dìng\",\"cháng\",\"ān\",\"wéi\",\"wò\",\"wèi\",\"gǎi\",\"shén\",\"cǎn\",\"shāng\"],[\"guó\",\"jiā\",\"chéng\",\"bài\",\"wú\",\"qǐ\",\"gǎn\",\"sè\",\"nán\",\"xīng\",\"fǔ\",\"cān\",\"fēng\",\"xiāng\"],[\"zhōu\",\"nán\",\"liú\",\"zhì\",\"gǔ\",\"suǒ\",\"xī\",\"nán\",\"jí\",\"lǎo\",\"rén\",\"yīng\",\"shòu\",\"chāng\"],[\"měi\",\"rén\",\"hú\",\"wéi\",\"gé\",\"qiū\",\"shuǐ\",\"yān\",\"dé\",\"zhì\",\"zhī\",\"gòng\",\"yù\",\"táng\"]],\"meaning\":\"《寄韩谏议注》由杜甫创作。可先通读原文，结合题目、意象与诗中情境理解诗意。\",\"detailedMeaning\":\"阅读时留意诗中的景物、人物、时间与空间变化，再体会杜甫如何借语言、节奏和意象表达情感。\",\"sourceUrl\":\"https://www.shicile.com/detail/5060274548420\"},{\"order\":309,\"slug\":\"tang-309\",\"title\":\"韩碑\",\"titlePinyin\":[\"hán\",\"bēi\"],\"dynasty\":\"唐\",\"author\":\"李商隐\",\"lines\":[\"元和天子神武姿，彼何人哉轩与羲。\",\"誓将上雪列圣耻，坐法宫中朝四夷。\",\"淮西有贼五十载，封狼生貙貙生罴。\",\"不据山河据平地，长戈利矛日可麾。\",\"帝得圣相相曰度，贼斫不死神扶持。\",\"腰悬相印作都统，阴风惨澹天王旗。\",\"愬武古通作牙爪，仪曹外郎载笔随。\",\"行军司马智且勇，十四万众犹虎貔。\",\"入蔡缚贼献太庙，功无与让恩不訾。\",\"帝曰汝度功第一，汝从事愈宜为辞。\",\"愈拜稽首蹈且舞，金石刻画臣能为。\",\"古者世称大手笔，此事不系于职司。\",\"当仁自古有不让，言讫屡颔天子颐。\",\"公退斋戒坐小阁，濡染大笔何淋漓。\",\"点窜《尧典》《舜典》字，涂改《清庙》《生民》诗。\",\"文成破体书在纸，清晨再拜铺丹墀。\",\"表曰臣愈昧死上，咏神圣功书之碑。\",\"碑高三丈字如斗，负以灵鳌蟠以螭。\",\"句奇语重喻者少，谗之天子言其私。\",\"长绳百尺拽碑倒，粗砂大石相磨治。\",\"公之斯文若元气，先时已入人肝脾。\",\"汤盘孔鼎有述作，今无其器存其辞。\",\"呜呼圣王及圣相，相与烜赫流淳熙。\",\"公之斯文不示后，曷与三五相攀追。\",\"愿书万本诵万遍，口角流沫右手胝。\",\"传之七十有二代，以为封禅玉检明堂基。\"],\"pinyin\":[[\"yuán\",\"hé\",\"tiān\",\"zǐ\",\"shén\",\"wǔ\",\"zī\",\"bǐ\",\"hé\",\"rén\",\"zāi\",\"xuān\",\"yǔ\",\"xī\"],[\"shì\",\"jiāng\",\"shàng\",\"xuě\",\"liè\",\"shèng\",\"chǐ\",\"zuò\",\"fǎ\",\"gōng\",\"zhōng\",\"cháo\",\"sì\",\"yí\"],[\"huái\",\"xī\",\"yǒu\",\"zéi\",\"wǔ\",\"shí\",\"zǎi\",\"fēng\",\"láng\",\"shēng\",\"chū\",\"chū\",\"shēng\",\"pí\"],[\"bù\",\"jù\",\"shān\",\"hé\",\"jù\",\"píng\",\"dì\",\"cháng\",\"gē\",\"lì\",\"máo\",\"rì\",\"kě\",\"huī\"],[\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\"],[\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\"],[\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\"],[\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\"],[\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\"],[\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\"],[\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\"],[\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\"],[\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\"],[\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\"],[\"diǎn\",\"cuàn\",\"yáo\",\"diǎn\",\"shùn\",\"diǎn\",\"zì\",\"tú\",\"gǎi\",\"qīng\",\"miào\",\"shēng\",\"mín\",\"shī\"],[\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\"],[\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\"],[\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\"],[\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\"],[\"\",\"\",\"\",\" ",\"shū\"],[\"chái\",\"láng\",\"zài\",\"yì\",\"lóng\",\"zài\",\"yě\"],[\"wáng\",\"sūn\",\"shàn\",\"bǎo\",\"qiān\",\"jīn\",\"qū\"],[\"bù\",\"gǎn\",\"cháng\",\"yǔ\",\"lín\",\"jiāo\",\"qú\"],[\"qiě\",\"wéi\",\"wáng\",\"sūn\",\"lì\",\"sī\",\"xū\"],[\"zuó\",\"yè\",\"dōng\",\"fēng\",\"chuī\",\"xuè\",\"xīng\"],[\"dōng\",\"lái\",\"tuó\",\"tuó\",\"mǎn\",\"jiù\",\"dū\"],[\"shuò\",\"fāng\",\"jiàn\",\"ér\",\"hǎo\",\"shēn\",\"shǒu\"],[\"xī\",\"hé\",\"yǒng\",\"ruì\",\"jīn\",\"hé\",\"yú\"],[\"qiè\",\"wén\",\"tiān\",\"zǐ\",\"yǐ\",\"chuán\",\"wèi\"],[\"shèng\",\"dé\",\"běi\",\"fú\",\"nán\",\"chán\",\"yú\"],[\"huā\",\"mén\",\"lí\",\"miàn\",\"qǐng\",\"xuě\",\"chǐ\"],[\"shèn\",\"wù\",\"chū\",\"kǒu\",\"tā\",\"rén\",\"jū\"],[\"āi\",\"zāi\",\"wáng\",\"sūn\",\"shèn\",\"wù\",\"shū\"],[\"wǔ\",\"líng\",\"jiā\",\"qì\",\"wú\",\"shí\",\"wú\"]],\"meaning\":\"《哀王孙》由杜甫创作。可先通读原文，结合题目、意象与诗中情境理解诗意。\",\"detailedMeaning\":\"阅读时留意诗中的景物、人物、时间与空间变化，再体会杜甫如何借语言、节奏和意象表达情感。\",\"sourceUrl\":\"https://www.shicile.com/detail/230234075693\"},{\"order\":311,\"slug\":\"tang-311\",\"title\":\"贼退示官吏\",\"titlePinyin\":[\"zéi\",\"tuì\",\"shì\",\"guān\",\"lì\"],\"dynasty\":\"唐\",\"author\":\"元结\",\"lines\":[\"癸卯岁，西原贼入道州，焚烧杀掠，几尽而去。明年，贼又攻永破邵，不犯此州边鄙而退。岂力能制敌与？盖蒙其伤怜而已。诸使何为忍苦征敛，故作诗一篇以示官吏。\",\"昔岁逢太平，山林二十年。泉源在庭户，洞壑当门前。井税有常期，日晏犹得眠。忽然遭世变，数岁亲戎旃。今来典斯郡，山夷又纷然。城小贼不屠，人贫伤可怜。是以陷邻境，此州独见全。使臣将王命，岂不如贼焉？今彼征敛者，迫之如火煎。谁能绝人命，以作时世贤！思欲委符节，引竿自刺船。将家就鱼麦，归老江湖边。\"],\"pinyin\":[[\"guǐ\",\"mǎo\",\"suì\",\"xī\",\"yuán\",\"zéi\",\"rù\",\"dào\",\"zhōu\",\"fén\",\"shāo\",\"shā\",\"lüè\",\"jǐ\",\"jìn\",\"ér\",\"qù\",\"míng\",\"nián\",\"zéi\",\"yòu\",\"gōng\",\"yǒng\",\"pò\",\"shào\",\"bù\",\"fàn\",\"cǐ\",\"zhōu\",\"biān\",\"bǐ\",\"ér\",\"tuì\",\"qǐ\",\"lì\",\"néng\",\"zhì\",\"dí\",\"yú\",\"gài\",\"méng\",\"qí\",\"shāng\",\"lián\",\"ér\",\"yǐ\",\"zhū\",\"shǐ\",\"hé\",\"wéi\",\"rěn\",\"kǔ\",\"zhēng\",\"liǎn\",\"gù\",\"zuò\",\"shī\",\"yī\",\"piān\",\"yǐ\",\"shì\",\"guān\",\"lì\"],[\"xī\",\"suì\",\"féng\",\"tài\",\"píng\",\"shān\",\"lín\",\"èr\",\"shí\",\"nián\",\" "rán\",\"gòng\",\"zuì\",\"jú\",\"huā\",\"bēi\"]],\"meaning\":\"《九日登望仙台呈刘明府容》由崔曙创作。可先通读原文，结合题目、意象与诗中情境理解诗意。\",\"detailedMeaning\":\"阅读时留意诗中的景物、人物、时间与空间变化，再体会崔曙如何借语言、节奏和意象表达情感。\",\"sourceUrl\":\"https://www.shicile.com/detail/8800292314828\"},{\"order\":315,\"slug\":\"tang-315\",\"title\":\"听安万善吹觱篥歌\",\"titlePinyin\":[\"tīng\",\"ān\",\"wàn\",\"shàn\",\"chuī\",\"bì\",\"lì\",\"gē\"],\"dynasty\":\"唐\",\"author\":\"李颀\",\"lines\":[\"南山截竹为觱篥，此乐本自龟兹出。\",\"流传汉地曲转奇，凉州胡人为我吹。\",\"傍邻闻者多叹息，远客思乡皆泪垂。\",\"世人解听不解赏，长飙风中自来往。\",\"枯桑老柏寒飕飗，九雏鸣凤乱啾啾。\",\"龙吟虎啸一时发，万籁百泉相与秋。\",\"忽然更作渔阳掺，黄云萧条白日暗。\",\"变调如闻杨柳春，上林繁花照眼新。\",\"岁夜高堂列明烛，美酒一杯声一曲。\"],\"pinyin\":[[\"nán\",\"shān\",\"jié\",\"zhú\",\"wéi\",\"bì\",\"lì\",\"cǐ\",\"yuè\",\"běn\",\"zì\",\"qiū\",\"cí\",\"chū\"],[\"liú\",\"chuán\",\"hàn\",\"dì\",\"qǔ\",\"zhuǎn\",\"qí\",\"liáng\",\"zhōu\",\"hú\",\"rén\",\"wèi\",\"wǒ\",\"chuī\"],[\"páng\",\"lín\",\"wén\",\"zhě\",\"duō\",\"tàn\",\"xī\",\"yuǎn\",\"kè\",\"sī\",\"xiāng\",\"jiē\",\"lèi\",\"chuí\"],[\"shì\",\"rén\",\"jiě\",\"tīng\",\"bù\",\"jiě\",\"shǎng\",\"cháng\",\"biāo\",\"fēng\",\"zhōng\",\"zì\",\"lái\",\"wǎng\"],[\"kū\",\"sāng\",\"lǎo\",\"bǎi\",\"hán\",\"sōu\",\"liú\",\"jiǔ\",\"chú\",\"míng\",\"fèng\",\"luàn\",\"jiū\",\"jiū\"],[\"lóng\",\"yín\",\"hǔ\",\"xiào\",\"yī\",\"shí\",\"fā\",\"wàn\",\"lài\",\"bǎi\",\"quán\",\"xiāng\",\"yǔ\",\"qiū\"],[\"hū\",\"rán\",\"gèng\",\"zuò\",\"yú\",\"yáng\",\"chān\",\"huáng\",\"yún\",\"xiāo\",\"tiáo\",\"bái\",\"rì\",\"àn\"],[\"biàn\",\"diào\",\"rú\",\"wén\",\"yáng\",\"liǔ\",\"chūn\",\"shàng\",\"lín\",\"fán\",\"huā\",\"zhào\",\"yǎn\",\"xīn\"],[\"suì\",\"yè\",\"gāo\",\"táng\",\"liè\",\"míng\",\"zhú\",\"měi\",\"jiǔ\",\"yī\",\"bēi\",\"shēng\",\"yī\",\"qǔ\"]],\"meaning\":\"《听安万善吹觱篥歌》由李颀创作。可先通读原文，结合题目、意象与诗中情境理解诗意。\",\"detailedMeaning\":\"阅读时留意诗中的景物、人物、时间与空间变化，再体会李颀如何借语言、节奏和意象表达情感。\",\"sourceUrl\":\"https://www.shicile.com/detail/920123209526\"},{\"order\":316,\"slug\":\"tang-316\",\"title\":\"谷口书斋寄杨补阙\",\"titlePinyin\":[\"gǔ\",\"kǒu\",\"shū\",\"zhāi\",\"jì\",\"yáng\",\"bǔ\",
