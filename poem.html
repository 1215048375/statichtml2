\",\"hán\",\"rì\",\"shēng\",\"yú\",\"dōng\"]],\"meaning\":\"《谒衡岳庙遂宿岳寺题门楼》由韩愈创作。可先通读原文，结合题目、意象与诗中情境理解诗意。\",\"detailedMeaning\":\"阅读时留意诗中的景物、人物、时间与空间变化，再体会韩愈如何借语言、节奏和意象表达情感。\",\"sourceUrl\":\"https://www.shicile.com/detail/580156250408\"}]\u003c/script>\n\u003cscript>\nconst poems=JSON.parse(document.getElementById('poemData').textContent),periods=['全部','唐'],punctuation=new Set('，。？！、；：（）'.split('')),storageKey='shijianji-tang300-unfamiliarity-v1',learnedKey='shijianji-tang300-learned-v1',fontKey='shijianji-tang300-font-level-v1',fontLevels=[['clamp(18px,3vw,22px)','8px','最小'],['clamp(21px,3.5vw,26px)','9px','较小'],['clamp(23px,4vw,29px)','10px','标准'],['clamp(26px,4.5vw,33px)','11px','较大'],['clamp(29px,5vw,37px)','12px','大'],['clamp(32px,5.5vw,41px)','13px','最大']];let period='全部',query='',sortMode='default',unfamiliarity={},learnedState={},fontLevel=2,currentVisiblePoems=[],persistRequested=false,randomPreviewSlug='',randomPreviewStage=0;\nconst $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction readFontLevel(){try{const value=Number(localStorage.getItem(fontKey));return Number.isInteger(value)&&value>=0&&value\u003cfontLevels.length?value:2}catch{return 2}}\nfunction applyFontLevel(level,save=false){fontLevel=Math.max(0,Math.min(fontLevels.length-1,level));const [size,pinyin,label]=fontLevels[fontLevel];document.documentElement.style.setProperty('--poem-font',size);document.documentElement.style.setProperty('--poem-pinyin',pinyin);$('fontLabel').textContent=label;$('fontDecrease').disabled=fontLevel===0;$('fontIncrease').disabled=fontLevel===fontLevels.length-1;if(save)try{localStorage.setItem(fontKey,String(fontLevel))}catch{}}\nfunction adjustFont(delta){applyFontLevel(fontLevel+delta,true)}\nfunction cleanCounts(value){const result={};if(value&&typeof value==='object')for(const poem of poems){const count=Number(value[poem.slug]);if(Number.isSafeInteger(count)&&count>0)result[poem.slug]=count}return result}\nfunction readLocal(){try{return cleanCounts(JSON.parse(localStorage.getItem(storageKey)||'{}'))}catch{return {}}}\nfunction writeLocal(){try{localStorage.setItem(storageKey,JSON.stringify(unfamiliarity))}catch{}}\nfunction cleanLearned(value){const result={};if(value&&typeof value==='object')for(const poem of poems){const record=value[poem.slug];if(record&&typeof record.value==='boolean'&&Number.isFinite(Number(record.updatedAt)))result[poem.slug]={value:record.value,updatedAt:Number(record.updatedAt)}}return result}\nfunction mergeLearned(first,second){const result={...cleanLearned(first)};for(const [slug,record] of Object.entries(cleanLearned(second)))if(!result[slug]||record.updatedAt>=result[slug].updatedAt)result[slug]=record;return result}\nfunction isLearned(slug){return learnedState[slug]?.value===true}\nfunction readLearnedLocal(){try{return cleanLearned(JSON.parse(localStorage.getItem(learnedKey)||'{}'))}catch{return {}}}\nfunction writeLearnedLocal(){try{localStorage.setItem(learnedKey,JSON.stringify(learnedState))}catch{}}\nfunction openProgressDb(){return new Promise((resolve,reject)=>{try{const request=indexedDB.open('shijianji-local-progress',1);request.onupgradeneeded=()=>request.result.createObjectStore('progress');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)}catch(error){reject(error)}})}\nasync function readIndexed(){try{const db=await openProgressDb();return await new Promise((resolve,reject)=>{const request=db.transaction('progress').objectStore('progress').get(storageKey);request.onsuccess=()=>resolve(cleanCounts(request.result));request.onerror=()=>reject(request.error)})}catch{return {}}}\nasync function writeIndexed(){try{const db=await openProgressDb();await new Promise((resolve,reject)=>{const transaction=db.transaction('progress','readwrite');transaction.objectStore('progress').put(unfamiliarity,storageKey);transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error)})}catch{}}\nasync function readLearnedIndexed(){try{const db=await openProgressDb();return await new Promise((resolve,reject)=>{const request=db.transaction('progress').objectStore('progress').get(learnedKey);request.onsuccess=()=>resolve(cleanLearned(request.result));request.onerror=()=>reject(request.error)})}catch{return {}}}\nasync function writeLearnedIndexed(){try{const db=await openProgressDb();await new Promise((resolve,reject)=>{const transaction=db.transaction('progress','readwrite');transaction.objectStore('progress').put(learnedState,learnedKey);transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error)})}catch{}}\nasync function initProgress(){const local=readLocal(),indexed=await readIndexed(),learnedLocal=readLearnedLocal(),learnedIndexed=await readLearnedIndexed();for(const poem of poems)unfamiliarity[poem.slug]=Math.max(local[poem.slug]||0,indexed[poem.slug]||0);unfamiliarity=cleanCounts(unfamiliarity);learnedState=mergeLearned(learnedLocal,learnedIndexed);writeLocal();writeIndexed();writeLearnedLocal();writeLearnedIndexed();renderList();renderRoute()}\nfunction saveProgress(){writeLocal();writeIndexed()}\nfunction saveLearned(){writeLearnedLocal();writeLearnedIndexed()}\nfunction requestPersistentStorage(){if(persistRequested)return;persistRequested=true;try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch{}}\nfunction addUnfamiliarity(slug){unfamiliarity[slug]=(unfamiliarity[slug]||0)+1;saveProgress();requestPersistentStorage();const count=$('unfamiliarCount');if(count){count.textContent=unfamiliarity[slug];count.classList.remove('saveFlash');void count.offsetWidth;count.classList.add('saveFlash')}}\nfunction toggleLearned(slug){learnedState[slug]={value:!isLearned(slug),updatedAt:Date.now()};saveLearned();requestPersistentStorage();renderList();renderRoute()}\nfunction group(d){return ['汉','北朝民歌'].includes(d)?'汉魏南北朝':d==='唐'?'唐':d==='宋'?'宋':'元明清'}\nfunction normalizeSearch(value){return String(value??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/s+/g,'')}\nfunction searchableText(poem){return normalizeSearch([poem.title,poem.author,poem.dynasty,poem.titlePinyin.join(''),poem.lines.join(''),poem.pinyin.flat().join(''),poem.meaning,poem.detailedMeaning].join(''))}\nfunction matchesSearch(poem,value){const terms=String(value).trim().split(/s+/).filter(Boolean).map(normalizeSearch);if(!terms.length)return true;const text=searchableText(poem);return terms.every(term=>text.includes(term))}\nfunction renderFilters(){$('filters').innerHTML=periods.map(x=>'\u003cbutton type=\"button\" class=\"'+(x===period?'active':'')+'\" data-period=\"'+x+'\">'+x+'\u003c/button>').join('')}\nfunction renderList(){const visible=poems.filter(p=>(period==='全部'||group(p.dynasty)===period)&&matchesSearch(p,query));visible.sort((a,b)=>sortMode==='unfamiliar-asc'?((unfamiliarity[a.slug]||0)-(unfamiliarity[b.slug]||0)||a.order-b.order):sortMode==='unfamiliar-desc'?((unfamiliarity[b.slug]||0)-(unfamiliarity[a.slug]||0)||a.order-b.order):a.order-b.order);currentVisiblePoems=visible;$('count').textContent=visible.length;$('empty').hidden=visible.length>0;$('randomPoem').disabled=visible.length===0;$('randomPoem').setAttribute('aria-label',visible.length?'从当前 '+visible.length+' 篇诗词中随机选择一篇':'当前没有可随机选择的诗词');$('grid').innerHTML=visible.map(p=>'\u003ca class=\"card '+(isLearned(p.slug)?'learnedCard':'')+'\" href=\"#'+p.slug+'\" aria-label=\"查看《'+esc(p.title)+'》详情\">\u003cspan class=\"order\">'+String(p.order).padStart(2,'0')+'\u003c/span>\u003cdiv class=\"copy\">\u003ch2>'+esc(p.title)+'\u003c/h2>\u003cp class=\"author\">〔'+esc(p.dynasty)+'〕'+esc(p.author)+'\u003c/p>\u003cp class=\"excerpt\">'+esc(p.lines[0])+'\u003c/p>\u003cspan class=\"cardBadges\">'+(isLearned(p.slug)?'\u003cspan class=\"learnedBadge\">✓ 已背\u003c/span>':'')+(unfamiliarity[p.slug]?'\u003cspan class=\"unfamiliarBadge\">不熟悉度 '+unfamiliarity[p.slug]+'\u003c/span>':'')+'\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">›\u003c/span>\u003c/a>').join('')}\nfunction openRandomPoem(){if(!currentVisiblePoems.length)return;const poem=currentVisiblePoems[Math.floor(Math.random()*currentVisiblePoems.length)];randomPreviewSlug=poem.slug;randomPreviewStage=1;if(location.hash==='#'+poem.slug)renderRoute();else location.hash=poem.slug}\nfunction lineHtml(line,pinyin){let i=0;return '\u003cdiv class=\"line\">'+[...line].map((char,n)=>punctuation.has(char)?'\u003cspan class=\"punct\">'+char+'\u003c/span>':'\u003cruby>\u003cspan>'+esc(char)+'\u003c/span>\u003crt>'+esc(pinyin[i++])+'\u003c/rt>\u003c/ruby>').join('')+'\u003c/div>'}\nfunction titleHtml(poem){let i=0;return [...poem.title].map(char=>/[㐀-鿿]/u.test(char)?'\u003cruby>\u003cspan>'+esc(char)+'\u003c/span>\u003crt>'+esc(poem.titlePinyin[i++])+'\u003c/rt>\u003c/ruby>':'\u003cspan class=\"titleSymbol\">'+esc(char)+'\u003c/span>').join('')}\nfunction renderRoute(){const slug=location.hash.slice(1),poem=poems.find(p=>p.slug===slug);if(!poem){randomPreviewSlug='';randomPreviewStage=0;$('listView').hidden=false;$('detailView').hidden=true;$('back').hidden=true;$('footer').hidden=false;document.title='诗间集｜唐诗三百首';renderList();return}$('listView').hidden=true;$('detailView').hidden=false;$('back').hidden=false;$('footer').hidden=true;if(randomPreviewSlug===slug&&randomPreviewStage>0){const author=randomPreviewStage>=2?'\u003cp class=\"previewAuthor\">〔'+esc(poem.dynasty)+'〕'+esc(poem.author)+'\u003c/p>':'',firstLine=randomPreviewStage>=3?'\u003cp class=\"previewFirstLine\">'+esc(poem.lines[0])+'\u003c/p>':'',hint=randomPreviewStage===1?'点击屏幕显示作者':randomPreviewStage===2?'点击屏幕显示第一句':'点击屏幕查看全文';$('detail').classList.add('randomPreview');$('detail').innerHTML='\u003cdiv>\u003cdiv class=\"title\">\u003ch1>'+esc(poem.title)+'\u003c/h1>'+author+firstLine+'\u003c/div>\u003cp class=\"revealHint\">'+hint+'\u003c/p>\u003cbutton class=\"revealAll\" type=\"button\" dat ":\"谒衡岳庙遂宿岳寺题门楼\",\"url\":\"https://www.shicile.com/detail/580156250408\",\"translation\":true,\"notes\":true,\"analysis\":true,\"headings\":[\"注释\",\"白话译文\",\"赏析\"]}];window.offlineMeanings={\"tang-001\":\"黄河一去不回，人的青春也转眼消逝。诗人劝朋友举杯畅饮，相信自己的才华终有用处，不必看重钱财和富贵；甚至愿拿名马、皮裘换酒。热烈的劝酒声背后，是理想难以实现、想借酒排遣却难以消除的深愁。\",\"tang-002\":\"战乱中的都城残破，春天只有草木长得茂盛。忧伤使眼前花鸟也牵动泪水；家人分离，平安书信格外珍贵。诗人愁得白发越来越少，把对国家的忧虑和对亲人的思念写在一起。\",\"tang-003\":\"诗先写帝王宠爱杨贵妃、沉迷歌舞，随后战乱骤起，贵妃在逃亡途中死去。帝王归来后处处触景伤情，派人寻访她的魂魄；末段以仙山重托信物、追忆盟誓延续生死相隔的遗憾。爱情悲剧与宫廷盛衰交织，是全诗的两条线索。\",\"tang-004\":\"眼前的一片月光，乍看像地上的白霜。诗人抬头看月亮，又低头想起家乡；短短两个动作，把独在异地时悄然生出的思念写了出来。\",\"tang-005\":\"边地八月已大雪纷飞，积雪的树木仿佛忽然开满梨花，但军中衣被、弓甲都透着严寒。将士设宴送朋友返京，再送到雪路上。人马消失在山弯后，只留下蹄印，离情便落在这片空白里。\",\"tang-006\":\"一夜寒雨之后，诗人在清晨送朋友远行，独自面对楚地山色。他托朋友告诉洛阳亲友：自己的心仍像玉壶中的冰一样清澈，身处离别和困境也不改变操守。\",\"tang-007\":\"母亲在儿子出门前一针针缝好衣服，担心他很久不能回来。孩子所得的照顾如春日阳光般深厚，自己的报答却像小草般微小；诗借临行缝衣写难以报尽的母爱。\",\"tang-008\":\"烛影渐暗，银河与晨星慢慢隐去，长夜的孤独仍未散。诗人想到独居月宫的嫦娥：即使得到长生，也可能因永远与人间分离而后悔。这里借神话写清冷、无伴的心境。\",\"tang-009\":\"暮春三月，朋友从黄鹤楼乘船去扬州。送行的人一直望着那面帆，直到它消失，只剩长江向天边流去；久久不收回的目光，表现了依依不舍。\",\"tang-010\":\"面对美酒佳肴，诗人因前途受阻而无法下咽，仿佛河上结冰、山路积雪。想到古人也曾在困境后得到重用，他又振作起来，相信终有一天能施展抱负，像扬帆远航那样冲破阻碍。\",\"tang-011\":\"相聚不易，分别更痛苦，残春景色也显得无力。诗以春蚕吐丝和蜡烛流泪表现不肯终止的思念，又设想对方同样忧愁，盼有使者探望。可按深切的相思来理解，具体寄托并无唯一说法。\",\"tang-012\":\"群山没有飞鸟，道路不见行人，天地被雪与寒冷笼罩。一位披蓑戴笠的老人仍独自在小船上垂钓；大片寂静衬出他的孤独，也显出不随环境退却的姿态。\",\"tang-013\":\"诗人遥望泰山，赞叹它横跨齐鲁的雄伟、汇聚天地的秀色，以及山间翻涌的云气。他由仰望生出登顶的愿望，想从最高处俯看群山，表现青年人的胸襟与志气。\",\"tang-014\":\"秋山雨后，月光穿过松林，泉水流过石面；洗衣女子归来，渔船划动荷叶。这里既清幽又有日常生活的生气，诗人觉得即使春花已谢，也值得留下。\",\"tang-015\":\"秋夜里，宫中女子拿小扇扑流萤，又在凉如水的夜色中望着牛郎织女星。外表是安静的消遣，背后却是孤单的等待和对相伴生活的向往。\",\"tang-016\":\"朋友备好饭菜，邀请诗人到绿树青山围绕的村庄做客。两人开窗看田园，饮酒谈农事，临别约好重阳再来赏菊；朴素的招待写出自然亲密的友情。\",\"tang-017\":\"诗人独在外乡，重阳佳节使思念更加深切。他不只写自己想家，还设想家中兄弟登高、佩戴茱萸时发现少了自己，以对方的缺憾表现两地亲情。\",\"tang-018\":\"归期还无法确定，眼下只有巴山连夜的秋雨不断涨满池塘。诗人想象将来与亲人相聚，夜里同坐窗前，再谈起这场雨；未来团聚的愿望使眼前的孤独更动人。\",\"tang-019\":\"船在青山绿水间前行，潮平岸阔，顺风张帆。旧夜未尽太阳已升起，旧年未过江南已有春意；新旧交替的景象，又引出旅人托归雁传家书的思乡之情。\",\"tang-020\":\"忽然听说失地收复，诗人激动得流泪，家人也一扫愁容。他想放歌饮酒，趁春天立即返乡，连沿途路线都在心里飞快展开，表现战乱结束带来的狂喜。\",\"tang-021\":\"精美酒杯里盛着葡萄酒，马上琵琶声催动饮兴。将士豪爽地说，即使醉倒沙场也别笑，因为征战中能够活着归来的人并不多；豪迈话语中含着生死无常的悲凉。\",\"tang-022\":\"城外青山白水间，朋友就要像飘蓬一样远行。浮云似游子的去意，落日似送行人的留恋；挥手之后，连分别的马也长鸣，烘托出不舍。\",\"tang-023\":\"两人同在外地做官，诗人理解朋友远赴蜀地的离愁。他劝慰说，真正知心的人即使相隔天涯，也像近邻一样亲切，不必在岔路口只顾流泪。\",\"tang-024\":\"夜深时月光只照亮一部分人家，星斗已经转过天空。诗人从透进绿窗纱的虫鸣，忽然察觉春意变暖；春天不是先被眼睛看见，而是被耳朵听见。\",\"tang-025\":\"诗人用开山传说、高峰急流、险峻栈道和悲鸟啼声，层层写出入蜀之路的艰危。后来又从山川险恶转到关隘被人把持可能造成的危险，劝远行者早日归来；惊叹中包含对旅途与世事的忧惧。\",\"tang-026\":\"明月从海上升起，远隔天涯的人也能同时看见。诗人因思念而整夜不眠，灭烛赏月又觉露冷；月光无法捧去相赠，只好盼在梦里相会。\",\"tang-027\":\"原野上的草每年枯萎又生长，野火也断不了它的生机。春草沿古道伸向远方，恰像送别时不断延展的情意；全诗把草的顽强与离别的不舍连在一起。\",\"tang-028\":\"传说中的乘鹤人早已离去，楼与白云仍在。诗人看见晴日里的江岸树木和洲上芳草，到了黄昏却辨不清故乡方向；眼前壮丽景色最终化成旅人的乡愁。\",\"tang-029\":\"早雨洗净渭城尘土，客舍旁柳色清新。朋友将远赴西域，诗人再劝一杯酒，因为出了阳关，熟悉的人便少了；寻常劝酒里含着对远行者的关切。\",\"tang-030\":\"明月和边关仿佛仍是秦汉时的模样，长年征战的人却迟迟不能归家。诗人盼望有善战的名将守住边境，使敌骑不再越山入侵，也使百姓免受战争之苦。\",\"tang-031\":\"黄河远连白云，孤城立在高山之间。边地笛声吹起带有离愁的《折杨柳》，诗人说不必怨春天迟到，因为玉门关外本就难见春风；荒寒景象写出戍边人的寂寞。\",\"tang-032\":\"诗人独坐深竹林，弹琴、长啸，没有人知道他在这里，只有月光照来作伴。与世隔开的清静并不只是孤独，也是一种自在。\",\"tang-033\":\"船出荆门，山势渐尽，开阔平原与大江展现在眼前，月影云气也变得奇丽。诗人仍眷恋故乡，把身边江水想成一路送自己的亲友。\",\"tang-034\":\"琴弦引出对逝去年华的追忆，梦蝶、杜鹃、泪珠与玉烟把美好、哀伤和迷惘交织起来。诗末说，往事并非到今天才令人怅惘，当年身在其中已经难以说清。具体所指历来有多种解释，不宜限定为单一故事。\",\"tang-035\":\"独自饮酒没有伙伴，诗人便邀月亮与影子作陪，想象三者一同歌舞。明知它们不能真正理解自己，却仍约定长久相伴；浪漫想象暂时排解了孤独，也显出对知音的渴望。\",\"tang-036\":\"诗人江边送客时听见琵琶，邀弹奏者相见，细写乐声从轻柔、激越到沉寂的变化。女子讲述自己由京城乐人沦为独守空船的商妇；诗人想到自己的贬居遭遇，感到彼此同样失意，请她再弹，终于泪湿衣衫。\",\"tang-037\":\"急风、猿声、落叶和奔流的长江构成辽阔秋景。诗人却是远离故乡、老病独处的登楼人；身世艰难，白发日增，连借酒排愁也因病不能，景象越宏大，孤苦越深。\",\"tang-038\":\"春睡醒来，四处都是鸟鸣。想起昨夜听到的风雨声，诗人不禁惦念花朵落了多少；从醒后的听觉写出春晨的生机，也流露惜花之情。\",\"tang-039\":\"夜泊秦淮，水面烟月朦胧，附近酒楼仍传来曾与亡国故事相连的歌曲。诗人借歌声感叹：人们沉醉享乐，却没有从历史覆亡中吸取教训。\",\"tang-040\":\"夕阳依山而落，黄河向大海奔流。诗人想把更远的景物看清，就再登高一层；登楼的实际体验，也启发人不断拓展眼界。\",\"tang-041\":\"幼年离乡，年老才归，口音未变，鬓发却已衰落。村中孩子不认识他，还把他当作外来的客人；亲切的笑问反衬出离家太久的感慨。\",\"tang-042\":\"诗人喜爱涧边幽草和深树里的黄鹂。傍晚春雨催急了溪水，渡口无人，船自在横着；没有热闹的人事，只有清幽景物与自然流动。\",\"tang-043\":\"边城鼓声和孤雁声使秋夜更冷清，眼前月亮也让诗人觉得故乡的月最明。兄弟因战乱分散，书信难通，连彼此生死都无从问起，思念中满是担忧。\",\"tang-044\":\"一件埋在沙中的断戟引发对赤壁之战的追想。诗人设想，若东风没有帮助周瑜，结局可能完全不同，连二乔也可能被掳走；用小处的人物命运表现历史胜败的转折。\",\"tang-045\":\"月落、乌啼、江边树影和渔火伴着客船上的愁眠。半夜寒山寺的钟声远远传来，使漂泊者清醒地感受到夜的深与静。\",\"tang-046\":\"清晨辞别云霞中的白帝城，船顺江飞快前行。两岸猿声还在耳边，重重山岭已落在身后；夸张的速度写出旅途畅快和轻松的心情。\",\"tang-047\":\"诗人到诸葛亮祠堂，看见柏树、春草和黄鹂，却因怀人而无心欣赏。他追念诸葛亮受托辅国、竭尽忠诚的一生，尤其痛惜其壮志未成便去世，借凭吊表达对忠贤的敬仰。\",\"tang-048\":\"远离家乡，向东望去只有漫长道路，思亲的泪水还未干。恰在马上遇见返京使者，来不及写信，只能托他捎一句平安，写出边途相遇的匆忙与真情。\",\"tang-049\":\"诗人觉得前代贤者已不可见，后来的知音也还未到来。面对无边天地与漫长时间，个人显得格外孤独，壮志无人理解的悲慨化作眼泪。\",\"tang-050\":\"春日长安飞花满城，宫柳在东风中摇动。到了禁火的寒食时节，宫中却把新火赐给权贵之家；诗从节日风景写到特殊恩宠，含有对权势特权的讽意。\",\"tang-051\":\"傍晚把船停在烟雾笼罩的小洲边，旅愁又涌上心来。原野空阔，天像低垂在树边；江水清澈，月影仿佛亲近船中人，景物既衬孤寂，也稍作慰藉。\",\"tang-052\":\"月光照着长安，家家传出准备寒衣的捣衣声。秋风似把思念送向玉门关，家中人盼着战事早停，让远征的丈夫回到身边。\",\"tang-053\":\"明月、云海和长风连接起辽阔边塞，也连接起长年征战的历史。边地士兵望乡难归，家中人同样长夜叹息；战争使两地的人共同承受离愁。\",\"tang-054\":\"诗人回忆从前在王公宅第听李龟年演唱，如今竟在江南落花时再遇。没有直说的，是当年繁华已经散去、彼此经历漂泊；重逢的欣喜里含着世事巨变的伤感。\",\"tang-055\":\"登上久闻的岳阳楼，洞庭湖浩大得仿佛分开吴楚、托起天地。诗人却老病无依，亲友音信全无，只剩一条孤舟；想到北方战事，更忍不住流泪。\",\"tang-056\":\"山中看不到人，只传来人语的回声。夕阳返照进入深林，又落在青苔上；短暂声音与一小片光亮，使幽深山林的安静更加鲜明。\",\"tang-057\":\"昨日留不住，今日又多烦忧；登楼送别时，秋风与文学谈兴一度使诗人豪情高涨。但举杯并不能消愁，于是想到乘舟远去，表达不愿被失意现实束缚的心情。\",\"tang-058\":\"清晨走入古寺，曲折小径通向花木深处的禅房。山光、潭影让人心神澄静，最后只剩钟磬声回荡；由入寺到忘却杂念，是全诗的变化。\",\"tang-059\":\"昔日显贵居住的街巷，如今野草开花、夕阳斜照。燕子依然飞来，却进入普通百姓的屋檐；借燕子不知人世变迁，写旧日门第繁华的消散。\",\"tang-060\":\"南方生长的红豆又抽出新枝，诗人劝远方的人多采一些。红豆被当作寄托相思的信物，小小果实承载着对亲友的惦念。\",\"tang-061\":\"凤凰早去，昔日宫苑与贵族也只剩遗迹，大江和山洲仍在。诗人登台怀古，又因望不见长安而忧愁；遮日浮云可以理解为现实中阻碍视听、妨害理想的力量。\",\"tang-062\":\"洞庭湖水与天空相接，波涛声势震撼岳阳。诗人说想渡水却无舟楫，见人垂钓又羡鱼，以此委婉表达自己希望出仕、获得引荐的愿望。\",\"tang-063\":\"诗人追忆昨夜宴席上的相会：虽不能像鸟一样双飞，彼此心意却能相通。欢乐尚在回味，自己已听鼓赶去任职；公务与离散打断了难得的亲近。\",\"tang-064\":\"傍晚心情不畅，诗人登上古原，看到极美的夕阳。美景与即将入夜同时出现，使赞叹中带着时光将尽的怅惘。\",\"tang-065\":\"遇见从家乡来的人，诗人没有先问大事，只问窗前那株寒梅开了没有。熟悉的小景物牵连着整座故乡，平常问话里藏着深切乡情。\",\"tang-066\":\"诗人因传闻而梦游天姥，飞渡月夜，攀登奇峰，又进入雷电洞天与群仙盛会。梦醒后瑰丽景象全消，他想到世间荣乐也易逝，决定访山远游，不肯为了权贵屈身，守住精神自由。\",\"tang-067\":\"秋虫、薄霜和孤灯陪伴着长夜相思，所念之人却像隔在云端。山水阻隔，连梦魂都难到达；诗反复说相思，把无法靠近的痛苦推得更深。\",\"tang-068\":\"友人居所虽近城郭，通往门前的却是桑麻野径，篱边新菊还未开。敲门无人应答，邻居说他进山了，常到夕阳西下才归；未见其人，已经从环境和作息看出他的闲逸。\",\"tang-069\":\"诸葛亮在三国鼎立中的功业与八阵图相联系，江水流过，阵石仿佛仍守原位。诗人由遗迹想到伐吴失策带来的遗憾，感叹杰出谋略也未能挽回大局。\",\"tang-070\":\"战乱和荒年使家业凋零，兄弟像失群的雁、离根的蓬草分散各地。诗人设想众人同看明月、同为故乡流泪，让分隔五处的亲情在一夜月色中相连。\",\"tang-071\":\"诗人送两位被贬的朋友，借巫峡猿声、衡阳归雁和远帆古木想象他们各自的旅途。结尾以未来仍可能得到恩遇相劝，努力减轻离别与失意的沉重。\",\"tang-072\":\"微风细草旁停着孤舟，星空低垂于平野，月光涌动在江面。诗人感叹自己年老多病、仕途失意，在壮阔天地之间漂泊无依，就像一只沙鸥。\",\"tang-073\":\"新酿的酒与红泥小炉都已准备好，天色渐晚，似乎要下雪。诗人问朋友愿不愿来喝一杯，简单邀请里有冬日相聚的温暖。\",\"tang-074\":\"看到云与花便联想到美人的衣饰和容颜，春风露水更添光彩。诗人又把她比作仙山月下的人物，用华美想象赞赏眼前人的美丽。\",\"tang-075\":\"山中送走朋友，天黑后独自关上柴门。想到明年春草还会变绿，却不知道朋友能否回来，自然有定期的更新衬出重逢无定期的惆怅。\",\"tang-076\":\"诗人晚年喜爱清静，兴起便独游山中。走到水流尽处就坐看云起，偶遇山中老人便自在谈笑，甚至忘了归时；不强求目的的行游写出随遇自适。\",\"tang-077\":\"新年到来，远在天涯的诗人更想家。自己年老失意，春天却先一步回到故乡；眼前只有猿声江柳相伴，又想到古人被贬的遭际，不知还要漂泊几年。\",\"tang-078\":\"华贵衣服不如青春时光值得珍惜。花能折时应及时折取，不要等花谢才空攀枝条；诗借花期提醒人把握当下，莫让年华白白过去。\",\"tang-079\":\"诗人设想妻子正在鄜州独自望月，孩子还不懂她为何思念长安的亲人。夜雾沾湿头发，月光照冷双臂，他盼着有朝一日两人同在窗前，让离别的泪痕干去。\",\"tang-080\":\"诗人在松下问童子，得知老师上山采药，只知道还在这座山中，却被深云遮住，不知何处。问答由有所希望到难以寻见，留下山林幽深与隐者行踪自在的意味。\",\"tang-081\":\"国家多难，登楼所见的春花反使诗人伤心。锦江和玉垒山见证古今变化，他仍盼朝廷安定、外患止息，又借蜀汉人物的遗迹寄托忧国之情。\",\"tang-082\":\"在岭外长期与家乡断了音信，如今终于接近故乡，却反而害怕向路人打听。越渴望家人平安，就越担心听到坏消息，这便是近乡时的复杂心情。\",\"tang-083\":\"久别二十年后与老友重逢，双方都已白头，许多旧识已经去世。友人的儿女热情待客，春韭新饭与不断劝酒使这一夜格外温暖；想到明日又隔山岳，诗人更珍惜眼前相聚。\",\"tang-084\":\"暮色中远处寺钟传来，僧人背着斗笠、带着夕阳独自走向青山。诗不直写离愁，而用渐远的身影表现送别时安静而悠长的情意。\",\"tang-085\":\"大风卷沙走石，严寒使汗水结冰、砚水凝冻，将士仍披甲连夜行军。诗以险恶环境衬出军队的勇猛坚忍，并预祝出征取胜。\",\"tang-086\":\"树叶凋落，雁群南飞，北风使江面寒冷。诗人在孤帆与暮色中想念襄水边的家，又觉得前路像茫茫渡口一样难辨，乡愁与人生迷惘相伴。\",\"tang-087\":\"远山流水间，江南深秋仍有草色。诗人想象扬州桥上明月与箫声，带着亲切的打趣询问朋友身在何处，把怀念写得轻快而有画面感。\",\"tang-088\":\"黑夜里敌军首领趁暗逃走，雁群被惊起。将军正要率轻骑追赶，飞雪已落满弓刀；诗停在即将出发的一刻，写出追敌的果断和边夜的严寒。\",\"tang-089\":\"军队出征，家人拉衣拦路痛哭。一个士兵诉说征役多年不止，田地荒芜，赋税仍急，男子常战死异乡。诗把百姓的具体苦难与统治者不断开边的欲望相对照，谴责无休止的战争。\",\"tang-090\":\"皇帝深夜召见贾谊，仿佛十分重视贤才，还向前挪席倾听。可惜问的不是百姓疾苦，却是鬼神之事；前面的赞许到最后转为讽刺，揭示求贤未必真正用贤。\",\"tang-091\":\"远方燕地草刚萌生，秦地桑枝已浓绿，家中的女子正盼丈夫归来。连吹入帘中的春风都使她心烦，因为它不能替代亲人的相伴。\",\"tang-092\":\"月下沙地像雪，城外月色如霜。忽然传来的笛声打破夜静，使戍守边城的人整夜思念故乡；寒景与乐声共同引出乡愁。\",\"tang-093\":\"诗人接连梦见久无消息的李白，梦中朋友来去仓促，担心风波，满头白发。想到京城显贵众多而这样的人却困苦憔悴，他为朋友抱不平：后世声名无法补偿眼前的磨难。\",\"tang-094\":\"离别时感情太深，反而说不出话、笑不出来，看上去像无情。诗人把蜡烛流下的蜡泪想成替人惜别，使难以表达的悲伤有了可见的形状。\",\"tang-095\":\"烟雾中隐约有桥，桃花随着清溪流来。诗人向渔人打听通往桃花源的洞口在哪里；眼前山水因传说而多了对幽美、远离尘世之地的向往。\",\"tang-096\":\"冷落的旧行宫里，花仍独自开放。白发宫女闲谈玄宗往事，以眼前衰老与往日回忆，让人感到青春被宫廷岁月悄悄耗尽。\",\"tang-097\":\"草堂周围春水与鸥鸟相伴，今天却因朋友来访而特意开门扫径。主人歉说菜少酒旧，又热情邀邻翁一起喝，朴素家常中尽见待客的喜悦。\",\"tang-098\":\"新媳妇第一次到厨房做汤，还不知道婆婆喜欢什么口味，先让小姑尝尝。短小情节写出她初入新家的谨慎，也表现善于体察人情的聪慧。\",\"tang-099\":\"诗人请朋友下马饮酒，问他将去何处，得知是因不得志而归隐南山。便不再追问，只让无尽白云陪他远去；理解与尊重，比反复劝慰更深。\",\"tang-100\":\"将士奋身作战，却大批葬身边地。无定河边已经成为白骨的人，仍活在妻子的思归梦里；战场现实与家中期待的强烈反差，揭出战争的残酷。\",\"tang-101\":\"女子卷起珠帘，长久坐着皱眉，脸上还有泪痕。诗人只呈现她的神态，不说明她怨谁、为何而怨，让无言的伤心留给读者体会。\",\"tang-102\":\"渔翁夜宿山边，清晨汲水燃竹。日出烟散后，人船已驶向江心，只闻摇橹或歌唱声，山水显得鲜绿；他的自在往来与岩上浮云相映，写出远离纷扰的生活。\",\"tang-103\":\"柳絮飞入酒肆，朋友们赶来送行，走的与留的都举杯尽饮。诗人把离情与东流水相比，觉得情意比江流更悠长，热闹场面中满是留恋。\",\"tang-104\":\"终南山背阴处仍有积雪，远望像浮在云端。雪后阳光照亮林梢，暮色来时城中却更觉寒冷；由远山景色落到人的切身感受。\",\"tang-105\":\"少妇原本打扮好上楼赏春，忽见路边杨柳，才被离别之感触动。她后悔曾鼓励丈夫求取军功：眼前春光越好，独处就越难忍。\",\"tang-106\":\"诗人敬爱孟浩然不恋仕途、钟情山林的品格，写他饮酒赏月、寻花自适。最后把这种人格比作难以攀及的高山，表达由衷敬意。\",\"tang-107\":\"深帘后的长夜难眠，爱情仿佛只是梦，柔弱的心愿又不断遭到风波。明知相思未必有结果，仍无法停止惆怅；诗重在写求而不得的情感，并非确指某一段已知经历。\",\"tang-108\":\"士兵白天望烽火、夜间行军饮马，长期困在风沙雨雪中。归路被阻，性命不断消耗，换来的却只是异域物产进入京城；诗借古代边事质疑好战求功的代价。\",\"tang-109\":\"夕阳退去，深院里的女子独自流泪，无人看见。春天快结束了，梨花落满空庭，门仍紧闭；花落与天暮衬出被冷落的寂寞。\",\"tang-110\":\"诗人经过昭君故里，想到她离开汉宫、远赴沙漠，最后只留下边地坟墓。画像未能让人真正认识她，琵琶却似仍诉说千年的怨恨；诗为远离故土、命运不由自主的人寄托同情。\",\"tang-111\":\"诗回顾晋军顺江攻下吴国：铁锁没能挡住楼船，金陵最终投降。如今山川仍在，旧营垒已长满秋草；借兴亡遗迹说明险要地形不能保证政权长存，并感慨天下分合。\",\"tang-112\":\"女子在台阶上等待很久，露水浸湿薄袜，才回去放下帘子，却仍望着月亮。没有直接说怨，漫长等待与不肯收回的目光已经道出心事。\",\"tang-113\":\"大军出征时声势盛大，交战后士兵却死伤惨重，将领仍在帐中享乐。将帅轻敌使军队受困，征人与家中妻子只能遥相思念。诗赞扬士卒的牺牲，也谴责不体恤他们的统帅，怀念善待军士的良将。\",\"tang-114\":\"诗人把少女初长成的美好姿态比作早春豆蔻。即使看遍扬州繁华街巷中的佳人，也觉得无人能及，离别时的珍重藏在这份专注的赞美中。\",\"tang-115\":\"除夕仍在遥远山路上漂泊，残雪、孤灯陪着异乡人。离家人越来越远，与身边仆人反而更亲近；明天虽是新年，却没有团聚的喜悦，只有岁月又增的伤感。\",\"tang-116\":\"诗人以不拘世俗的姿态走访名山，铺写庐山峰峦、瀑布、霞光与江流的宏伟。山水引出寻仙远游的想象，他邀朋友同去，表达超脱尘俗、追求自由的愿望。\",\"tang-117\":\"秋雨风定后，雁阵与落叶使客居郊外的人更加孤单。寒灯、空园、露滴和邻近野寺构成寂寥住处；诗人不只想家，也焦虑自己何时才能有所作为。\",\"tang-118\":\"诗人拄杖立在柴门外，看秋山、流水、落日与村烟，听暮蝉鸣叫。朋友醉后前来高歌，两人的闲居生活因相知而更有趣味。\",\"tang-119\":\"春风细雨与隐约雷声唤起女子的心事，精美器物之间更显深闺隔绝。诗借爱情典故寄托向往，最后却说每一寸相思都化成灰烬，写希望难成的痛苦。\",\"tang-120\":\"秋蝉鸣叫，使被囚的诗人更想自己的处境。露重难飞、风大声沉，像清白之人受压制而难以申辩；借蝉的高洁，诗人追问谁能理解自己的心。\",\"tang-121\":\"夫妻从前谈笑说起的身后事，如今竟成现实。妻子衣物逐渐施舍出去，针线却不忍打开，梦中仍惦记她；共同度过贫困的记忆，使每件小事都牵动哀伤。\",\"tang-122\":\"连雨中的村庄升起炊烟，人们做饭送到田间，水田白鹭与浓荫黄鹂各得其所。诗人在山中清静生活，自觉已没有争逐之心，愿像与人亲近的海鸥一样融入自然。\",\"tang-123\":\"清冷琴声像松间风响，诗人静静欣赏古老曲调。他虽喜爱这种音乐，却知道如今很少有人弹奏，欣赏之余含着知音难遇的感慨。\",\"tang-124\":\"汉江连接广阔山川，江流似延伸到天地之外，远山在雾气中若有若无。水势使城郭与天空仿佛浮动起来，诗人陶醉于襄阳风物，愿留下饮酒畅游。\",\"tang-125\":\"远望终南山连绵高耸，走近时云气又不断变化，山谷阴晴各不相同。诗人游兴未尽，隔水向樵夫打听投宿处，用行程写出山势广大与景色多变。\",\"tang-126\":\"宽阔仕途偏偏容不下自己，诗人不愿以迎合权贵换取进身机会。他回想古人既有被轻视者，也有受礼遇后建功者；如今难遇识才之主，便愤然说不如归去。\",\"tang-127\":\"人事不断更替，山河却留着旧日胜迹。诗人与友人登山，看到寒日水落，又读到纪念羊祜的碑文，被前人留下的德行与长久怀念所感动。\",\"tang-128\":\"春兰繁茂，秋桂芬芳，各自在适合的季节生长。它们散发香气并不是为了求别人采摘；诗借草木说明，保持美德应出于本心，不必依赖外界赏识。\",\"tang-129\":\"夕阳落下，月亮升起，诗人散发开窗乘凉，听竹露滴声，闻荷花香气。本想弹琴，却缺少知音在旁，清美夏夜反使他更思念朋友，连梦中也惦记。\",\"tang-130\":\"傍晚下山，月亮仿佛陪着诗人来到朋友的田家。穿过竹径藤萝，主人置酒相待，两人歌唱到星稀，醉中都忘掉了世俗算计。\",\"tang-131\":\"诗人先想象梓州的高树、杜鹃和雨后飞泉，又提到当地织布纳贡与田地诉讼。送行不只赞美山水，更劝朋友像贤良地方官那样兴教惠民，做出自己的政绩。\",\"tang-132\":\"士兵年年往来遥远边关，每天离不开马鞭与刀环。春天仍见白雪，眼前尽是长河荒山；没有直接诉苦，重复的行役与不变的寒景已写出怨情。\",\"tang-133\":\"夜里林暗风动，将军误把草中声响当作猛兽，立即张弓射去。天亮寻找箭支，才发现箭竟深深射入石头，用出人意料的结尾突出他的神勇。\",\"tang-134\":\"美人如带露红花般鲜艳，巫山神女的故事也难比拟。诗又拿汉宫赵飞燕作衬托，以层层比美表现眼前人的出众姿容。\",\"tang-135\":\"镜湖荷花盛开，西施采莲引得众人围观，水道都显得拥挤。她未等月出便被带往越王家，明丽采莲景色中出现了命运的转折。\",\"tang-136\":\"女子回忆与丈夫从幼年游戏到婚后相爱的过程。丈夫远行经商后，门前生苔、秋叶纷落，成双蝴蝶更添独处之愁；她盼丈夫提前寄信，即使走很远也愿去迎接。\",\"tang-137\":\"秋夜散步时，诗人思念山居友人，想象深山里松子正落，对方大概也尚未入睡。自己所处的凉夜与想象中的空山相连，构成安静的牵挂。\",\"tang-138\":\"女子离故乡极远，在深宫中已经度过二十年。唱起一支曲子，积压的悲伤便化作泪水；空间的遥远与时间的漫长共同写出宫人的不幸。\",\"tang-139\":\"梦中又来到曾经相会的庭院，曲廊栏杆仍然熟悉。醒后想到只有春月还照着落花，仿佛它仍记得离人旧情，借月色寄托难忘的思念。\",\"tang-140\":\"女子讲述家人在战乱中遇害，自己又被丈夫抛弃，只能在山谷中贫苦度日。她仍坚持洁身自守，宁住简陋茅屋；结尾寒天薄袖、独倚修竹，使苦难中的尊严显得格外动人。\",\"tang-141\":\"诗人回想昔日流连江南歌酒的生活，如今回看仿佛一场长梦。多年过去，留下的竟只是薄情的名声，轻松口吻中包含虚度年华的自嘲与懊悔。\",\"tang-142\":\"郊外远望，雪山与清江壮丽，但战乱使兄弟离散，诗人老病独处。他忧心未能报国，又看见人事日渐萧条，登临不但不能解愁，反而更添悲慨。\",\"tang-143\":\"昔日园林中的富贵已经消散，只有流水春草如常。黄昏鸟鸣与纷落花瓣，使诗人联想到绿珠坠楼的悲剧，把繁华消逝与人物命运写在一起。\",\"tang-144\":\"弹筝女子想让懂音乐的人注意自己，便不时故意拨错琴弦。诗用一个小动作写出她希望获得心上人关注的心思，趣味在于错音其实是有意为之。\",\"tang-145\":\"岁末长夜里，鼓角悲壮，星河倒映三峡，远处百姓为战事哭泣，也有渔樵歌声。诗人想到历史英雄终归尘土，自己又音信寂寥，个人孤独与时代忧患汇在寒夜中。\",\"tang-146\":\"名贵牡丹与绝色美人相映，君王带笑欣赏。沉香亭北倚栏观花的情景被写得明丽华贵，表现宫廷赏春时的愉悦与宠爱。\",\"tang-147\":\"女子从日暮到月明都愁得难眠，琴曲无人传达，便想托春风把心意送往边地。昔日明亮眼睛如今只会流泪，她盼远人归来亲见自己的憔悴。\",\"tang-148\":\"秋风起时，诗人担忧远方李白的处境，盼着来信，又怕江湖水险。他感叹有才之人反遭困厄，并想到屈原的遭遇，把对朋友的思念化为深切不平。\",\"tang-149\":\"新春雨中，诗人怀着失落远望红楼，最终只能伴着灯影独归。远路、残夜和难寄的书信使相思更重，春景并未带来欢悦，反而放大了阻隔。\",\"tang-150\":\"相会的承诺落空，离去后也没有消息，只有五更钟与残梦相伴。诗人匆忙写信，眼前灯烛香气又引起回忆，觉得所念之人比传说中的仙山还难接近。\",\"tang-151\":\"春风吹开宫桃，明月照着前殿，一位新近得宠的歌舞女子得到锦袍御寒。诗把注意力放在一夜之间的恩宠上，写宫廷中命运随君王喜爱而改变。\",\"tang-152\":\"蝉栖得高却难以饱腹，竭力鸣叫也无人理会。诗人把自己的清贫小官生活与蝉相照，听其声如受提醒，表达处境艰难仍不改清白的心意。\",\"tang-153\":\"诗人回顾古代贤达在功名场上遭受的祸患，认为过于执著声名未必能保全自己。他转而赞赏懂得及时退身的人，宁愿珍惜生前自在，不再苦求身后虚名。\",\"tang-154\":\"诗人说晚年喜静，自认没有济世良策，便回到山林，在松风月下弹琴。朋友问穷达的道理，他以远去的渔歌作答，表示不愿再用得失衡量生活。\",\"tang-155\":\"十年前分别的旧友如今在淮上重逢，谈笑仍如从前，鬓发却已斑白。时间流逝的感慨与重逢喜悦并存，末尾又以淮上秋山写暂留之意。\",\"tang-156\":\"李白远谪又无消息，诗人因忧念而梦见他，甚至担心来的是魂魄。梦醒月照屋梁，仍像看见故人面容；最后叮嘱他远离江湖险恶，梦境处处都是关切。\",\"tang-157\":\"傍晚渡头的人们争着回村，诗人却乘船归鹿门山。月光照开林间雾气，他来到昔日隐者居处，在幽静松径间独自来去，表现主动选择的山居生活。\",\"tang-158\":\"夕阳下牛羊归村，老人等牧童，农人扛锄相见交谈，田间桑麦也各有生机。眼前人人有所归的安宁，使诗人羡慕田园，生出归隐念头。\",\"tang-159\":\"异乡做官的人格外敏感于春天变化：海上云霞、江南梅柳、黄鸟绿蘋都报春来。听到友人的诗，更想起故乡，赏春的惊喜最终转为归思。\",\"tang-160\":\"明早驿使就要启程，女子连夜给远征丈夫赶制棉袍。手冻得抽针都难，更难握剪刀；衣服做好后，她又焦急地想还要几天才能送到丈夫手中。\",\"tang-161\":\"女子赶走枝头黄莺，不愿它继续叫，因为鸟鸣惊破了自己的梦，使她没能在梦里走到辽西与亲人相会。看似无理的责怪，实际出于离别之苦。\",\"tang-162\":\"悼念妻子时，诗人也悲叹人生短促。合葬与来生重逢都难以确知，眼下能做的只有长夜不眠、不断追念，想以此补偿她生前未曾舒展的愁眉。\",\"tang-163\":\"表面写新娘见公婆前，低声问丈夫自己的眉画得是否合宜。结合题目，这是应试者把自己比作新娘，委婉请教前辈：自己的文章能否得到认可。\",\"tang-164\":\"僧人被比作孤云野鹤，本就不愿久住尘世。诗人又劝他不要选择已经出名、游人熟知的山林，表达对真正清静生活的理解与祝愿。\",\"tang-165\":\"夕阳下，诗人穿过落叶寒云去探访孤僧，见他敲磬、倚杖，生活安静。想到人在广大世界中如此微小，便觉得世俗的爱憎不必执著。\",\"tang-166\":\"北斗高悬，哥舒翰夜里仍带刀守边。敌人虽然窥伺牧地，却不敢越过临洮；民歌以简洁形象表达对守边将领的赞颂。\",\"tang-167\":\"贫家女子虽然善于针线、品格自重，却没有华贵衣饰，也不被媒人重视。她年年为别人缝嫁衣，自己的婚事却无着落；诗借她的遭际写才能不被赏识的委屈。\",\"tang-168\":\"山路伸入白云，清溪带来落花香气，深柳掩映着读书堂。幽静门径和透过林叶的光亮，构成远离喧嚣、适宜读书生活的山中居所。\",\"tang-169\":\"归途中水流清澈，车马缓行，暮鸟也像陪自己回家。渡口荒城与满山落日渐次展开，最终回到嵩山闭门自处，写摆脱尘事后的安定。\",\"tang-170\":\"去年花开时分别，如今又是一年，世事难料，诗人病中想归田，又因治下有人流亡而惭愧。听说朋友将来探望，他一次次望月等待，盼友情慰解忧愁。\",\"tang-171\":\"初秋月升，衣服已嫌单薄，女子仍久久弹筝。不是不知夜深，而是害怕回到空房，借不断奏乐拖延独处的时刻。\",\"tang-172\":\"登楼面对辽远海天，狂风密雨摧扰花木，重山曲水又阻断远望。诗人与几位朋友同遭贬谪，却仍各隔一方，连书信也难通，景中处处是牵挂与忧愁。\",\"tang-173\":\"女子梳妆后下楼，庭院虽有春光，却关不住满心愁绪。她走到院中默数花朵，静得连蜻蜓也落到发饰上；细小动作写出深院生活的无聊与寂寞。\",\"tang-174\":\"诗人循着深山路径寻找寺庙，先闻钟声，后见石泉与松影。到傍晚坐在幽潭边，借禅坐平息心中烦扰，旅程由寻寺渐转为内心的安静。\",\"tang-175\":\"失宠女子哭湿手巾、难以入梦，前殿却仍传来新人的歌声。容颜未老便失去恩宠，她倚着熏笼坐到天亮，写宫廷生活中被抛下的痛苦。\",\"tang-176\":\"战乱分别十年，表弟已长大，初见时竟要通姓名才认出旧人。两人说不尽往事，天已暮，又不得不约明日分别；重逢的惊喜与再别的惆怅紧紧相连。\",\"tang-177\":\"江南橘树冬天仍绿，并非只因温暖，而有耐寒的本性。果实虽好，却被重重阻隔，不能送给佳客；诗借橘树自况，说明人才不应因位置偏远而被忽视。\",\"tang-178\":\"客人散去，园中花瓣随风飘落，一直延伸到夕阳深处。诗人不忍清扫，还盼花能回来，最后只有泪水沾衣；惜花也寄托着美好事物无法挽留的哀伤。\",\"tang-179\":\"采桑女子在明媚春日里劳作，光彩照人。她说蚕还等着吃桑叶，请路过的显贵不要纠缠，表现面对权势仍坚持自己生活的态度。\",\"tang-180\":\"蜀地僧人的琴声如万壑松风，又像流水洗净旅人心事。诗人听得入神，余音与晚钟相融，直到山色转暗才觉已近黄昏。\",\"tang-181\":\"诗人登高遥望，目光随雁飞远，清秋带来游兴，薄暮又引出思友之愁。归村人、渡口和远洲尽收眼底，他盼朋友带酒来，共度重阳。\",\"tang-182\":\"诗人把远谪后的生活说成暂时摆脱官场束缚，白天近农田，夜里泛溪舟，独唱于辽阔天空下。这份自适中也有孤寂，闲居并非完全出于主动选择。\",\"tang-183\":\"西王母开窗等待，想起周穆王当年的歌声，纳闷那能日行万里的车马为何不再来。以神话中的等待反问求仙者的去向，含蓄点出长生幻想难以实现。\",\"tang-184\":\"老将年轻时勇冠战场，却因命运不济而被弃置，年老贫居。边事再起，他仍擦拭甲剑，请求出战，不肯服老；诗为功臣失意鸣不平，也赞扬其未衰的报国心。\",\"tang-185\":\"刘备的英雄气概与开国功业令人敬仰，得到诸葛亮辅佐尤其可贵。可惜后人不能继承，最终连蜀宫歌舞者也到魏宫献艺；颂扬先主与惋惜亡国形成对照。\",\"tang-186\":\"诗人长年漂泊，风雨黄叶中更觉失意，富贵人家却照常奏乐。新交受俗情影响，旧友又难亲近，只有借酒排愁，写出无人相助的落寞。\",\"tang-187\":\"诗人反问谁说伤心画不出来：这几幅南朝旧事图中的老树寒云，就把故城的衰败写得分明。诗赞许画家能通过景物表现历史兴亡之感。\",\"tang-188\":\"朋友的船渐渐消失于辽阔烟水，送行者挥手流泪，只剩青山相对。落日与春水中的远帆越走越远，汀洲白蘋又使留在岸边的人更觉相思。\",\"tang-189\":\"隋炀帝热衷南游，仿佛想把江都当作帝都；若非政权覆亡，豪华船队还会继续远行。如今旧地只余暮鸦，诗借陈后主的亡国故事进一步讽刺奢侈误国。\",\"tang-190\":\"妻子出身较好，却陪诗人过穷日子：翻箱找衣、拔钗换酒，野菜充饥、落叶作柴。如今俸禄丰厚，她却已经去世，能给的只剩祭奠，写出富贵来迟的痛悔。\",\"tang-191\":\"将离京赴任，诗人看似自嘲无能、喜爱闲静，却特意登乐游原望向昭陵。对开国明君的追慕表明他并未真正忘怀政治理想。\",\"tang-192\":\"沿清溪入山，水流在乱石间喧响，到松林中又显清静，菱荇芦苇倒映水面。诗人觉得溪水与自己淡泊的心相合，愿留在石边垂钓度日。\",\"tang-193\":\"旅人夜宿渡口小楼，在清冷月色与落潮江面前独自生愁。远处瓜洲仅有几点灯火，以极少的光亮写出江夜的空阔和客居的孤单。\",\"tang-194\":\"秋水寒冷，风如刀割，士兵饮马远望边城。想到昔日战争曾被称颂为意气豪举，如今只见蓬草间的白骨，诗把功名豪语与战争后果相对照。\",\"tang-195\":\"夜宿江上，猿鸣、急流、风叶与孤舟月色使旅愁更深。这里不是家乡，也没有昔日扬州朋友相伴，诗人愿把思念与泪水一起遥寄给他们。\",\"tang-196\":\"秋夜停船牛渚，诗人望月想起谢尚赏识袁宏吟咏的往事。自己也能高歌，却遇不到那样的知音；明朝又要乘舟离去，落叶伴着失落。\",\"tang-197\":\"深院闭门，宫女相对想倾诉心事，却连鹦鹉在旁都不敢开口，怕它学舌传话。一个欲说又止的细节，揭示宫廷生活的压抑与戒惧。\",\"tang-198\":\"在京城等不到机会，诗人打算回乡，又舍不得知心朋友。权势者不肯援引，真正知音稀少，他只好回到故园守静，告别中包含求仕失败的失望。\",\"tang-199\":\"秋景使诗人深深理解宋玉的悲凉，并把他视为跨越时代的老师。故宅与楚宫已荒废，后人却多谈云雨传说，未必懂得其文章与身世，诗因而寄托知音式的凭吊。\",\"tang-200\":\"女子深夜缝帐，回想一次羞涩相遇，当时没能说话，此后又久无消息。花季转过，等待仍无结果，她借风与车马的想象，表达希望再次相近的心愿。\",\"tang-201\":\"女子虽嫁给显贵丈夫，享有华美居室，却因丈夫清早入朝而独守香衾。诗用带点埋怨的口吻，写富贵并不等于时时相伴的幸福。\",\"tang-202\":\"山中从夕阳走向月夜，樵夫已归、鸟已栖息，泉风声格外清楚。约好同宿的朋友却还未来，诗人抱着琴在藤萝小径旁等待，静景衬出期待。\",\"tang-203\":\"久别后收到一封远信，诗人把自己比作病中的司马相如，委婉诉说困顿。说不必询问旧客近况，其实正流露对故人关怀与理解的盼望。\",\"tang-204\":\"旅馆里没有好友，寒灯下回忆往事，孤雁声又惊醒愁眠。梦到家乡已近天明，家信常隔年才到；末尾清江钓船的想象寄托着归隐安居的愿望。\",\"tang-205\":\"诗人赞诸葛亮的才略与忠诚，认为足以比肩古代名相。只是汉室气运已衰，纵然竭尽心力也未能复兴，最终劳瘁而死，敬仰之中充满壮志难成的遗憾。\",\"tang-206\":\"微霜初降，朋友将入京，沿路雁声、云山和暮砧都可能添愁。诗人既关切旅途，也郑重叮嘱：不要只看长安繁华而沉迷享乐，空耗宝贵年华。\",\"tang-207\":\"眼前弟子的剑舞让诗人想起昔日公孙大娘震动四方的技艺。五十年间王朝动乱、艺人凋散，舞蹈虽仍精彩，旧时盛况已不可回；一场表演牵出个人衰老与时代盛衰。\",\"tang-208\":\"赴京途中，诗人在潼关看红叶、残云、疏雨与远河。虽然明日将到都城，心里仍梦着渔樵生活，表现出仕行程与山林向往之间的矛盾。\",\"tang-209\":\"朋友离开落叶荒戍，往江上远行，沿途有劲风、朝阳与孤舟。诗人设想分别后的漫长水路，盼将来再举杯相见，慰解今日离愁。\",\"tang-210\":\"郡斋天气寒冷，诗人忽然惦记山里的朋友，想他正在拾柴过清苦生活。想带酒去陪伴风雨之夜，却又因空山落叶遮路而不知到哪里找他。\",\"tang-211\":\"求仕失意后，诗人说不再向朝廷上书，准备归山。白发与新春催着年岁，疾病和人情疏远更加烦忧；口头决定退归，心中却仍愁得不能入睡。\",\"tang-212\":\"水上相逢，女子主动停船问对方家住哪里，并说自己住在横塘，猜测也许是同乡。简短问话写出江上人的爽朗，也带着希望结识的亲切。\",\"tang-213\":\"渔人循桃花溪进入与世隔绝的村落，那里的人保持旧时生活，热情招待来客。渔人离去后想再访，却再也找不到入口。诗借故事描绘安宁的理想生活，也写现实中难以重返的失落。\",\"tang-214\":\"女子躺在清凉床席上不能入梦，望见夜空澄净，听雁声飞向远方。楼中明月独照，景色虽美却无人共享，映出无言的相思与孤独。\",\"tang-215\":\"诗人走入秋草寒林中的贾谊故宅，感慨贤才竟长期遭贬。对前人远离朝廷的遭遇深表同情，也借凭吊寄托自己相似的失意。\",\"tang-216\":\"女子把裙带松开、小喜蛛出现等生活小事，当作丈夫将归的好兆头，便重新注意梳妆。这些只是诗中人物的民俗联想，写的是久盼团聚的喜悦与猜测。\",\"tang-217\":\"西施从溪边浣纱女成为宫中宠妃，身份一变，待遇和旁人的态度也全变了。诗在写美貌与宠爱之余，揭示世人重富贵、轻贫贱的眼光，提醒模仿外貌未必能复制命运。\",\"tang-218\":\"传说南飞雁到大庾岭便回头，诗人被贬远行却还不能停下。望着初退江潮与昏暗山林，他不知何日能归，想到明朝隔着岭梅再望故乡，更添惆怅。\",\"tang-219\":\"朋友准备入山，诗人劝他尽情领略山水，不要像桃花源故事中的渔人那样只作短暂探访。送别话语里，是对真正安住山林的祝愿。\",\"tang-220\":\"上巳日，长安水边贵妇服饰华美，饮食奢侈，宫中珍馐接连送来。诗细写杨氏贵戚的排场，末尾又警告不要接近权势炙热的丞相，以表面赞叹揭露骄奢与专横。\",\"tang-221\":\"诗人在战乱中辗转西南，久滞三峡，想起同样流落异地的庾信。前人晚年文章因身世之痛而更加动人，也使诗人找到跨时代的共鸣。\",\"tang-222\":\"多年隔山隔水的朋友忽然重逢，惊喜得像在梦中，互问年龄又感时光流逝。雨夜孤灯下共饮，却知道明早又要分别，因此每一杯都格外珍惜。\",\"tang-223\":\"循着苔上足迹寻访山居，沿途有白云、春草和雨后青松，最后走到溪水源头。面对溪花与清静环境，诗人仿佛领会了不必言说的道理，寻人也成为一次心灵安顿。\",\"tang-224\":\"家乡莺燕报春，女子却想着数千里外的戍边丈夫。锦中织字也难诉尽离恨，楼前花开更反衬独眠；她盼统军者早日获胜，让征人归来。\",\"tang-225\":\"诗人踏崎岖山路入寺，僧人照看壁画、准备粗饭，夜里月光照进门。次晨出游，赤足涉涧，见红山碧水与高大树木，顿觉这样便足以快乐，何必受世俗牵制。\",\"tang-226\":\"登高望边地，军营笳鼓、积雪寒光、烽火与旌旗使诗人震动。壮阔严整的军容激起他的报国心，虽不是从军旧人，也愿请命建功。\",\"tang-227\":\"荒居贫困，四邻寂静，雨中黄叶衬着灯下白发。诗人长期失意，感激表弟常来探望并留宿；亲情和知己之情，让清冷夜晚有了慰藉。\",\"tang-228\":\"女子嫁给远行经商的人，丈夫屡次错过约定归期。她埋怨说潮水都比人守信，早知道不如嫁给弄潮人；带着夸张的气话写久等不归的委屈。\",\"tang-229\":\"寒食将近，春雨催青草，风过麦苗，堤上柳色如画。诗人却有家难归，只求杜鹃别再耳边啼叫，因为它的声音更会催起乡愁。\",\"tang-230\":\"这组宫怨写失宠女子在秋霜、长夜、捣衣声中思念君王。她仍操心御衣寒暖，却只能望向受宠的宫殿，甚至觉得飞来的乌鸦也比自己接近君王。反复的等待揭示恩宠不定与宫人生活的悲凉。\",\"tang-231\":\"诗人住在朋友的山居，周围清溪、孤云、松月、花影与苔痕都显得幽静。这里的生活使他也想辞别尘世，与山林相伴。\",\"tang-232\":\"诗把玄宗在危急中任杨贵妃死去，与陈后主躲入宫井的结局相比。表面肯定前者保住局面的抉择，背后仍让人看见帝王爱情在政权危机前的无力；评价带有复杂的历史讽意。\",\"tang-233\":\"暮钟与细雨笼罩江面，湿帆沉重，飞鸟迟缓，远岸树木也隐约含雨。诗人的送别情意绵延不尽，泪水像细雨一样沾湿衣襟，景与情融成一片。\",\"tang-234\":\"隋炀帝乘兴南游，不听警告、不顾防备，还让全国织造宫锦，大量用作马鞍障泥和船帆。短诗用奢华用途揭露耗费民力的享乐与失政。\",\"tang-235\":\"诗人在宫中值宿，看着暮鸟、星月，听门锁声便想到次日上朝。因为明晨有奏事，整夜难眠，多次询问时辰，写出认真尽职而又紧张的心情。\",\"tang-236\":\"女子因美貌入宫，却发现受宠并不只凭容貌，于是连梳妆也失了兴趣。宫中鸟语花影越美，她越怀念昔日在越溪与伙伴采莲的自由生活。\",\"tang-237\":\"故关衰草、寒云暮雪衬着朋友离去。诗人早年孤苦，历经磨难才遇知己，如今又要分开，不知动荡世路中何时再见，只能相对掩泪。\",\"tang-238\":\"长安沦陷后，诗人悄行曲江，见宫门紧闭，想起往日帝妃游赏的盛况。如今贵妃已死、君王远去，江花江水仍旧，黄昏敌骑又满城，个人悲伤与国家劫难交织，甚至使他心乱迷向。\",\"tang-239\":\"少妇住在华美闺房，看燕子成双，听秋夜捣衣声，更想念久戍辽阳的丈夫。边地音信断绝，京城夜长，明月照着织物，也照出她无人相伴的忧愁。\",\"tang-240\":\"深宫月夜里，女子看着归巢的鸟，独处灯前。她拔下玉钗拨开烛火，救出扑火飞蛾；一个怜惜小生命的动作，也映出她自己的寂寞与善意。\",\"tang-241\":\"秋夜独宿幕府，梧桐寒、蜡烛残，角声整夜回荡，明月也无人共赏。战乱让书信和道路断绝，诗人漂泊多年，只能勉强在此暂栖，难以真正安心。\",\"tang-242\":\"秋日边路上，空桑蝉鸣，黄芦遍地，出入边塞的人都承受寒苦。诗提醒年轻游侠不要只夸良马与豪气，因为真正戍边往往是在风沙中耗尽一生。\",\"tang-243\":\"将军佩着精良弓箭，立在鲜明军旗下发布号令，各营齐声响应。诗用装备、旗帜和整齐呼声，写出统帅威严与军队的纪律气势。\",\"tang-244\":\"虢国夫人仗着君王恩宠，清早骑马入宫，甚至不屑浓妆，只淡画眉毛便去见驾。看似赞美自信姿容，实则显露贵戚恃宠的特殊地位。\",\"tang-245\":\"船行江上，虽已望见汉阳，还要一天才能到达；昼间风平，夜里潮生。诗人满头愁发、急切思归，可家业已毁于战争，江上传来的战鼓更使归心不安。\",\"tang-246\":\"垂帘、彩屏与铺好的床席组成精致的室内景象，天气刚刚转凉，还不到寒冷时候。诗不直接叙述人物心事，以陈设和温度留下静谧而含蓄的生活气息。\",\"tang-247\":\"客人离去，蝉声停歇，露水渐满枝头，诗人久久凭栏。远方消息迟迟不到，只能频频占梦，甚至怀疑故人另有新交而忘了自己，写思念中敏感不安的心理。\",\"tang-248\":\"朋友所在军队早年战败，此后音信隔绝，生死难知。残旗废帐令人想到惨状，诗人想祭奠又怕他尚在人世；哭与盼并存，比确定的死别更难安顿。\",\"tang-249\":\"边地连年用兵，家乡月亮仿佛也一直陪在军营。少妇与征人各自思念，诗人盼有良将一举平定战事，使长期分隔的人能够团聚。\",\"tang-250\":\"诗人随兴泛舟，晚风送船经过花径，夜里又看山间星斗、潭烟与林月。尘世生计仿佛离得很远，他愿做持竿钓鱼的老人，在溪山间自在生活。\",\"tang-251\":\"诗人与朋友同朝为官，却分属不同部门，只能随仪仗朝入暮归。白发落花使人伤感，飞鸟又令人向往自由；末句说朝廷无事可谏，也可读出身为谏官而难以进言的自嘲。\",\"tang-252\":\"凭吊苏武，诗人想起他在北方牧羊、长期与汉朝隔绝，终于归国时青春已逝、旧君已亡。高树古祠映照忠贞，也使迟归之人的巨大付出更加沉重。\",\"tang-253\":\"洛阳富家女子居华屋、乘香车，丈夫年少骄奢，交往的也尽是权贵。结尾忽然转向江边贫穷却同样美丽的浣纱女，质问为何人们只追逐富贵而忽略贫贱者。\",\"tang-254\":\"诗人追想刘备伐吴后病逝永安宫，昔日仪仗宫殿已成空想，遗址如今化为古庙。百姓仍按时祭祀，而附近武侯祠与之相伴，表现君臣关系在后世的共同纪念。\",\"tang-255\":\"长夜琴声中，西风、露水、残萤和早雁一点点传来秋讯。树木尚密，天气已变，诗人从一片落叶感到整个天地的秋意，写对季节变化的敏锐体察。\",\"tang-256\":\"诗人赞曹霸专心绘画、不慕富贵，回忆他为功臣与御马写真时的非凡技艺和宫廷荣耀。如今战乱中却漂泊贫困，为路人画像度日；对艺术的赞美最终转成对人才遭际的同情。\",\"tang-257\":\"夕阳下渡口空明，船来船去，候渡的人与马、沙洲鸥鹭各成景象。诗人由水乡景色想起范蠡乘舟远去的故事，希望抛开世俗算计，悠游烟水。\",\"tang-258\":\"暮春送友，诗人赞陈章甫学识丰富、为人坦荡，不肯卑屈求进。酒中豪放背后是罢官与归途受阻的困顿，最后关切他回乡后的生活，惜别也为其不遇鸣不平。\",\"tang-259\":\"长夜琴声与风雨同样凄切，孤灯、角声和残月陪伴客居者。朋友迟迟未来，家书也无法寄出，南归秋雁更显出人不能归、信不能达的忧愁。\",\"tang-260\":\"已经远送，终究还要分别，诗人回味昨夜月下同行，盼着再有共饮之日。他赞朋友的政绩与声望，又想到自己独回江村养病，友情失去陪伴后更显寂寞。\",\"tang-261\":\"诗先写边地少年勇于战斗、不惜性命，立志报恩后才回乡。转而写女子奏起出塞之音，竟使全军落泪，以柔婉乐声揭示勇士心中同样有乡愁。\",\"tang-262\":\"僧人渡海来去，仿佛随缘行于梦中，法舟远向无边沧海。诗人以水月、梵声和万里灯影想象其旅程，送别中既有担心，也有对修行者精神光明的祝愿。\",\"tang-263\":\"黄昏楚地寒露渐起，舟中人听猿声，看明月从大泽升起，苍山夹着江流。想到古老楚地的神灵与往事终不可见，只能整夜独自感秋，景色辽阔而情绪寂寥。\",\"tang-264\":\"孤雁不肯停在小池，看到翠鸟占据珍木高枝，便担忧它们因显眼而招来猎捕。自己宁愿飞向幽远天空；诗借鸟的选择说明，炫耀富贵和居高位也可能带来危险。\",\"tang-265\":\"鸡鸣、莺声、晓钟引出春日早朝，百官与仪仗在带露花柳间入宫。结尾称赞贾至的诗难以唱和，既铺陈朝廷气象，也表达同僚之间的酬答敬意。\",\"tang-266\":\"主人设酒请客奏琴，室外月冷霜重，室内灯烛明亮。琴声一响，四座静听直到星稀；诗人感到心神被音乐带远，在出使行程之外生出亲近云山的愿望。\",\"tang-267\":\"边城夜报军情，大将率军出征，鼓声与呼喊震动雪海山川。诗又写白骨、风雪和冻石的严酷，以此衬托主帅甘冒艰险、平定边患的决心，并预祝建功。\",\"tang-268\":\"秋日登上古台，野寺人少，夕阳照着旧垒，磬声回荡空林。南朝旧事已远，长江仍流，诗人在思乡之外更感世代兴亡。\",\"tang-269\":\"朋友冒着灞陵雨来到长安，诗人以买斧采山的比喻和他交谈，语气亲切而含蓄。春花已开、燕子育雏，时光又过，诗人在慰问中也惋惜彼此渐生白发。\",\"tang-270\":\"朋友应试落第，诗人置酒相送，想象他乘船回到江淮家门的行程。一次不被采用并不说明道路错误，也不等于没有知音，送别中的重点是维护朋友的信心与尊严。\",\"tang-271\":\"诗借梧桐相伴、鸳鸯同生死，塑造一位以古井止水比喻不改心志的女子。作品体现古代贞节观，含有以死亡守节的表述；理解这种历史观念，不等于赞同现实中以牺牲生命证明忠诚。\",\"tang-272\":\"诗人与堂弟掀帘赏月，看清辉在水木窗户间流动，想到月亮经历古今无数圆缺。远方朋友此夜也许正吟诗，两地不能相聚，便借同一轮月色寄托思念。\",\"tang-273\":\"傍晚收帆停舟，风起淮水，城郭渐暗，归人和落雁各自栖息。旅人却整夜想念关中，听钟而不能睡，周围的归宿反衬自己的漂泊。\",\"tang-274\":\"江上黄昏静阔，飞鸟、远水、孤城号角与泊船都牵动相思。诗人想到被贬长沙的贾谊，以古人忧国受挫的遭际，寄托对远方友人的同情。\",\"tang-275\":\"江上人回答说自己常在九江水边往来，又发现彼此同是长干人，幼年却没有相识。对话中的巧合与遗憾，让陌路相逢忽然变得亲近。\",\"tang-276\":\"终年困在官署，清晨出郊才觉舒展，杨柳青山、细雨春鸠让心绪淡下来。诗人留恋幽静却仍须忙于公务，盼有一天像陶渊明那样结庐田园。\",\"tang-277\":\"清秋号角中，征人倚楼远望青冢、落日与大漠。眼下边境少战事，远客也能通行，诗人希望这种和好像南流的水一样长久持续。\",\"tang-278\":\"诸葛亮庙前的老柏苍劲高大，使诗人追念贤相与先主的遇合。树虽能作栋梁，却因巨大而难以搬用，又承受风雨与虫害；借古柏表达对高才难用者的理解，也寄托自己的感慨。\",\"tang-279\":\"经过诸葛亮筹划军务的旧地，诗人想象当年的威严与才略。纵有良谋，蜀汉仍终至投降，人才也无法独挽时势；凭吊最后化为对功业未竟的深恨。\",\"tang-280\":\"诗人行经华山，看高峰、初晴云雨和险要关河，感到景象雄奇。面对奔忙名利的路人，他反问何不留此学仙，用山岳风光引出远离尘俗的向往。\",\"tang-281\":\"诗人想归隐却缺少生活资财，留在京城又并非本愿。盘缠耗尽、壮志渐衰，凉风蝉声使他更悲伤，只能把心事寄给远方僧友。\",\"tang-282\":\"船从扬子江畔驶入烟雾，亲友与广陵残钟都留在身后。此别不知何时再见，诗人觉得人生像随波来去的船，很难停在想留住的地方。\",\"tang-283\":\"雨后道观清幽，远山与秋砧相接，松影落在空坛，洞边细草有香。诗人觉得此处已如仙境，不必再到世外寻山，把超脱愿望寄在眼前景物中。\",\"tang-284\":\"正愁春将尽，诗人忽受道士邀请前往作客。丹灶与桃花让居所仿佛仙家，他借饮仙酒、驻童颜的想象，写出清明春宴的逸兴。\",\"tang-285\":\"经过孔子故乡祭奠，诗人追想他一生奔波、理想不被当世接受的困厄。故宅与祭礼把现实和往昔相接，表达对先贤的尊敬与不遇之悲。\",\"tang-286\":\"动乱时两人一同南逃，平定后朋友先独自北返。诗人设想他经过残垒故关，看见寒鸟衰草；归乡虽可喜，战争痕迹与多年离散仍令人悲伤。\",\"tang-287\":\"月圆秋夜，漂泊中的旧友重逢，恍如梦境。枝头惊鹊、草间寒虫提醒夜深，大家借酒挽留，害怕晓钟一响又须分别。\",\"tang-288\":\"野外军幕设下庆功宴，边地各族前来祝贺凯旋。将士穿着铠甲起舞，雷鸣般鼓声震动山川，写胜利后的豪情与欢庆。\",\"tang-289\":\"晨光与花露映着集灵台，诗写帝王授受道教符箓、太真含笑入内的场景。宗教仪式与宫廷宠爱并置，使表面的神仙气氛带有对帝妃关系的讽意。\",\"tang-290\":\"诗人清晨汲水漱洗，整理衣服后读经，希望摆脱世人追逐的虚妄。僧院竹苔青松在日光雨露中清新起来，内心也渐趋安静，最后的领会已不需多言。\",\"tang-291\":\"董大弹奏胡笳曲，乐声使人想到蔡琰离乱、边塞风雪与失群雁的哀鸣，又忽而化作林风飞泉。诗用不断变化的景象表现高超琴艺，结尾转向赏识音乐的友人，写知音盼演奏者来访。\",\"tang-292\":\"宫女早起精心梳妆，希望君王到来，却只有冰冷门锁与漫长漏声。她反复照镜、更衣添香，远望正殿动静，等待始终没有结果，写深宫中耗人的期待。\",\"tang-293\":\"诗人观赏曹霸所绘群马，赞其筋骨神气逼真，又追忆画家受赏和宫廷万马腾骧的盛况。想到先帝已逝、御马散尽，画中生命力反衬现实衰败，赏画转为感时怀旧。\",\"tang-294\":\"行役途中停马拜别故友坟墓，泪水几乎浸湿周围土地。往昔对弈相交已不可重来，如今只有落花与莺声送行，诗把友情延伸到生死之外。\",\"tang-295\":\"雁群已北归，一只失群孤雁却在暮雨寒塘间迟疑飞行，寻找同伴。即使没有猎人的箭，孤身也足以使它惊惧；诗借雁写漂泊者无依的心情。\",\"tang-296\":\"中秋月明，两位被贬者对饮，朋友唱出南方艰险生活与遇赦仍未顺利召还的委屈。诗人劝他暂且停歌赏月饮酒，说命运难由自己；看似旷达的宽慰，实际上仍含深深不平。\",\"tang-297\":\"皇帝沿阁道出行，雨中宫阙、春树与万户人家铺展开来。诗以宏阔春景颂扬天子，又说此次出游是顺时施政而非单为玩赏，体现应制诗的颂美语气。\",\"tang-298\":\"秋夜风凉，月光淡淡，孤雁与万家捣衣声伴着诗人。心事难平，便吟诵朋友寄来的好诗，不觉直到晨鸦鸣叫，写诗歌与友情陪伴长夜。\",\"tang-299\":\"风雨带来凉意，诗人在官署招待文士，以蔬果酒诗相娱。他一面享受雅集，一面惭愧百姓尚未安康，最后称赞当地人才之盛，不应只用钱粮多少衡量一方价值。\",\"tang-300\":\"江月、归雁与秋山伴着再次离别，诗人感叹自己白发衰老、仕途坎坷。即使自觉已被世人遗弃，朋友仍叮嘱路上小心风波，这份关怀使他既感激又伤心。\",\"tang-301\":\"高塔如从地面涌起，登临仿佛越出尘世，俯看山川道路与宫苑。秋色铺满关中，帝陵长存又令人想到人生短暂，诗人因此生出辞官参悟佛理的愿望。\",\"tang-302\":\"宫城春日黄莺柳色明丽，却不能驱散诗人久困仕途的愁苦。他虽白发渐多，仍怀报效之心，向近臣赠诗表达求取理解与援引的愿望。\",\"tang-303\":\"再经长安西郊，诗人回忆当年冒险逃出叛军占据的都城、奔赴朝廷，至今仍心有余悸。如今又因调任离京，他不愿归咎君王，只在自叹衰老中驻马回望宫门，忠诚与失意并存。\",\"tang-304\":\"诗人把小小石鱼湖想成洞庭，把岛山看作君山与酒樽，朋友坐在各处饮酒。长风浪大也阻不断运酒船，放大的山水想象表现借宴饮暂散忧愁的豪兴。\",\"tang-305\":\"报晓后宫门层层开启，百官朝拜，日光、仪仗与香烟衬出朝会庄严。朝毕贾舍人还要起草诏书，诗以其归署身影收束，赞写宫廷礼仪与近臣职责。\",\"tang-306\":\"父亲送女儿出嫁，想到她幼年丧母、姐妹相依，格外怜爱又担心她适应夫家。他叮嘱俭朴、恭敬等当时婚俗要求，归来见幼女又流泪；核心是为人父的牵挂与分离之痛。\",\"tang-307\":\"友人带来石鼓文拓本，诗人赞叹古文字的雄奇，追想诗中所认定的古代王朝功业。他曾建议把石鼓妥善收藏、供人研习，却未获重视；如今担心珍贵遗物风化毁坏，长篇议论表达保护文化遗产的热切与无奈。\",\"tang-308\":\"诗人卧病思念远在岳阳的友人，借仙境、仙官和张良退隐等想象写其清高与离开朝廷的处境。既理解友人不愿同流的心志，又盼这样的贤才重回朝中发挥作用。\",\"tang-309\":\"诗回顾平定淮西的功业，以及韩愈奉命撰写碑文、碑却因谗毁被磨去的经过。诗人认为真正有价值的文章早已深入人心，不会随石碑受损而消失，愿反复抄诵使其传世。\",\"tang-310\":\"沦陷的长安满是惊惧与逃亡，诗人遇见衣体受伤、流落路旁的王孙，听其诉说苦难。既怕谈话招祸，又劝他保重、寄望局势好转，写战争如何使昔日贵胄也陷入无助。\",\"tang-311\":\"诗人追忆太平生活，再写自己治理的地方遭乱后民穷困苦，连来犯者都因怜悯而退。奉命征税的官吏却仍逼迫百姓，反不如他们；诗愤怒质问这种政治，甚至想弃官归隐，不愿以害民换取名声。\",\"tang-312\":\"艰难登山叩门却未遇隐者，诗人猜他可能出游或垂钓。原有失望，但雨后草色、松声与幽居气息已使心神清净，于是兴尽下山，不再坚持一定见到主人。\",\"tang-313\":\"暮光中的官署有花木、疏钟与鸟声，友人早晚出入宫廷，承担传诏职责。诗人想追随共事，却自叹年老多病，将要解官，酬答中流露敬意与退身之思。\",\"tang-314\":\"重阳登古台，云山风雨展开壮阔景色，也引出古代仙人的传说。那些人物早已难寻，不如与眼前县令相聚，仿陶渊明饮菊花酒，把求仙遐想落回朋友欢会。\",\"tang-315\":\"觱篥声引人思乡落泪，又变化为寒林、凤鸣、龙吟虎啸般的声音，忽而悲壮，忽而像春花满园。诗用丰富听觉联想赞演奏技艺，最后回到灯下饮酒听曲的现场。\",\"tang-316\":\"书斋掩在泉壑云霞与藤萝中，新雨后的竹、夕阳中的山、闲鹭秋花都令人喜爱。诗人让家童清扫小径，因为已约朋友来访，山居的清幽因此多了期待。\",\"tang-317\":\"隐者独卧，努力洗去忧虑，想借高飞的鸟传递远方心意。可是彼此处境如飞翔与沉落般相隔，真诚未必有人理解，清静外表下仍有不被回应的惆怅。\",\"tang-318\":\"诗人冒秋雨谒衡岳，默祷后云开见峰，再入庙祭拜。庙祝说占卜吉利，他却表示经历贬逐后只求温饱，早无王侯将相之望；夜宿山寺至天明，敬神景象中透出对仕途的冷淡与自守。\"};(function mobileRuntime() {\n  let practiceMode='all',lastRandom='';\n  const baseList=renderList,baseRoute=renderRoute;\n  const select=document.createElement('select');\n  select.id='practiceMode';select.className='sortSelect';select.setAttribute('aria-label','背诵范围');\n  select.innerHTML='\u003coption value=\"all\">全部诗词\u003c/option>\u003coption value=\"unlearned\">未背会\u003c/option>\u003coption value=\"unfamiliar\">不熟悉的\u003c/option>';\n  document.querySelector('.toolbar').prepend(select);\n  const eligible=p=>practiceMode==='all'||(practiceMode==='unlearned'?!isLearned(p.slug):!isLearned(p.slug)&&(unfamiliarity[p.slug]||0)>0);\n  renderList=function(){baseList();currentVisiblePoems=currentVisiblePoems.filter(eligible);const slugs=new Set(currentVisiblePoems.map(p=>p.slug));for(const card of $('grid').children)card.hidden=!slugs.has(card.getAttribute('href').slice(1));$('count').textContent=currentVisiblePoems.length;$('empty').hidden=!!currentVisiblePoems.length;$('randomPoem').disabled=!currentVisiblePoems.length;$('randomPoem').setAttribute('aria-label','从当前 '+currentVisiblePoems.length+' 篇诗词中随机选择一篇');};\n  select.addEventListener('change',()=>{practiceMode=select.value;renderList()});\n  openRandomPoem=function(){renderList();let choices=currentVisiblePoems.filter(p=>p.slug!==lastRandom);if(!choices.length)choices=currentVisiblePoems;if(!choices.length){location.hash='__list__';return}const p=choices[Math.floor(Math.random()*choices.length)];lastRandom=p.slug;randomPreviewSlug=p.slug;randomPreviewStage=1;if(location.hash==='#'+p.slug){renderRoute();if(typeof reportPoemView==='function')reportPoemView()}else location.hash=p.slug;};\n  // Capture also replaces the original button's already-bound handler.\n  document.addEventListener('click',event=>{if(event.target.closest('#randomPoem, [data-next-random]')){event.preventDefault();event.stopImmediatePropagation();openRandomPoem()}},true);\n  lineHtml=function(line,pinyin){let i=0;const segments=line.match(/[^，。！？；、,!?;]+[，。！？；、,!?;]?/gu)||[line];return segments.map(segment=>'\u003cdiv class=\"line\">'+Array.from(segment).map(char=>/\\p{Script=Han}/u.test(char)?'\u003cruby>\u003cspan>'+esc(char)+'\u003c/span>\u003crt>'+esc(pinyin[i++]||'')+'\u003c/rt>\u003c/ruby>':'\u003cspan class=\"punct\">'+esc(char)+'\u003c/span>').join('')+'\u003c/div>').join('')};\n  const actions=document.createElement('div');actions.className='continuousActions';actions.hidden=true;\n  actions.innerHTML='\u003cbutton type=\"button\" data-practice-learn>已背会\u003c/button>\u003cbutton type=\"button\" data-practice-miss>没背出来 +1\u003c/button>\u003cbutton type=\"button\" data-next-random>再抽一首\u003c/button>';\n  document.body.append(actions);\n  renderRoute=function(){baseRoute();const p=poems.find(p=>p.slug===location.hash.slice(1));const full=!!p&&!randomPreviewSlug;actions.hidden=!full;document.body.classList.toggle('hasActions',full);\n    actions.querySelector('[data-practice-miss]').textContent='没背出来 +1';\n    const first=document.querySelector('.previewFirstLine');if(first&&p)first.textContent=(p.lines.join('').match(/^[^，。！？；、,!?;]+[，。！？；、,!?;]?/u)||[''])[0];\n    if(full){actions.querySelector('[data-practice-learn]').textContent=isLearned(p.slug)?'✓ 已背会':'已背会';if(p.slug.startsWith('tang-')){document.querySelector('.meaning')?.remove();document.querySelector('.detailed')?.remove();const info=(window.sourceAudit||[]).find(item=>item.slug===p.slug);const section=document.createElement('section');section.className='meaning';const heading=document.createElement('h2');heading.textContent='离线简明释义';const text=document.createElement('p');text.className='text offlineMeaning';text.textContent=window.offlineMeanings?.[p.slug]||'本篇离线释义未能载入，请查阅下方来源。';const link=document.createElement('a');link.href=p.sourceUrl;link.target='_blank';link.rel='noreferrer';link.textContent=info?.translation?'在诗词乐阅读本诗译文'+(info.analysis?'与赏析':'')+' ↗':'在诗词乐查看本诗注释 ↗';const note=document.createElement('p');note.className='meaningNote';note.textContent='以上为依据原诗独立撰写的简明释义，已内置本页，非网站译文或逐句翻译。来源链接需联网访问。';section.append(heading,text,link,note);document.querySelector('.nav').before(section)}}\n    parent.postMessage({type:'shijianji-route-state',detail:!!p},'*');\n  };\n  removeEventListener('hashchange',baseRoute);addEventListener('hashchange',renderRoute);\n  actions.addEventListener('click',event=>{const p=poems.find(p=>p.slug===location.hash.slice(1));if(!p)return;if(event.target.closest('[data-practice-learn]')){if(!isLearned(p.slug))toggleLearned(p.slug)}if(event.target.closest('[data-practice-miss]')){if(isLearned(p.slug))toggleLearned(p.slug);addUnfamiliarity(p.slug);event.target.textContent='已记录 · '+unfamiliarity[p.slug]}});\n  addEventListener('message',event=>{if(event.source!==parent)return;const data=event.data;if(data?.type==='shijianji-control'){if(data.action==='back')location.hash='__list__';if(data.action==='smaller')adjustFont(-1);if(data.action==='larger')adjustFont(1)}if(data?.type==='shijianji-open-poem'){randomPreviewSlug='';randomPreviewStage=0;renderRoute()}});\n  renderList();renderRoute();\n})();\u003c/script>\n\u003c/body>\n\u003c/html>";
function selectCollection(name,focus=false){const selected=collections[name]?name:'primary';for(const [key,value] of Object.entries(collections)){const active=key===selected;value.tab.setAttribute('aria-selected',String(active));value.tab.tabIndex=active?0:-1;value.panel.hidden=!active}if(focus)collections[selected].tab.focus()}
function collectionFromHash(){selectCollection(location.hash==='#tang300'?'tang300':'primary');if(!historyLayer.hidden)renderHistory()}
const detailStates={primary:false,tang300:false};
function updateBack(){document.getElementById('collectionBack').hidden=!detailStates[location.hash==='#tang300'?'tang300':'primary']}
addEventListener('hashchange',updateBack);
function sendControl(action){collections[location.hash==='#tang300'?'tang300':'primary'].panel.contentWindow.postMessage({type:'shijianji-control',action},'*')}
document.getElementById('collectionBack').addEventListener('click',()=>sendControl('back'));
document.querySelectorAll('[data-font]').forEach(button=>button.addEventListener('click',()=>sendControl(button.dataset.font)));
addEventListener('message',event=>{const name=Object.keys(collections).find(key=>collections[key].panel.contentWindow===event.source);if(name&&event.data?.type==='shijianji-route-state'){detailStates[name]=event.data.detail===true;updateBack()}});
function readHistory(){try{const value=JSON.parse(localStorage.getItem(historyKey)||'[]');return Array.isArray(value)?value.filter(item=>item&&collections[item.collection]&&typeof item.slug==='string'&&typeof item.title==='string'&&Number.isFinite(item.viewedAt)).slice(0,50):[]}catch{return []}}
function saveHistory(entry){const viewedAt=Date.now(),history=readHistory().filter(item=>item.collection!==entry.collection||item.slug!==entry.slug);history.unshift({...entry,viewedAt});try{localStorage.setItem(historyKey,JSON.stringify(history.slice(0,50)))}catch{}}
let displayedHistory=[];
function renderHistory(){const collection=location.hash==='#tang300'?'tang300':'primary';const label=collection==='primary'?'小学75首':'唐诗300首';document.getElementById('historyTitle').textContent=label+' · 浏览记录';displayedHistory=readHistory().filter(entry=>entry.collection===collection).sort((a,b)=>b.viewedAt-a.viewedAt);historyList.replaceChildren();if(!displayedHistory.length){const empty=document.createElement('li');empty.className='historyEmpty';empty.textContent=label+'还没有浏览记录';historyList.append(empty);return}displayedHistory.forEach((entry,index)=>{const item=document.createElement('li'),button=document.createElement('button'),title=document.createElement('span'),meta=document.createElement('span'),time=document.createElement('time');button.type='button';button.className='historyEntry';button.dataset.historyIndex=String(index);title.className='historyTitle';title.textContent=entry.title;meta.className='historyMeta';meta.textContent='〔'+entry.dynasty+'〕'+entry.author;time.className='historyTime';time.dateTime=new Date(entry.viewedAt).toISOString();time.textContent=new Date(entry.viewedAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});button.append(title,meta,time);item.append(button);historyList.append(item)})}
function openHistory(){renderHistory();historyLayer.hidden=false;historyClose.focus()}
function closeHistory(){historyLayer.hidden=true;historyButton.focus()}
addEventListener('hashchange',collectionFromHash);
addEventListener('message',event=>{const collection=Object.entries(collections).find(([,value])=>value.panel.contentWindow===event.source)?.[0];if(event.data?.type!=='shijianji-poem-view'||event.data.entry?.collection!==collection)return;const entry=event.data.entry;if(typeof entry.slug==='string'&&typeof entry.title==='string'&&typeof entry.author==='string'&&typeof entry.dynasty==='string')saveHistory(entry)});
document.querySelector('.collectionTabs').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const current=location.hash==='#tang300'?'tang300':'primary';const next=event.key==='Home'||event.key==='ArrowLeft'?'primary':'tang300';if(next!==current)location.hash=next;selectCollection(next,true)});
historyButton.addEventListener('click',openHistory);historyClose.addEventListener('click',closeHistory);historyLayer.addEventListener('click',event=>{if(event.target===historyLayer)closeHistory()});addEventListener('keydown',event=>{if(event.key==='Escape'&&!historyLayer.hidden)closeHistory()});historyList.addEventListener('click',event=>{const button=event.target.closest('[data-history-index]');if(!button)return;const entry=displayedHistory[Number(button.dataset.historyIndex)];if(!entry)return;closeHistory();location.hash=entry.collection;selectCollection(entry.collection);const panel=collections[entry.collection].panel,openPoem=()=>panel.contentWindow.postMessage({type:'shijianji-open-poem',slug:entry.slug},'*');if(panel.dataset.loaded)openPoem();else panel.addEventListener('load',openPoem,{once:true})});
collectionFromHash();
</script>
