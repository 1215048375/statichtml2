  <!-- 引入 React 和 ReactDOM -->

  <!-- 引入 Firebase SDK (ES Module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.firebaseApi = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, doc, onSnapshot, setDoc, collection };
    
    window.initFirebaseSystem = async () => {
      let firebaseConfig = null;
      let appId = 'default-app-id';

      if (typeof __firebase_config !== 'undefined') {
        firebaseConfig = JSON.parse(__firebase_config);
        if (typeof __app_id !== 'undefined') appId = __app_id;
      } 
      
      const manualConfig = null; 

      if (manualConfig) {
        firebaseConfig = manualConfig;
      }

      if (!firebaseConfig) {
        console.warn("Firebase config not found. Cloud sync will be disabled.");
        return null;
      }

      try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        return { db, appId, auth };
      } catch (e) {
        console.error("Firebase init failed:", e);
        return null;
      }
    };
  </script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 20px;
    }

    }
    body {
      background-color: #e5e7eb;
      font-family: system-ui, -apple-system, sans-serif;

    /* 自定义滑块 */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;

      background: #cbd5e1;

    /* 倒计时完成时的报警动画 - inset box-shadow */
    @keyframes border-cycle {
      0% { box-shadow: inset 0 0 0 8px #ef4444; }
      33% { box-shadow: inset 0 0 0 8px #eab308; }
      66% { box-shadow: inset 0 0 0 8px #3b82f6; }
      100% { box-shadow: inset 0 0 0 8px #ef4444; }

      33% { border-color: #eab308; box-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }
      66% { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
      100% { border-color: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
    }

    .alarm-overlay-anim {
      animation: border-cycle 1.0s linear infinite;
    }
    .alarm-status-anim {
      animation: status-bar-pulse 1.5s linear infinite;
    }
    
    /* Toggle Switch Style */

      right: 0;
      border-color: #68D391;
    }

    const Clock = (props) => <Icon {...props}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></Icon>;
    const Hourglass = (props) => <Icon {...props}><path d="M5 22h14" /><path d="M5 2h14" /><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22" /><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2" /></Icon>;
    const TimerIcon = (props) => <Icon {...props}><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></Icon>;
    const Cloud = (props) => <Icon {...props}><path d="M17.5 19c0-1.7-1.3-3-3-3h-1.1c-.2-2.3-2.1-4-4.4-4-2.3 0-4.2 1.7-4.4 4H3.5c-1.7 0-3 1.3-3 3s1.3 3 3 3h14c1.7 0 3-1.3 3-3z"/></Icon>;
    const CloudOff = (props) => <Icon {...props}><path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 7h1.8a5 5 0 0 0 8.55 3.6M2 2l20 20"/></Icon>;
    const Save = (props) => <Icon {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></Icon>;

    // --- 主题配置 ---
    const THEME_CONFIG = {
      indigo: { base: 'bg-indigo-600 dark:bg-indigo-600', hover: 'hover:bg-indigo-700 dark:hover:bg-indigo-500', light: 'bg-indigo-50 dark:bg-indigo-900/30', text: 'text-indigo-600 dark:text-indigo-400', textDark: 'text-indigo-900 dark:text-indigo-200', border: 'border-indigo-200 dark:border-indigo-800', ring: 'ring-indigo-500', bar: 'bg-indigo-500', activeBorder: 'border-indigo-500 dark:border-indigo-400' },
      rose: { base: 'bg-rose-600 dark:bg-rose-600', hover: 'hover:bg-rose-700 dark:hover:bg-rose-500', light: 'bg-rose-50 dark:bg-rose-900/30', text: 'text-rose-600 dark:text-rose-400', textDark: 'text-rose-900 dark:text-rose-200', border: 'border-rose-200 dark:border-rose-800', ring: 'ring-rose-500', bar: 'bg-rose-500', activeBorder: 'border-rose-500 dark:border-rose-400' },
      emerald: { base: 'bg-emerald-600 dark:bg-emerald-600', hover: 'hover:bg-emerald-700 dark:hover:bg-emerald-500', light: 'bg-emerald-50 dark:bg-emerald-900/30', text: 'text-emerald-600 dark:text-emerald-400', textDark: 'text-emerald-900 dark:text-emerald-200', border: 'border-emerald-200 dark:border-emerald-800', ring: 'ring-emerald-500', bar: 'bg-emerald-500', activeBorder: 'border-emerald-500 dark:border-emerald-400' },
      amber: { base: 'bg-amber-600 dark:bg-amber-600', hover: 'hover:bg-amber-700 dark:hover:bg-amber-500', light: 'bg-amber-50 dark:bg-amber-900/30', text: 'text-amber-600 dark:text-amber-400', textDark: 'text-amber-900 dark:text-amber-200', border: 'border-amber-200 dark:border-amber-800', ring: 'ring-amber-500', bar: 'bg-amber-500', activeBorder: 'border-amber-500 dark:border-amber-400' },
      violet: { base: 'bg-violet-600 dark:bg-violet-600', hover: 'hover:bg-violet-700 dark:hover:bg-violet-500', light: 'bg-violet-50 dark:bg-violet-900/30', text: 'text-violet-600 dark:text-violet-400', textDark: 'text-violet-900 dark:text-violet-200', border: 'border-violet-200 dark:border-violet-800', ring: 'ring-violet-500', bar: 'bg-violet-500', activeBorder: 'border-violet-500 dark:border-violet-400' },
      cyan: { base: 'bg-cyan-600 dark:bg-cyan-600', hover: 'hover:bg-cyan-700 dark:hover:bg-cyan-500', light: 'bg-cyan-50 dark:bg-cyan-900/30', text: 'text-cyan-600 dark:text-cyan-400', textDark: 'text-cyan-900 dark:text-cyan-200', border: 'border-cyan-200 dark:border-cyan-800', ring: 'ring-cyan-500', bar: 'bg-cyan-500', activeBorder: 'border-cyan-500 dark:border-cyan-400' }
    };
    const THEME_KEYS = Object.keys(THEME_CONFIG);
    const getTheme = (key) => THEME_CONFIG[key] || THEME_CONFIG['indigo'];

    const getTodayString = () => {
      const date = new Date();
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const getDaysInMonth = (year, month) => {
      const date = new Date(year, month, 1);
      const days = [];
      while (date.getMonth() === month) { days.push(new Date(date)); date.setDate(date.getDate() + 1); }
      return days;
    };

    const formatDuration = (minutes) => {
      if (!minutes) return '';
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      if (h > 0) return `${h}h ${m}m`;
      return `${m}m`;
    };

    const INITIAL_DATA = {
      users: ['默认用户'],
      currentUser: '默认用户',
      userData: {
        '默认用户': {
          theme: 'indigo',
          timerDuration: 25,
          activeTimer: null, 
          tasks: [
            { id: 1, text: '早起喝一杯水', doneDates: [], totalTime: 0 },
            { id: 2, text: '阅读 30 分钟', doneDates: [], totalTime: 0 },
            { id: 3, text: '运动锻炼', doneDates: [], totalTime: 0 }
          ],
          history: {} 
        }
      },
      cloudKey: null
    };

    const STORAGE_KEY = 'daily_loop_todo_standalone_v17';
    const THEME_MODE_KEY = 'daily_loop_theme_mode';
    const AUTO_BACKUP_KEY = 'daily_loop_auto_backup_enabled';

    // --- 组件 ---

    const EditableText = ({ text, onSave, className, active }) => {
      const [value, setValue] = useState(text);
      const inputRef = useRef(null);
      useEffect(() => { if (active && inputRef.current) { inputRef.current.focus(); inputRef.current.select(); } }, [active]);
      const handleKeyDown = (e) => { if (e.key === 'Enter') { e.preventDefault(); onSave(value); } else if (e.key === 'Escape') { onSave(text); } };
      if (active) {
        return <input ref={inputRef} value={value} onChange={(e) => setValue(e.target.value)} onBlur={() => onSave(value)} onKeyDown={handleKeyDown} onClick={(e) => e.stopPropagation()} className={`bg-transparent outline-none border-b-2 border-white/50 w-full ${className}`} />;
      }
      return <span className={`truncate ${className}`}>{text}</span>;
    };

    const Header = ({ currentUser, users, view, setView, isDarkMode, toggleDarkMode, setEditingUser, renameUser, quickSwitchUser, currentTheme, editingUser }) => (

        <div className="flex items-center gap-3 overflow-hidden flex-1 min-w-0 mr-2">
          <div 
            className="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center bg-white/20 backdrop-blur-sm cursor-pointer hover:bg-white/30 transition-colors"
            onClick={() => setView('users')}
            title="管理用户"
          >
            <User size={16} />
          </div>
          
          <div 
            className="font-bold truncate cursor-text select-none"
            onDoubleClick={() => setEditingUser(currentUser)}
            title="双击修改用户名"
          >
            <EditableText 
              active={editingUser === currentUser}
              text={currentUser}
              onSave={(newName) => renameUser(currentUser, newName)}
              className="block"
            />
          </div>
        </div>

        {/* 右侧：功能按钮组 - 固定位置 */}
        <div className="flex gap-2 flex-shrink-0 items-center">
          <button 
            onClick={toggleDarkMode}
            className="p-1.5 rounded-full bg-white/10 hover:bg-white/20 transition-colors"
            title={isDarkMode ? "切换到日间模式" : "切换到暗夜模式"}
          >
            {isDarkMode ? <Sun size={14} /> : <Moon size={14} />}
          </button>

          {users.length > 1 && (
            <button 
              onClick={quickSwitchUser}
              className="p-1.5 rounded-full bg-white/10 hover:bg-white/20 transition-colors"
              title="切换到下一个用户"
            >
              <RefreshCw size={14} />
            </button>
          )}

          {view === 'calendar' ? (
             <button onClick={() => setView('todo')} className="p-1.5 hover:bg-white/20 rounded transition-colors">
               <ArrowLeft size={20} />
             </button>
          ) : (
            <button onClick={() => setView('calendar')} className="p-1.5 hover:bg-white/20 rounded transition-colors">
              <Calendar size={20} />
            </button>
          )}
        </div>

    );

    const TimerStatus = ({ activeTimer, tasks, now, currentTheme, isAlarmActive }) => {
      if (!activeTimer) return null;
      
      const activeTask = tasks.find(t => t.id === activeTimer.taskId);
      if (!activeTask) return null;

      let timeStr = "0:00";
      if (!activeTimer.isFinished) {
        const remaining = Math.max(0, activeTimer.endTime - now);
        const remainingSecs = Math.ceil(remaining / 1000);
        const m = Math.floor(remainingSecs / 60);
        const s = remainingSecs % 60;
        timeStr = `${m}:${s.toString().padStart(2, '0')}`;
      }

      const alarmClass = (isAlarmActive && activeTimer.isFinished) 
        ? 'alarm-status-anim border-red-500 shadow-xl' 
        : `border-indigo-100 dark:border-slate-700`;

      return (
        <div className={`relative z-20 mx-4 mt-2 mb-1 px-4 py-2.5 rounded-xl bg-white/95 dark:bg-slate-800/95 backdrop-blur-md shadow-lg border flex items-center justify-between transition-all duration-300 flex-shrink-0 ${alarmClass}`}>
           <div className="flex items-center gap-2 overflow-hidden">
             <div className="relative flex items-center justify-center w-6 h-6">
                {!activeTimer.isFinished && <span className="absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-25 animate-ping"></span>}
                <TimerIcon size={16} className={`relative z-10 ${currentTheme.text}`} />
             </div>
             <span className="text-sm font-medium text-gray-700 dark:text-gray-200 truncate">{activeTask.text}</span>
           </div>
           <span className={`font-mono text-lg font-bold ${currentTheme.text} tabular-nums`}>
             {timeStr}
           </span>
        </div>
      );
    };

    const TodoView = ({
      tasks, todayStr, currentTheme, activeTimer, now, 
      timerDuration, updateTimerDuration, 
      editingTaskId, setEditingTaskId, 
      toggleTask, updateTaskText, addTask, deleteTask, startTimer, cancelTimer,
      isAlarmActive,
      users, userData, currentUser, switchUser
    }) => {
      const [newTaskText, setNewTaskText] = useState('');
      const [step, setStep] = useState(1);

      const calculateProgress = (uData) => {
        const uTasks = uData.tasks || [];
        if (uTasks.length === 0) return 0;
        const done = uTasks.filter(t => {
           const dates = t.doneDates || (t.lastDone ? [t.lastDone] : []);
           return dates.includes(todayStr);
        }).length;
        return Math.round((done / uTasks.length) * 100);
      };

      const displayUsers = users.slice(0, 5);
      
      const dateObj = new Date(); 
      const day = dateObj.getDate();
      const month = dateObj.getMonth() + 1;
      const weekDay = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][dateObj.getDay()];

      return (
        <div className="flex flex-col h-full bg-slate-50 dark:bg-slate-900 transition-colors duration-300">

            <div className="w-36 flex-shrink-0 border-r border-gray-100 dark:border-slate-700 flex flex-col items-center justify-center p-2 bg-white dark:bg-slate-800">
                <span className={`text-6xl font-black tracking-tighter ${currentTheme.text}`}>{day}</span>
                <div className="flex flex-col items-center mt-1">
                   <span className="text-sm font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">{month}月</span>
                   <span className="text-sm font-bold text-gray-400 dark:text-gray-500">{weekDay}</span>
                </div>
            </div>

            {/* Right Box: User List */}
            <div className="flex-1 flex flex-col overflow-hidden bg-white dark:bg-slate-800">
              {displayUsers.map((userName, idx) => {
                const uData = userData[userName];
                const progress = calculateProgress(uData);
                const uTheme = getTheme(uData.theme || 'indigo');
                const isMe = userName === currentUser;
                
                const baseBg = idx % 2 !== 0 ? 'bg-gray-50 dark:bg-slate-850' : 'bg-white dark:bg-slate-800';
                
                return (
                  <div 
                    key={userName} 
                    onClick={() => switchUser(userName)} 
                    className={`relative flex-1 flex items-center justify-between px-4 border-b border-gray-100 dark:border-slate-700 last:border-0 ${baseBg} cursor-pointer hover:opacity-90 transition-opacity`}
                    title={`切换到 ${userName}`}
                  >
                    <div 
                      className={`absolute inset-y-0 left-0 opacity-15 transition-all duration-500 ease-out ${uTheme.base}`} 
                      style={{ width: `${progress}%` }} 
                    ></div>
                    
                    <div className={`relative z-10 text-sm font-black truncate max-w-[80px] ${uTheme.text}`}>
                      {userName}
                    </div>
                    
                    <div className={`relative z-10 text-sm font-mono font-black ${uTheme.text}`}>
                      {progress}%
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <TimerStatus activeTimer={activeTimer} tasks={tasks} now={now} currentTheme={currentTheme} isAlarmActive={isAlarmActive} />

          <div className="flex-1 overflow-y-auto pt-1 min-h-0"> 
            {tasks.length === 0 && <div className="text-center text-gray-400 mt-10">还没有每日任务，<br/>在下方添加一个吧！</div>}
            
            {tasks.map((task, index) => {
              const dates = task.doneDates || (task.lastDone ? [task.lastDone] : []);
              const isDone = dates.includes(todayStr);
              const isEditing = editingTaskId === task.id;
              
              const isTimerActive = activeTimer && activeTimer.taskId === task.id;
              let remainingPercent = 0;
              
              if (isTimerActive && !activeTimer.isFinished) {
                const total = activeTimer.duration;
                const remaining = Math.max(0, activeTimer.endTime - now);
                remainingPercent = (remaining / total) * 100; 
              } else if (isTimerActive && activeTimer.isFinished) {
                remainingPercent = 0; 
              }

              const baseBgClass = index % 2 !== 0 ? 'bg-gray-50 dark:bg-slate-850' : 'bg-white dark:bg-slate-800';

              return (
                <div 
                  key={task.id} 
                  className={`relative group flex items-center justify-between p-4 border-b border-gray-100 dark:border-slate-700 last:border-0 transition-colors duration-200 overflow-hidden ${baseBgClass}`}
                >
                  {isTimerActive && !activeTimer.isFinished && (
                    <div 
                      className={`absolute inset-y-0 left-0 z-0 transition-all duration-1000 ease-linear animate-gradient-x bg-gradient-to-r from-blue-400/20 via-indigo-400/20 to-purple-400/20 dark:from-blue-900/40 dark:via-indigo-900/40 dark:to-purple-900/40 border-r-2 border-indigo-400/50 dark:border-indigo-400/30 shadow-[4px_0_15px_-3px_rgba(99,102,241,0.3)]`}
                      style={{ width: `${remainingPercent}%` }}
                    ></div>
                  )}

                  <div className="flex items-center gap-3 flex-1 overflow-hidden z-10">
                    <div 
                      className={`flex-shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors cursor-pointer ${isDone ? `${currentTheme.base} ${currentTheme.activeBorder}` : 'border-gray-300 dark:border-gray-600 hover:border-gray-400'}`}
                      onClick={() => toggleTask(task.id)}
                    >
                      {isDone && <Check size={14} className="text-white" />}
                    </div>

                    <div className="flex-1 min-w-0 flex flex-col justify-center" onDoubleClick={() => setEditingTaskId(task.id)}>
                      {isEditing ? (
                        <input autoFocus defaultValue={task.text} onBlur={(e) => updateTaskText(task.id, e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') updateTaskText(task.id, e.currentTarget.value); if (e.key === 'Escape') setEditingTaskId(null); }} className={`w-full bg-gray-100 dark:bg-slate-600 dark:text-white px-2 py-1 rounded outline-none border-b-2 ${currentTheme.activeBorder}`} />
                      ) : (
                        <>
                          <span className={`block truncate select-none cursor-text ${isDone ? 'line-through text-gray-400 dark:text-gray-500' : 'text-gray-800 dark:text-gray-200'} ${isTimerActive ? 'font-medium text-indigo-700 dark:text-indigo-300' : ''}`} title="双击修改">
                            {task.text}
                          </span>
                          <div className="flex gap-2 text-[10px] items-center mt-0.5">
                              {(task.totalTime > 0) && (
                                <span className="text-gray-400 dark:text-gray-500 flex items-center gap-1">
                                  <Clock size={10} /> 累计: {formatDuration(task.totalTime)}
                                </span>
                              )}
                          </div>
                        </>
                      )}
                    </div>
                  </div>
                  
                  {!isEditing && (
                     <div className="flex items-center gap-2 z-10">
                       <button onClick={(e) => { e.stopPropagation(); isTimerActive ? cancelTimer() : startTimer(task.id, timerDuration * 60 * 1000); }} className={`p-2 rounded-full transition-colors ${isTimerActive ? 'text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20' : 'text-gray-300 dark:text-gray-600 hover:text-green-500 dark:hover:text-green-400 hover:bg-green-50 dark:hover:bg-green-900/20'}`} title={isTimerActive ? "停止倒计时" : `开始${timerDuration}分钟专注`}>
                         {isTimerActive ? <Square size={16} fill="currentColor" /> : <Play size={16} fill="currentColor" />}
                       </button>
                       <button onClick={(e) => { e.stopPropagation(); deleteTask(task.id); }} className="text-gray-300 dark:text-gray-600 hover:text-red-400 dark:hover:text-red-400 transition-colors p-2" title="删除任务"><Trash2 size={16} /></button>
                     </div>
                  )}
                </div>
              );
            })}
          </div>

          <div className="w-full bg-white dark:bg-slate-800 border-t border-gray-100 dark:border-slate-700 transition-colors duration-300 z-20 flex flex-col flex-shrink-0">
            <div className="px-6 pt-4 pb-2">
              <div className="flex justify-between items-center text-xs text-gray-500 dark:text-gray-400 mb-2">
                <span className="flex items-center gap-1"><Hourglass size={12}/> 下次专注时长</span>
                <div className="flex items-center gap-3">
                   <button 
                     type="button"
                     onClick={() => setStep(s => s === 1 ? 5 : 1)}
                     className="text-[10px] px-2 py-0.5 rounded bg-gray-100 dark:bg-slate-700 border border-gray-200 dark:border-slate-600 hover:bg-gray-200 dark:hover:bg-slate-600 transition-colors"
                     title="点击切换步进"
                   >
                     步进: {step}m
                   </button>
                   <span className={`font-bold text-sm ${currentTheme.text}`}>{timerDuration} 分钟</span>
                </div>
              </div>
              <input 
                type="range" 
                min={step} 
                max="120" 
                step={step} 
                value={timerDuration} 
                onChange={(e) => updateTimerDuration(Number(e.target.value))} 
                className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer dark:bg-gray-700" 
              />
              <div className="flex justify-between text-[10px] text-gray-400 mt-1">
                <span>{step}m</span>
                <span>60m</span>
                <span>120m</span>
              </div>
            </div>
            <form onSubmit={(e) => { e.preventDefault(); addTask(newTaskText); setNewTaskText(''); }} className="p-4 pt-2 pb-[calc(1rem+env(safe-area-inset-bottom))]">
              <div className="flex gap-2">
                <input type="text" value={newTaskText} onChange={(e) => setNewTaskText(e.target.value)} placeholder="添加每日循环任务..." className={`flex-1 px-4 py-3 bg-gray-100 dark:bg-slate-700 dark:text-white rounded-lg focus:outline-none focus:ring-2 text-sm transition-shadow ${currentTheme.ring.replace('ring-', 'focus:ring-')}`} />
                <button type="submit" className={`w-12 h-12 ${currentTheme.base} text-white rounded-lg flex items-center justify-center ${currentTheme.hover} active:scale-95 transition-all`}><Plus size={24} /></button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    const CalendarView = ({ calendarDate, setCalendarDate, history, todayStr, currentTheme, setSelectedDate, selectedDate, tasks }) => {
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      const days = getDaysInMonth(year, month);
      const changeMonth = (delta) => setCalendarDate(new Date(year, month + delta, 1));
      const getColor = (dateStr) => {
        const ratio = history[dateStr];
        if (ratio === undefined) return 'bg-gray-100 text-gray-300 dark:bg-slate-700 dark:text-slate-500';
        if (ratio === 0) return 'bg-red-50 text-red-300 dark:bg-red-900/20 dark:text-red-400';
        if (ratio < 0.5) return 'bg-orange-100 text-orange-600 dark:bg-orange-900/30 dark:text-orange-400'; 
        if (ratio < 1.0) return `${currentTheme.light} ${currentTheme.text} opacity-70`; 
        return `${currentTheme.base} text-white font-bold`; 
      };
      return (
        <div className="h-full bg-white dark:bg-slate-800 flex flex-col relative transition-colors duration-300">
          <div className="p-6 border-b border-gray-100 dark:border-slate-700 flex items-center justify-between flex-shrink-0 pt-[calc(1.5rem+env(safe-area-inset-top))]">
            <button onClick={() => changeMonth(-1)} className="p-2 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-full"><ChevronLeft size={20} className="text-gray-600 dark:text-gray-300" /></button>
            <h2 className="text-lg font-bold text-gray-800 dark:text-white">{year}年 {month + 1}月</h2>
            <button onClick={() => changeMonth(1)} className="p-2 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-full"><ChevronRight size={20} className="text-gray-600 dark:text-gray-300" /></button>
          </div>
          <div className="flex-1 p-4 overflow-y-auto">
            <div className="grid grid-cols-7 gap-2 mb-2">{['日','一','二','三','四','五','六'].map(d => <div key={d} className="text-center text-xs text-gray-400 dark:text-gray-500 py-2">{d}</div>)}</div>
            <div className="grid grid-cols-7 gap-2">
              {Array(days[0].getDay()).fill(null).map((_, i) => <div key={`empty-${i}`} />)}
              {days.map(date => {
                const dStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
                return <button key={dStr} onClick={() => setSelectedDate(dStr)} className={`aspect-square rounded-lg flex items-center justify-center text-sm relative transition-transform active:scale-95 ${getColor(dStr)} ${dStr === todayStr ? `ring-2 ${currentTheme.ring} ring-offset-2 dark:ring-offset-slate-800` : ''}`}>{date.getDate()}</button>;
              })}
            </div>
            <div className="mt-8 px-4 py-4 bg-gray-50 dark:bg-slate-700/50 rounded-xl text-xs text-gray-500 dark:text-gray-400 space-y-2">
               <div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-gray-100 dark:bg-slate-700"></div> <span>无记录</span></div>
               <div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-orange-100 dark:bg-orange-900/30"></div> <span>进行中</span></div>
               <div className="flex items-center gap-2"><div className={`w-3 h-3 rounded ${currentTheme.base}`}></div> <span>全部完成</span></div>
            </div>
          </div>
          {selectedDate && (
            <div className="absolute inset-0 bg-black/20 dark:bg-black/50 backdrop-blur-[2px] z-50 flex items-center justify-center p-6 animate-in fade-in duration-200" onClick={() => setSelectedDate(null)}>
              <div className="bg-white dark:bg-slate-800 w-full max-h-[70%] rounded-2xl shadow-xl flex flex-col overflow-hidden" onClick={e => e.stopPropagation()}>
                <div className={`p-4 ${currentTheme.base} text-white flex justify-between items-center`}><span className="font-bold text-lg">{selectedDate}</span><button onClick={() => setSelectedDate(null)} className="p-1 hover:bg-white/20 rounded-full"><X size={20} /></button></div>
                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                  {tasks.length === 0 ? <div className="text-center text-gray-400 py-4">无任务数据</div> : tasks.map(task => {
                    const dates = task.doneDates || (task.lastDone ? [task.lastDone] : []);
                    const doneOnDate = dates.includes(selectedDate);
                    return <div key={task.id} className="flex items-center gap-3 p-2 border-b border-gray-50 dark:border-slate-700 last:border-0">{doneOnDate ? <CheckCircle2 className={`${currentTheme.text} flex-shrink-0`} size={20} /> : <XCircle className="text-gray-300 dark:text-gray-600 flex-shrink-0" size={20} />}<span className={`text-sm ${doneOnDate ? 'text-gray-800 dark:text-gray-200 font-medium' : 'text-gray-400 dark:text-gray-500'}`}>{task.text}</span></div>;
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const UsersView = ({ users, currentUser, storeUserData, switchUser, renameUser, addUser, deleteUser, setView, editingUser, setEditingUser, exportData, importData, cloudKey, setCloudKey, isAutoBackup, setIsAutoBackup }) => {
      const [nameInput, setNameInput] = useState('');
      const [keyInput, setKeyInput] = useState(cloudKey || '');
      const [fbStatus, setFbStatus] = useState('idle'); 
      const fileInputRef = useRef(null);

      const handleConnect = async () => {
        if (!keyInput.trim()) return;
        setFbStatus('connecting');
        setCloudKey(keyInput.trim());
        setTimeout(() => setFbStatus('success'), 1000);
      };
      
      return (
        <div className="h-full bg-slate-50 dark:bg-slate-900 flex flex-col transition-colors duration-300">
          <div className="p-4 bg-white dark:bg-slate-800 border-b border-gray-100 dark:border-slate-700 flex items-center gap-2 flex-shrink-0 pt-[calc(1rem+env(safe-area-inset-top))]"><button onClick={() => setView('todo')} className="p-2 -ml-2 text-gray-600 dark:text-gray-300"><X size={20} /></button><h2 className="font-bold text-lg dark:text-white">账户管理</h2></div>
          <div className="flex-1 overflow-y-auto p-4 space-y-3">
            {users.map(user => {
              const uTheme = getTheme(storeUserData[user]?.theme || 'indigo');
              return (
                <div key={user} onClick={() => switchUser(user)} className={`p-4 rounded-xl flex items-center justify-between cursor-pointer border transition-colors ${user === currentUser ? `${uTheme.light} ${uTheme.border}` : 'bg-white dark:bg-slate-800 border-gray-100 dark:border-slate-700 hover:border-gray-300 dark:hover:border-slate-600'}`}>
                  <div className="flex items-center gap-3 flex-1 min-w-0">
                    <div className={`flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold text-white ${uTheme.base}`}>{user.charAt(0).toUpperCase()}</div>
                    <div className="flex-1 min-w-0" onDoubleClick={(e) => { e.stopPropagation(); setEditingUser(user); }} title="双击修改">
                      {editingUser === user ? <input autoFocus defaultValue={user} onBlur={(e) => renameUser(user, e.target.value)} onKeyDown={(e) => { if(e.key==='Enter') renameUser(user, e.currentTarget.value); if(e.key==='Escape') setEditingUser(null); }} onClick={(e) => e.stopPropagation()} className="w-full bg-white dark:bg-slate-600 dark:text-white border border-gray-300 rounded px-2 py-1 text-sm outline-none" /> : <><div className={`font-medium truncate ${user === currentUser ? uTheme.textDark : 'text-gray-700 dark:text-gray-300'}`}>{user}</div>{user === currentUser && <div className={`text-xs ${uTheme.text}`}>当前账户</div>}</>}
                    </div>
                  </div>
                  {users.length > 1 && editingUser !== user && <button onClick={(e) => { e.stopPropagation(); deleteUser(user); }} className="p-2 text-gray-300 hover:text-red-500"><Trash2 size={16} /></button>}
                </div>
              );
            })}
          </div>
          
          <div className="px-4 py-2 border-t border-gray-100 dark:border-slate-700 bg-white dark:bg-slate-800 flex-shrink-0">
             <div className="mb-2 text-xs font-bold text-gray-500 dark:text-gray-400 flex items-center gap-1"><Cloud size={14}/> 云同步设置</div>
             <div className="flex gap-2 items-center">
                <input type="text" value={keyInput} onChange={(e) => setKeyInput(e.target.value)} placeholder="输入同步密钥 (任意字符串)..." className="flex-1 px-3 py-2 bg-gray-100 dark:bg-slate-700 dark:text-white rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
                <button onClick={handleConnect} className={`px-3 py-2 rounded-lg text-sm text-white transition-colors ${fbStatus === 'success' ? 'bg-green-500' : 'bg-indigo-600 hover:bg-indigo-700'}`}>{fbStatus === 'success' ? '已连接' : (fbStatus === 'connecting' ? '...' : '连接')}</button>
             </div>
             <p className="text-[10px] text-gray-400 mt-1">输入相同密钥的设备将实时同步数据。</p>
          </div>

          <div className="px-4 py-2 bg-white dark:bg-slate-800 flex-shrink-0 space-y-2">
            <div className="flex items-center justify-between mb-2 px-1">
              <span className="text-sm text-gray-600 dark:text-gray-300 font-medium">每小时自动下载备份</span>
              <label className="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" className="sr-only peer toggle-checkbox" checked={isAutoBackup} onChange={() => setIsAutoBackup(!isAutoBackup)} />
                <div className="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-indigo-300 dark:peer-focus:ring-indigo-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600 toggle-label"></div>
              </label>
            </div>
            
            <div className="grid grid-cols-2 gap-3">
              <button onClick={exportData} className="flex items-center justify-center gap-2 p-3 bg-gray-50 dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-lg text-gray-600 dark:text-gray-300 text-sm hover:bg-gray-100 dark:hover:bg-slate-600 active:scale-95 transition-transform"><Download size={16} /> 备份数据</button>
              <button onClick={() => fileInputRef.current?.click()} className="flex items-center justify-center gap-2 p-3 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-lg text-gray-600 dark:text-gray-300 text-sm hover:bg-gray-50 dark:hover:bg-slate-700 active:scale-95 transition-transform"><Upload size={16} /> 恢复备份</button>
              <input type="file" ref={fileInputRef} onChange={importData} className="hidden" accept=".json" />
            </div>
          </div>
          <div className="p-4 bg-white dark:bg-slate-800 border-t border-gray-100 dark:border-slate-700 transition-colors duration-300 flex-shrink-0 pb-[calc(1rem+env(safe-area-inset-bottom))]">
            <div className="flex gap-2"><input type="text" value={nameInput} onChange={(e) => setNameInput(e.target.value)} placeholder="新账户名称..." className={`flex-1 px-4 py-2 bg-gray-100 dark:bg-slate-700 dark:text-white rounded-lg focus:outline-none focus:ring-2 text-sm ${getTheme('indigo').ring.replace('ring-', 'focus:ring-')}`} /><button onClick={() => { addUser(nameInput); setNameInput(''); }} disabled={!nameInput.trim()} className={`px-4 ${getTheme('indigo').base} text-white rounded-lg disabled:opacity-50 disabled:cursor-not-allowed font-medium text-sm hover:opacity-90 active:scale-95 transition-all`}>新建</button></div>
          </div>
        </div>
      );
    };

    function App() {
      const [store, setStore] = useState(() => { try { const saved = localStorage.getItem(STORAGE_KEY); return saved ? JSON.parse(saved) : INITIAL_DATA; } catch (e) { return INITIAL_DATA; } });
      const [isDarkMode, setIsDarkMode] = useState(() => { try { const saved = localStorage.getItem(THEME_MODE_KEY); return saved ? JSON.parse(saved) : false; } catch (e) { return false; } });
      const [isAutoBackup, setIsAutoBackup] = useState(() => { try { const saved = localStorage.getItem(AUTO_BACKUP_KEY); return saved ? JSON.parse(saved) : false; } catch (e) { return false; } });
      const [now, setNow] = useState(Date.now());
      const [isAlarmActive, setIsAlarmActive] = useState(false); 
      const fbRef = useRef(null);
      const unsubRef = useRef(null);
      const storeRef = useRef(store); // Keep ref for interval

      useEffect(() => { const timer = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(timer); }, []);
      const [view, setView] = useState('todo'); 
      const [calendarDate, setCalendarDate] = useState(new Date());
      const [editingTaskId, setEditingTaskId] = useState(null); 
      const [editingUser, setEditingUser] = useState(null);
      const [selectedDate, setSelectedDate] = useState(null);
      
      useEffect(() => { if (window.initFirebaseSystem) { window.initFirebaseSystem().then(res => { if (res) fbRef.current = res; }); } }, []);
      
      useEffect(() => { 
        localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); 
        storeRef.current = store; // Update ref on store change
      }, [store]);
      
      useEffect(() => { 
        localStorage.setItem(THEME_MODE_KEY, JSON.stringify(isDarkMode)); 
        if (isDarkMode) { document.documentElement.classList.add('dark'); } else { document.documentElement.classList.remove('dark'); } 
      }, [isDarkMode]);

      useEffect(() => {
        localStorage.setItem(AUTO_BACKUP_KEY, JSON.stringify(isAutoBackup));
      }, [isAutoBackup]);

      // Auto Backup Interval
      useEffect(() => {
        if (!isAutoBackup) return;
        const interval = setInterval(() => {
            const dataStr = JSON.stringify(storeRef.current, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2,'0')}${now.getMinutes().toString().padStart(2,'0')}`;
            a.download = `daily_loop_auto_backup_${getTodayString()}_${timeStr}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            console.log("Auto backup triggered");
        }, 3600 * 1000); // 1 hour
        return () => clearInterval(interval);
      }, [isAutoBackup]);
      
      useEffect(() => {
         const syncKey = store.cloudKey;
         if (!syncKey || !fbRef.current) { if (unsubRef.current) { unsubRef.current(); unsubRef.current = null; } return; }
         const { db, appId } = fbRef.current;
         const { doc, onSnapshot } = window.firebaseApi;
         const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'daily_loop_sync', syncKey);
         unsubRef.current = onSnapshot(docRef, (snapshot) => {
            if (snapshot.exists()) {
               const cloudData = snapshot.data();
               if (cloudData.users && cloudData.userData) { setStore(prev => { if (JSON.stringify(prev) === JSON.stringify(cloudData)) return prev; return cloudData; }); }
            }
         }, (err) => console.error("Sync error", err));
         return () => { if (unsubRef.current) unsubRef.current(); };
      }, [store.cloudKey]);

      useEffect(() => {
         const syncKey = store.cloudKey;
         if (!syncKey || !fbRef.current) return;
         const handler = setTimeout(() => {
            const { db, appId } = fbRef.current;
            const { doc, setDoc } = window.firebaseApi;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'daily_loop_sync', syncKey);
            setDoc(docRef, store).catch(e => console.error("Push failed", e));
         }, 1000); 
         return () => clearTimeout(handler);
      }, [store]);

      useEffect(() => {
         setStore(prevStore => {
            let hasUpdates = false;
            let alarmTriggered = false;
            const newUserData = { ...prevStore.userData };
            Object.keys(newUserData).forEach(username => {
               const user = newUserData[username];
               if (user.activeTimer && now >= user.activeTimer.endTime) {
                  if (!user.activeTimer.isFinished) {
                      hasUpdates = true;
                      alarmTriggered = true;
                      const addedMinutes = Math.round(user.activeTimer.duration / 60000);
                      const newTasks = user.tasks.map(t => { if (t.id === user.activeTimer.taskId) return { ...t, totalTime: (t.totalTime || 0) + addedMinutes }; return t; });
                      newUserData[username] = { ...user, tasks: newTasks, activeTimer: { ...user.activeTimer, isFinished: true } };
                  }
               }
            });
            if (hasUpdates) { if (alarmTriggered) setTimeout(() => setIsAlarmActive(true), 0); return { ...prevStore, userData: newUserData }; }
            return prevStore;
         });
      }, [now]); 

      const toggleDarkMode = () => setIsDarkMode(prev => !prev);
      const currentUserData = store.userData[store.currentUser] || { tasks: [], history: {}, theme: 'indigo', timerDuration: 25 };
      const currentTheme = getTheme(currentUserData.theme);
      const todayStr = getTodayString();
      const updateTimerDuration = (val) => { setStore(prev => ({ ...prev, userData: { ...prev.userData, [prev.currentUser]: { ...prev.userData[prev.currentUser], timerDuration: val } } })); };
      const setCloudKey = (key) => setStore(prev => ({ ...prev, cloudKey: key }));
      useEffect(() => { if (!store.currentUser) return; const tasks = currentUserData.tasks || []; if (tasks.length === 0) return; const completedCount = tasks.filter(t => { const dates = t.doneDates || (t.lastDone ? [t.lastDone] : []); return dates.includes(todayStr); }).length; const ratio = completedCount / tasks.length; if (currentUserData.history?.[todayStr] !== ratio) { setStore(prev => ({ ...prev, userData: { ...prev.userData, [prev.currentUser]: { ...prev.userData[prev.currentUser], history: { ...(prev.userData[prev.currentUser].history || {}), [todayStr]: ratio } } } })); } }, [currentUserData.tasks, store.currentUser, todayStr]);
      const toggleTask = (taskId) => { setStore(prev => { const userTasks = prev.userData[prev.currentUser].tasks; const updatedTasks = userTasks.map(t => { if (t.id === taskId) { const currentDoneDates = t.doneDates || (t.lastDone ? [t.lastDone] : []); const isDoneToday = currentDoneDates.includes(todayStr); let newDoneDates; if (isDoneToday) { newDoneDates = currentDoneDates.filter(d => d !== todayStr); } else { newDoneDates = [...currentDoneDates, todayStr]; } return { ...t, doneDates: newDoneDates, lastDone: isDoneToday ? '' : todayStr }; } return t; }); return { ...prev, userData: { ...prev.userData, [prev.currentUser]: { ...prev.userData[prev.currentUser], tasks: updatedTasks } } }; }); };
      const startTimer = (taskId, durationMs) => { setStore(prev => { const userData = { ...prev.userData[prev.currentUser] }; userData.activeTimer = { taskId, endTime: Date.now() + durationMs, duration: durationMs }; return { ...prev, userData: { ...prev.userData, [prev.currentUser]: userData } }; }); };
      const cancelTimer = () => { setStore(prev => { const userData = { ...prev.userData[prev.currentUser] }; userData.activeTimer = null; return { ...prev, userData: { ...prev.userData, [prev.currentUser]: userData } }; }); };
      const updateTaskText = (taskId, newText) => { if (!newText.trim()) return; setStore(prev => { const userTasks = prev.userData[prev.currentUser].tasks; const updatedTasks = userTasks.map(t => t.id === taskId ? { ...t, text: newText } : t); return { ...prev, userData: { ...prev.userData, [prev.currentUser]: { ...prev.userData[prev.currentUser], tasks: updatedTasks } } }; }); setEditingTaskId(null); };
      const addTask = (text) => { if (!text.trim()) return; setStore(prev => { const newTask = { id: Date.now(), text: text, doneDates: [], lastDone: '', totalTime: 0 }; const currentTasks = prev.userData[prev.currentUser].tasks || []; return { ...prev, userData: { ...prev.userData, [prev.currentUser]: { ...prev.userData[prev.currentUser], tasks: [...currentTasks, newTask] } } }; }); };
      const deleteTask = (taskId) => { if (!window.confirm("确定要删除这个任务吗？历史记录将不再显示该任务。")) return; setStore(prev => { const updatedTasks = prev.userData[prev.currentUser].tasks.filter(t => t.id !== taskId); let activeTimer = prev.userData[prev.currentUser].activeTimer; if (activeTimer && activeTimer.taskId === taskId) { activeTimer = null; } return { ...prev, userData: { ...prev.userData, [prev.currentUser]: { ...prev.userData[prev.currentUser], tasks: updatedTasks, activeTimer } } }; }); };
      const renameUser = (oldName, newName) => { if (!newName.trim() || newName === oldName) { setEditingUser(null); return; } if (store.users.includes(newName)) { alert("该用户名已存在"); return; } setStore(prev => { const newUsers = prev.users.map(u => u === oldName ? newName : u); const newUserData = { ...prev.userData }; newUserData[newName] = newUserData[oldName]; delete newUserData[oldName]; return { ...prev, users: newUsers, currentUser: prev.currentUser === oldName ? newName : prev.currentUser, userData: newUserData }; }); setEditingUser(null); };
      const addUser = (name) => { if (!name || store.users.includes(name)) return; const nextThemeIndex = store.users.length % THEME_KEYS.length; const newTheme = THEME_KEYS[nextThemeIndex]; setStore(prev => ({ ...prev, users: [...prev.users, name], currentUser: name, userData: { ...prev.userData, [name]: { tasks: [], history: {}, theme: newTheme, timerDuration: 25 } } })); setView('todo'); };
      const switchUser = (name) => { setStore(prev => ({ ...prev, currentUser: name })); setView('todo'); };
      const quickSwitchUser = (e) => { e.stopPropagation(); const currentIndex = store.users.indexOf(store.currentUser); const nextIndex = (currentIndex + 1) % store.users.length; const nextUser = store.users[nextIndex]; setStore(prev => ({ ...prev, currentUser: nextUser })); setView('todo'); };
      const deleteUser = (name) => { if (store.users.length <= 1) { alert("至少保留一个账户"); return; } if (!window.confirm(`确定要删除账户 "${name}" 吗？`)) return; setStore(prev => { const newUsers = prev.users.filter(u => u !== name); const newUserData = { ...prev.userData }; delete newUserData[name]; return { ...prev, users: newUsers, currentUser: newUsers[0], userData: newUserData }; }); };
      const exportData = () => { const dataStr = JSON.stringify(store, null, 2); const blob = new Blob([dataStr], { type: "application/json" }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `daily_loop_backup_${getTodayString()}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); };
      const importData = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (event) => { try { const importedData = JSON.parse(event.target.result); if (importedData.users && importedData.userData) { if (window.confirm("这将覆盖当前所有数据，确定要导入吗？")) { setStore(importedData); alert("导入成功！"); setView('todo'); } } else { alert("文件格式不正确"); } } catch (err) { alert("文件解析失败"); } }; reader.readAsText(file); e.target.value = ''; };

      const stopAlarm = () => {
        if (isAlarmActive) {
          setIsAlarmActive(false);
          setStore(prev => {
            const newUserData = { ...prev.userData };
            let hasChanges = false;
            Object.keys(newUserData).forEach(username => {
              if (newUserData[username].activeTimer && newUserData[username].activeTimer.isFinished) {
                newUserData[username] = { ...newUserData[username], activeTimer: null };
                hasChanges = true;
              }
            });
            return hasChanges ? { ...prev, userData: newUserData } : prev;
          });
        }
      };

      return (
        <div onClick={stopAlarm} className={`flex justify-center items-center w-full h-[100dvh] bg-gray-200 dark:bg-gray-900 transition-colors duration-300 sm:p-4 sm:items-center sm:justify-center`}>
          <div className={`relative bg-white dark:bg-slate-800 shadow-2xl overflow-hidden flex flex-col transition-colors duration-300 w-full h-full sm:w-[320px] sm:h-[85vh] sm:max-h-[1000px] sm:rounded-[20px] ${isAlarmActive ? 'alarm-mode' : ''}`}>
            {isAlarmActive && <div className="absolute inset-0 pointer-events-none alarm-overlay-anim z-50"></div>}

            {view !== 'users' && <Header currentUser={store.currentUser} users={store.users} view={view} setView={setView} isDarkMode={isDarkMode} toggleDarkMode={toggleDarkMode} setEditingUser={setEditingUser} renameUser={renameUser} quickSwitchUser={quickSwitchUser} currentTheme={currentTheme} editingUser={editingUser} />}
            <div className="flex-1 relative overflow-hidden">
              {view === 'todo' && <TodoView 
                tasks={currentUserData.tasks} 
                todayStr={todayStr} 
                currentTheme={currentTheme} 
                activeTimer={currentUserData.activeTimer} 
                now={now} 
                timerDuration={currentUserData.timerDuration || 25} 
                updateTimerDuration={updateTimerDuration} 
                editingTaskId={editingTaskId} 
                setEditingTaskId={setEditingTaskId} 
                toggleTask={toggleTask} 
                updateTaskText={updateTaskText} 
                addTask={addTask} 
                deleteTask={deleteTask} 
                startTimer={startTimer} 
                cancelTimer={cancelTimer} 
                isAlarmActive={isAlarmActive} 
                users={store.users}
                userData={store.userData}
                currentUser={store.currentUser}
                switchUser={switchUser} 
              />}
              {view === 'calendar' && <CalendarView calendarDate={calendarDate} setCalendarDate={setCalendarDate} history={currentUserData.history} todayStr={todayStr} currentTheme={currentTheme} setSelectedDate={setSelectedDate} selectedDate={selectedDate} tasks={currentUserData.tasks} />}
              {view === 'users' && <UsersView users={store.users} currentUser={store.currentUser} storeUserData={store.userData} switchUser={switchUser} renameUser={renameUser} addUser={addUser} deleteUser={deleteUser} setView={setView} editingUser={editingUser} setEditingUser={setEditingUser} exportData={exportData} importData={importData} cloudKey={store.cloudKey} setCloudKey={setCloudKey} isAutoBackup={isAutoBackup} setIsAutoBackup={setIsAutoBackup} />}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
